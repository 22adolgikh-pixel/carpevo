<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpet Phylogeny — Прототип</title>
    <style>
        /* === СТИЛИ (CSS) === */
        :root {
            --bg: #1e1e2f;
            --card: #2a2a40;
            --accent: #e9a23b;
            --text: #eee;
            --muted: #a0a0b0;
            --flourishing: #2ecc71;
            --active: #f1c40f;
            --extinct: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 30px;
        }
        h1 { font-size: 2.5em; color: var(--accent); margin-bottom: 10px; }
        .subtitle { color: var(--muted); font-size: 1.1em; }
        
        .controls {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 10px 20px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn:hover, .btn.active { background: var(--accent); color: #1e1e2f; font-weight: bold; }
        
        .motif-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .motif-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
        }
        .motif-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .status-flourishing { background: var(--flourishing); box-shadow: 0 0 10px var(--flourishing); }
        .status-active { background: var(--active); box-shadow: 0 0 10px var(--active); }
        .status-extinct { background: var(--extinct); box-shadow: 0 0 10px var(--extinct); }
        
        .motif-name { font-size: 1.4em; font-weight: bold; margin-bottom: 8px; color: var(--accent); }
        .motif-info { font-size: 0.9em; color: var(--muted); }
        
        .detail-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
            border: 2px solid var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        .detail-panel.visible { display: block; }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5em;
            cursor: pointer;
        }
        .evolution-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
        }
        h3 { color: var(--accent); margin: 15px 0 10px; }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧶 Carpet Phylogeny</h1>
            <p class="subtitle">Эволюция ковровых мотивов: от древности до наших дней</p>
        </header>

        <div class="controls">
            <button class="btn active" onclick="filterMotifs('all', this)">Все мотивы</button>
            <button class="btn" onclick="filterMotifs('flourishing', this)">🟢 Процветающие</button>
            <button class="btn" onclick="filterMotifs('active', this)">🟡 Активные</button>
            <button class="btn" onclick="filterMotifs('extinct', this)">🔴 Вымершие</button>
        </div>

        <div class="motif-grid" id="motifGrid"></div>
    </div>

    <!-- Модальное окно -->
    <div class="detail-panel" id="detailPanel">
        <button class="close-btn" onclick="closeDetails()">✕</button>
        <div id="detailContent"></div>
    </div>

    <script>
        // === ДАННЫЕ (JSON в JS) ===
        const motifs = [
            {
                id: "gol",
                name: "Гёль (Ромб)",
                type: "Геометрический",
                firstAppearance: "-400",
                origin: "Центральная Азия",
                status: "active",
                symbolism: ["Защита", "Плодородие", "Родовая тамга"],
                evolution: [
                    { name: "Туркменский гёль", period: "400 BC - наст.", status: "flourishing", changes: "Классическая форма с крюками" },
                    { name: "Анатолийский гёль", period: "1100 - наст.", status: "active", changes: "Упрощение, убраны крюки" },
                    { name: "Гёль с орлиными когтями", period: "1400-1700", status: "extinct", changes: "Зооморфные добавления (вымер)" }
                ]
            },
            {
                id: "palmette",
                name: "Пальметта",
                type: "Растительный",
                firstAppearance: "-2000",
                origin: "Месопотамия",
                status: "flourishing",
                symbolism: ["Жизнь", "Рай", "Божественность"],
                evolution: [
                    { name: "Ассирийская пальметта", period: "2000-600 BC", status: "extinct", changes: "Исходная форма" },
                    { name: "Шах-Аббаси", period: "1550 - наст.", status: "flourishing", changes: "Полная флорализация" },
                    { name: "Османская пальметта", period: "1500 - наст.", status: "active", changes: "Крупная, с золотом" }
                ]
            },
            {
                id: "mihrab",
                name: "Михраб",
                type: "Архитектурный",
                firstAppearance: "700",
                origin: "Аравия",
                status: "flourishing",
                symbolism: ["Молитва", "Врата рая"],
                evolution: [
                    { name: "Ранний михраб", period: "700-1000", status: "extinct", changes: "Простая арка" },
                    { name: "Персидский михраб", period: "1300 - наст.", status: "flourishing", changes: "Добавлены цветы и лампа" },
                    { name: "Кавказский михраб", period: "1600 - наст.", status: "active", changes: "Ступенчатая геометрия" }
                ]
            },
            {
                id: "boteh",
                name: "Ботех (Пейсли)",
                type: "Растительный",
                firstAppearance: "224",
                origin: "Персия",
                status: "flourishing",
                symbolism: ["Кипарис", "Вечность", "Пламя"],
                evolution: [
                    { name: "Сасанидский ботех", period: "224-651", status: "extinct", changes: "Прямой кипарис" },
                    { name: "Кашмирский ботех", period: "1700 - наст.", status: "flourishing", changes: "Изогнутый, плотный" },
                    { name: "Европейский пейсли", period: "1800 - наст.", status: "flourishing", changes: "Индустриальный дизайн" }
                ]
            },
            {
                id: "dragon",
                name: "Дракон",
                type: "Зооморфный",
                firstAppearance: "-2000",
                origin: "Китай",
                status: "extinct",
                symbolism: ["Власть", "Император", "Удача"],
                evolution: [
                    { name: "Китайский дракон", period: "2000 BC - наст.", status: "flourishing", changes: "Исходная форма" },
                    { name: "Монгольский дракон", period: "1200-1400", status: "extinct", changes: "Более агрессивный стиль" },
                    { name: "Персидский дракон", period: "1300-1700", status: "extinct", changes: "Превратился в цветочный орнамент" }
                ]
            },
            {
                id: "tree",
                name: "Древо жизни",
                type: "Символический",
                firstAppearance: "-3000",
                origin: "Месопотамия",
                status: "active",
                symbolism: ["Жизнь", "Плодородие", "Связь миров"],
                evolution: [
                    { name: "Шумерское древо", period: "3000-500 BC", status: "extinct", changes: "Стилизованное" },
                    { name: "Персидское древо", period: "1500 - наст.", status: "flourishing", changes: "Растительное, с птицами" },
                    { name: "Анатолийское древо", period: "1400 - наст.", status: "active", changes: "Геометрическое, в арке" }
                ]
            }
        ];

        // === ЛОГИКА ===
        function filterMotifs(filter, btn) {
            // Обновляем активную кнопку
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Фильтруем
            const filtered = filter === 'all' ? motifs : motifs.filter(m => m.status === filter);
            renderMotifs(filtered);
        }

        function renderMotifs(list) {
            const grid = document.getElementById('motifGrid');
            grid.innerHTML = '';
            
            list.forEach(motif => {
                const card = document.createElement('div');
                card.className = 'motif-card';
                card.onclick = () => showDetails(motif);
                
                card.innerHTML = `
                    <div class="status-badge status-${motif.status}"></div>
                    <div class="motif-name">${motif.name}</div>
                    <div class="motif-info">
                        <p><strong>Происхождение:</strong> ${motif.origin}</p>
                        <p><strong>Появление:</strong> ${motif.firstAppearance} год</p>
                        <p><strong>Символы:</strong> ${motif.symbolism.join(', ')}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showDetails(motif) {
            const panel = document.getElementById('detailPanel');
            const content = document.getElementById('detailContent');
            panel.classList.add('visible');
            
            content.innerHTML = `
                <h2 style="color: #e9a23b;">${motif.name}</h2>
                <p><strong>Тип:</strong> ${motif.type}</p>
                <p><strong>Происхождение:</strong> ${motif.origin}</p>
                <p><strong>Первое появление:</strong> ${motif.firstAppearance} год</p>
                
                <h3>🔄 Эволюция</h3>
                ${motif.evolution.map(ev => `
                    <div class="evolution-item">
                        <h4>
                            <span class="status-badge status-${ev.status}" style="position: static; display: inline-block; margin-right: 10px;"></span>
                            ${ev.name}
                        </h4>
                        <p><strong>Период:</strong> ${ev.period}</p>
                        <p><strong>Изменения:</strong> ${ev.changes}</p>
                    </div>
                `).join('')}
            `;
        }

        function closeDetails() {
            document.getElementById('detailPanel').classList.remove('visible');
        }

        // Запуск при загрузке
        renderMotifs(motifs);
    </script>
</body>
</html>
