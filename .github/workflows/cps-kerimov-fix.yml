# Разовое исправление подписей схем Керимова т. I на сервере (cps/tools/kerimov_fix/README.md).
# Запуск: push в ветку ops/kerimov-fix-dry (сухой прогон, только отчёт) или ops/kerimov-fix-apply (запись);
# или вручную (Run workflow), когда файл есть в ветке по умолчанию.
# Скрипт сам делает бэкап в data/backup_kerimov_fix_<время>/ и отказывается работать повторно.
name: "CPS: исправить Керимова"
on:
  push:
    branches: [ops/kerimov-fix-dry, ops/kerimov-fix-apply, ops/cps-backup-now]
  workflow_dispatch:
    inputs:
      apply:
        description: "записать изменения (иначе только отчёт)"
        type: boolean
        default: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: cps-deploy
    env:
      HOST: ${{ secrets.CPS_SSH_HOST }}
      USER_: ${{ secrets.CPS_SSH_USER }}
      KEY: ${{ secrets.CPS_SSH_KEY }}
      DIR: ${{ vars.CPS_SERVER_DIR || '~/carpevo' }}
      APPLY: ${{ (inputs.apply || github.ref_name == 'ops/kerimov-fix-apply') && '--apply' || '' }}
    steps:
      - name: Прогон на сервере
        run: |
          install -m 700 -d ~/.ssh
          if printf '%s' "$KEY" | grep -q "BEGIN"; then printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key; else printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key; fi
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_@$HOST" bash -s "$DIR" "$APPLY" "${{ github.ref_name }}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          echo "на сервере: $(git log --oneline -1)"
          cd cps/deploy
          if [ "${3:-}" = "ops/cps-backup-now" ]; then
            docker compose -f docker-compose.existing-nginx.yml exec -T cps sh -c 'echo "токен задан: $([ -n "$CPS_GITHUB_TOKEN" ] && echo да || echo нет)"; python -c "import backup; print(backup.backup_once(\"/app\", \"/app/data\", \"вручную\"))"'
          else
            docker compose -f docker-compose.existing-nginx.yml exec -T cps python tools/kerimov_fix/apply_kerimov_fix.py /app/data ${2:-}
          fi
          REMOTE
