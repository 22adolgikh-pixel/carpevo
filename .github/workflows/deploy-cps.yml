# Выкладывает папку cps/ в Hugging Face Space при каждом пуше.
# Нужно в Settings → Secrets and variables → Actions:
#   секрет    HF_TOKEN  — токен Hugging Face с правом записи
#   переменная HF_SPACE — имя Space, например  user/carpet-pattern-studio
name: Deploy CPS to Hugging Face
on:
  push:
    branches: [cps-v5, main]
    paths: ["cps/**", ".github/workflows/deploy-cps.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Upload cps/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Нет секрета HF_TOKEN"; exit 1; }
          test -n "$HF_SPACE" || { echo "::error::Нет переменной HF_SPACE"; exit 1; }
          pip install -q "huggingface_hub>=0.24"
          rm -rf /tmp/space && cp -r cps /tmp/space
          mv /tmp/space/README.md /tmp/space/CPS_README.md
          mv /tmp/space/SPACE_README.md /tmp/space/README.md
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(repo_id=space, repo_type="space", folder_path="/tmp/space",
                            commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
                            ignore_patterns=["scans/**", "data/crops/**", "data/out/**", ".venv/**", "__pycache__/**"])
          print("Готово: https://huggingface.co/spaces/" + space)
          PY
