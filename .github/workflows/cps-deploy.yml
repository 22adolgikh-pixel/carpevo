# Автодеплой CPS на VPS: после успешных тестов (workflow «CPS tests») на ветке cps-v5 заходит на сервер по SSH,
# подтягивает код и пересобирает контейнер. Включается, когда в Settings → Secrets and variables → Actions заданы
# CPS_SSH_HOST, CPS_SSH_USER, CPS_SSH_KEY (отдельный ключ только для деплоя). Пока секретов нет — шаг пропускается, ошибок нет.
# Подробности и настройка сервера: cps/deploy/AUTODEPLOY.md
name: CPS deploy
on:
  workflow_run:
    workflows: ["CPS tests"]
    types: [completed]
    branches: [cps-v5]
  workflow_dispatch:

concurrency: cps-deploy

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.CPS_SSH_HOST }}
      USER_: ${{ secrets.CPS_SSH_USER }}
      KEY: ${{ secrets.CPS_SSH_KEY }}
      DIR: ${{ vars.CPS_SERVER_DIR || '~/carpevo' }}
    steps:
      - name: Проверка секретов
        id: chk
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_" ] || [ -z "$KEY" ]; then echo "ok=no" >> "$GITHUB_OUTPUT"; echo "::notice::Секреты деплоя не заданы — пропускаю"; else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Деплой
        if: steps.chk.outputs.ok == 'yes'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_@$HOST" bash -s "$DIR" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch -q origin cps-v5
          git checkout -q cps-v5
          git pull -q --ff-only origin cps-v5
          echo "на сервере: $(git log --oneline -1)"
          cd cps/deploy
          docker compose -f docker-compose.existing-nginx.yml up -d --build 2>&1 | tail -15
          ok=0
          for i in $(seq 1 30); do
            code=$(docker compose -f docker-compose.existing-nginx.yml exec -T cps python deploy/healthcheck.py 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then ok=1; break; fi
            sleep 3
          done
          docker compose -f docker-compose.existing-nginx.yml ps
          if [ "$ok" != "1" ]; then docker compose -f docker-compose.existing-nginx.yml logs --tail 60 cps; echo "::error::студия не отвечает после пересборки"; exit 1; fi
          echo "студия отвечает ($code)"
          REMOTE
