# Автотесты CPS: на каждый push / PR в cps-v5, где менялась папка cps/.
# После зелёных тестов на push (job deploy ниже) — автодеплой на VPS, если заданы секреты CPS_SSH_* (cps/deploy/AUTODEPLOY.md).
# Поднимают студию на копии кода с тестовыми данными и проходят экраны в браузере (см. cps/TESTING.md).
name: CPS tests
on:
  push:
    branches: [cps-v5]
    paths: ['cps/**', '.github/workflows/cps-tests.yml']
  pull_request:
    branches: [cps-v5]
    paths: ['cps/**', '.github/workflows/cps-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cps/requirements.txt
      - name: Install
        run: |
          pip install -r cps/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: JS syntax check
        run: |
          python - <<'EOF'
          import re
          s = open('cps/index.html', encoding='utf-8').read()
          open('/tmp/cps.js', 'w').write('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))
          EOF
          node --check /tmp/cps.js
      - name: Run tests
        run: python cps/tests/run_tests.py
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-test-screenshots
          path: cps/tests/out/
          retention-days: 14

  deploy:
    needs: test
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    concurrency: cps-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.CPS_SSH_HOST }}
      USER_: ${{ secrets.CPS_SSH_USER }}
      KEY: ${{ secrets.CPS_SSH_KEY }}
      DIR: ${{ vars.CPS_SERVER_DIR || '~/carpevo' }}
    steps:
      - name: Проверка секретов
        id: chk
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_" ] || [ -z "$KEY" ]; then echo "ok=no" >> "$GITHUB_OUTPUT"; echo "::notice::Секреты деплоя не заданы — пропускаю"; else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Деплой
        if: steps.chk.outputs.ok == 'yes'
        run: |
          install -m 700 -d ~/.ssh
          # ключ можно хранить в секрете как есть (многострочный) или одной строкой base64 (надёжнее при вставке)
          if printf '%s' "$KEY" | grep -q "BEGIN"; then printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key; else printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true; fi
          chmod 600 ~/.ssh/deploy_key
          # диагностика входа: причина попадает в аннотацию задания (без ключа и секретов)
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2> /tmp/kg.err; then echo "::error::CPS_SSH_KEY не читается как SSH-ключ: $(tr '\n' ' ' < /tmp/kg.err | cut -c1-200). Вставьте приватный ключ целиком, с первой строки BEGIN до последней END."; exit 1; fi
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$USER_@$HOST" true 2> /tmp/ssh.err; then echo "::error::SSH не вошёл: $(tr '\n' ' ' < /tmp/ssh.err | sed "s/$HOST/<host>/g" | cut -c1-300)"; exit 1; fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_@$HOST" bash -s "$DIR" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch -q origin cps-v5
          git checkout -q cps-v5
          git pull -q --ff-only origin cps-v5
          echo "на сервере: $(git log --oneline -1)"
          cd cps/deploy
          docker compose -f docker-compose.existing-nginx.yml up -d --build 2>&1 | tail -15
          ok=0
          for i in $(seq 1 30); do
            code=$(docker compose -f docker-compose.existing-nginx.yml exec -T cps python deploy/healthcheck.py 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then ok=1; break; fi
            sleep 3
          done
          docker compose -f docker-compose.existing-nginx.yml ps
          if [ "$ok" != "1" ]; then docker compose -f docker-compose.existing-nginx.yml logs --tail 60 cps; echo "::error::студия не отвечает после пересборки"; exit 1; fi
          echo "студия отвечает ($code)"
          REMOTE
