<script>
const VISUAL_DATA = /*@@VISUAL_DATA@@*/{};

function normalizeElementLabel(s){
  // Лёгкая нормализация для группировки: "ислими" и "ислими (растительная
  // вязь)" — одно и то же, поясняющая скобка не должна плодить дубли.
  return (s||'').replace(/\s*\([^)]*\)\s*$/, '').trim().toLowerCase();
}
const CONFIDENCE_RANK = {high: 3, medium: 2, low: 1};

// Явный порядок азербайджанского алфавита — НЕ полагаемся на localeCompare('az'),
// потому что поддержка этой локали в Intl у браузеров непредсказуема (в Node.js
// с полным ICU всё сортируется верно, а в реальном браузере может незаметно
// откатиться на "общую" коллацию, где Ş воспринимается как вариант S — из-за
// этого буквы чередуются вместо группировки). Явная таблица работает одинаково
// везде, без зависимости от того, что у браузера есть в комплекте.
const AZ_ALPHABET = 'aAbBcCçÇdDeEəƏfFgGğĞhHxXıIiİjJkKqQlLmMnNoOöÖpPrRsSşŞtTuUüÜvVyYzZ';
const AZ_ORDER = {};
for (let i = 0; i < AZ_ALPHABET.length; i += 2) {
  AZ_ORDER[AZ_ALPHABET[i]] = i / 2;
  AZ_ORDER[AZ_ALPHABET[i+1]] = i / 2;
}
function azCompare(a, b){
  a = a || ''; b = b || '';
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const ca = a[i], cb = b[i];
    if (ca === undefined) return -1;
    if (cb === undefined) return 1;
    if (ca === cb) continue;
    const oa = AZ_ORDER[ca], ob = AZ_ORDER[cb];
    if (oa !== undefined && ob !== undefined) { if (oa !== ob) return oa - ob; continue; }
    // символы вне алфавита (пробел, дефис, цифры) — обычное сравнение как запасной путь
    if (ca < cb) return -1;
    if (ca > cb) return 1;
  }
  return 0;
}

// Собирает уникальные визуальные элементы со всех страниц-источников этой
// записи (мотива/элемента) — данные отдельного, более дорогого прохода
// моделью-зрением (см. visual_pass1.py), не того же извлечения, что текст.
// pagesOf() определена ниже вместе с sourceKey() (используется также для
// перекрёстных ссылок мотив<->элемент по совпадению страниц).
function visualElementsForItem(item){
  const pages = pagesOf(item);
  const byLabel = new Map();
  pages.forEach(pageKey => {
    const pageData = VISUAL_DATA[pageKey];
    if (!pageData) return;
    (pageData.elements_seen || []).forEach(e => {
      const norm = normalizeElementLabel(e.element);
      if (!norm) return;
      const existing = byLabel.get(norm);
      if (!existing || CONFIDENCE_RANK[e.confidence] > CONFIDENCE_RANK[existing.confidence]) {
        byLabel.set(norm, { element: e.element, confidence: e.confidence || 'medium', page: pageKey });
      }
    });
  });
  return [...byLabel.values()].sort((a,b) => (CONFIDENCE_RANK[b.confidence]||0) - (CONFIDENCE_RANK[a.confidence]||0));
}

const SCAN_LINKS = /*@@SCAN_LINKS@@*/{};

const DATA = /*@@DATA@@*/{};

/* ===== Словарь терминов (сверено с Керимовым 2026-09-27) =====
   Одна запись = один термин. Роли (мотив / элемент / кайма / ковёр) — поле, а не отдельные записи.
   id — латиница ASCII; старые id (motif_…, elem_…) продолжают работать через ALIASES. */
const TERMS = DATA.terms;
const ALIASES = DATA.aliases || {};
const TERM_BY_ID = {};
TERMS.forEach(t => { t.elem_id = t.id; TERM_BY_ID[t.id] = t; });
function resolveId(id){ return TERM_BY_ID[id] ? id : (ALIASES[id] || id); }
function findTerm(id){ return TERM_BY_ID[resolveId(id)] || null; }
const TAB_KEYS = ['motifs','elements','borders','carpets'];
TAB_KEYS.forEach(k => { DATA[k] = TERMS.filter(t => (t.tabs||[]).includes(k)); });
function isTermTab(t){ return TAB_KEYS.includes(t); }
const SOURCES = DATA.sources || [];
const SOURCE_BY_ID = {}; SOURCES.forEach(s => SOURCE_BY_ID[s.id] = s);
function srcTitle(s){ return (s.title && (s.title[state.lang] || s.title.ru)) || s.short; }
function srcNote(s){ return s.note ? (s.note[state.lang] || s.note.ru || '') : ''; }
function cf(c, f){ const d=c[f+'_i18n']; if (d && typeof d==='object') return d[state.lang] || d.ru || d.az || d.en || c[f]; return c[f]; }
function carrierUrl(c){ return c.url_tpl ? c.url_tpl.replace('{lang}', state.lang) : (c.url || null); }
function cleanSource(t){ return String(t||'').replace(/\s*\(файл[^)]*\)/g,''); }
DATA.carriers.forEach((c,i) => { c._i = i; });

const ROLE_LABEL = {
  ru:{element:'элемент',motif:'мотив',border:'кайма',composition:'ковёр (композиция)',object:'изделие',place:'место',group:'группа',school:'школа',generic:'общее слово',other:'другое'},
  az:{element:'element',motif:'motiv',border:'haşiyə',composition:'xalça (kompozisiya)',object:'məmulat',place:'yer',group:'qrup',school:'məktəb',generic:'ümumi söz',other:'digər'},
  en:{element:'element',motif:'motif',border:'border',composition:'carpet (composition)',object:'product type',place:'place',group:'group',school:'school',generic:'generic word',other:'other'}
};
function termsOnSamePages(item){
  const pages = pagesOf(item); if (!pages.size) return [];
  return TERMS.filter(t => t !== item && [...pagesOf(t)].some(p => pages.has(p)));
}
function setTab(t){
  state.tab = t;
  document.querySelectorAll('#tabList button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
}

let state = { tab: 'motifs', lang: 'ru', school: '', subgroup: '', query: '', source: '' };
function T(){ return I18N[state.lang]; }
function SL(){ return SCHOOL_LABEL[state.lang]; }

// Азербайджанская кириллица (алфавит 1958–1991, тот же, что в книге Керимова) ->
// современная латиница. Таблица сверена по BGN/PCGN и историческому алфавиту;
// перепроверено на реальном примере из наших же данных: "Гарабағ" по этой таблице
// даёт "Qarabağ" — настоящее современное название Карабаха, сходится.
const AZ_CYR_TO_LATIN_MAP = {
  'а':'a','б':'b','в':'v','г':'q','ғ':'ğ','д':'d','е':'e','ә':'ə','ж':'j','з':'z',
  'и':'i','ы':'ı','й':'y','ј':'y','к':'k','ҝ':'g','л':'l','м':'m','н':'n','о':'o',
  'ө':'ö','п':'p','р':'r','с':'s','т':'t','у':'u','ү':'ü','ф':'f','х':'x','һ':'h',
  'ч':'ç','ҹ':'c','ш':'ş','ъ':"'",'ь':'','ҟ':'q',
  'ю':'yu','я':'ya' // утечки русских букв в текст, помеченный как азербайджанский — не идеально фонетически, но убирает сырую кириллицу из результата
};
// Буквы, которых нет в обычном русском алфавите — по ним надёжно отличаем
// азербайджанскую кириллицу от русской там, где язык явно не помечен (элементы).
const AZ_ONLY_LETTERS = /[әғөүҝҹһјҟ]/i;

function transliterateAzCyrillic(s){
  if (!s) return s;
  // "дж" — русская запись звука, для которого в азерб. есть отдельная буква ҹ (c).
  // Обрабатываем как диграф ДО посимвольной замены, иначе д и ж уйдут по отдельности.
  s = s.replace(/дж/gi, m => m === m.toUpperCase() ? 'C' : 'c').replace(/Дж/g, 'C');
  let out = '';
  for (const ch of s) {
    const lower = ch.toLowerCase();
    const mapped = AZ_CYR_TO_LATIN_MAP[lower];
    if (mapped === undefined) { out += ch; continue; }
    // "Турецкая I-проблема": заглавная İ (с точкой) и I (без точки) — РАЗНЫЕ буквы в
    // азербайджанском, обычный .toUpperCase() их путает (даёт I вместо İ для "и").
    out += (ch === ch.toLocaleUpperCase('az') && ch !== lower)
      ? (mapped.charAt(0).toLocaleUpperCase('az') + mapped.slice(1))
      : mapped;
  }
  return out;
}
function looksAzCyrillic(s){ return !!s && AZ_ONLY_LETTERS.test(s); }
// Приводит любое имя к единому виду: Первая заглавная, остальные строчные —
// локале-осознанно (иначе латинское i/İ/ı/I в азербайджанском ломается).
function titleCase(s, locale){
  if (!s) return s;
  const lower = s.toLocaleLowerCase(locale);
  return lower.charAt(0).toLocaleUpperCase(locale) + lower.slice(1);
}
// Для полей без явной языковой метки (носители: motif_name, location и т.п.) —
// то же решение, что уже применяется к элементам: если похоже на азербайджанскую
// кириллицу, показываем латиницей. Цитаты (quote) через это НЕ пропускаем —
// это дословная выдержка, её менять нельзя.
function displayAzAware(s){ return looksAzCyrillic(s) ? transliterateAzCyrillic(s) : s; }

// Перекрёстные ссылки мотив<->элемент. Поле found_in_motifs у элементов почти
// всегда пустое (пробел в постраничном извлечении, не наша проблема) — поэтому
// связываем по более надёжному признаку, который у нас точно есть: упоминание
// на ОДНОЙ И ТОЙ ЖЕ странице книги (source есть у каждого mention).
function sourceKey(source){
  if (!source) return null;
  const m = source.match(/файл\s+([^)]+)/);
  return m ? m[1].trim() : source.trim();
}
function pagesOf(item){
  return new Set((item.mentions||[]).map(m => sourceKey(m.source)).filter(Boolean));
}
function findMotifByName(name){
  if (!name) return null;
  const norm = name.trim().toLowerCase();
  // сначала точное название (canonical_az / names), и только потом псевдонимы; среди равных — термин с большим числом упоминаний
  const byMentions = TERMS.slice().sort((a,b)=>b.mention_count-a.mention_count);
  const eq = n => n && n.trim().toLowerCase() === norm;
  return byMentions.find(m => eq(m.canonical_az) || [].concat(m.names.ru||[], m.names.az||[], m.names.en||[]).some(eq))
      || byMentions.find(m => (m.aliases||[]).some(eq)) || null;
}
// Если у носителя находится точное совпадение с уже переведённым мотивом —
// берём каноническое название ОТТУДА (надёжно), а не гадаем транслитерацией
// заново по сырому motif_name носителя.
function carrierDisplayName(c){
  if (c.trade_name) return titleCase(c.trade_name.replace(/^(A|AN)\s+/,''), 'en');
  if (c.names && (c.names.az || c.names.en)) return c.names.az || c.names.en;
  if (c.term_id && TERM_BY_ID[c.term_id]) return displayName(TERM_BY_ID[c.term_id]);
  const m = findMotifByName(c.motif_name);
  if (m) return displayName(m);
  return titleCase(displayAzAware(c.motif_name), 'ru') || '—';
}
function elementsOnSamePages(motif){
  const pages = pagesOf(motif);
  if (!pages.size) return [];
  return DATA.elements.filter(e => [...pagesOf(e)].some(p => pages.has(p)));
}
function motifsOnSamePages(element){
  const pages = pagesOf(element);
  if (!pages.size) return [];
  return DATA.motifs.filter(m => [...pagesOf(m)].some(p => pages.has(p)));
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Работает и для мотивов (есть .names/.id), и для элементов (только .elem_id) —
// раньше падало на элементах и роняло весь рендер (см. фикс displayName ниже).
// Азербайджанское название всегда транслитерируется в латиницу для показа —
// исходная кириллица остаётся доступна только для поиска (см. searchHaystack).
// Азербайджанская латиница — канонический заголовок ВЕЗДЕ, независимо от языка
// интерфейса (решение проекта: мультиязычность, не мультиверсионность — один
// список, один канонический заголовок, перевод показывается рядом отдельно).
function displayName(item){
  if (item.canonical_az) return titleCase(item.canonical_az, 'az');
  if (item.names) {
    // запасной путь для записей без перевода (не должно быть у мотивов после
    // прогона модели, но элементы пока не переведены)
    const raw = (item.names.az&&item.names.az[0]&&transliterateAzCyrillic(item.names.az[0])) ||
      (item.names.ru&&item.names.ru[0]) || (item.names.en&&item.names.en[0]) || item.id;
    return titleCase(raw, 'az');
  }
  if (item.elem_id) {
    if (item.canonical_az) return titleCase(item.canonical_az, 'az');
    const raw = item.elem_id.replace('elem_','');
    const az = looksAzCyrillic(raw);
    return titleCase(az ? transliterateAzCyrillic(raw) : raw, az ? 'az' : 'ru');
  }
  return item.id || item.elem_id || '?';
}
// Перевод-подпись под заголовком, для текущего языка интерфейса. Возвращает
// null, если перевода нет ИЛИ это имя собственное без смыслового перевода
// (тогда используем транскрипцию, если она есть) — никогда не подставляет
// заголовок как "перевод самого себя".
// Индекс "название -> запись" для превращения упоминаний мотивов/элементов
// в ссылки ГДЕ УГОДНО в тексте сайта (описания школ, связанные узоры и т.п.) —
// общее правило, а не точечное решение. Построен один раз по canonical_az
// (он уникален и уже везде используется как заголовок).
let NAME_LINK_INDEX = null;
let NAME_LINK_REGEX = null;
function buildNameLinkIndex(){
  const map = new Map();
  // сначала термины с большим числом упоминаний — при совпадении названий ссылка ведёт на основной
  TERMS.slice().sort((a,b)=>a.mention_count-b.mention_count).forEach(m => { if (m.canonical_az) map.set(m.canonical_az.toLowerCase(), {kind:'term', id:m.id}); });
  NAME_LINK_INDEX = map;
  // самые длинные названия — первыми, чтобы "buta" не перехватывал "badam buta"
  const names = [...map.keys()].filter(n => n.length >= 3).sort((a,b) => b.length - a.length);
  const escaped = names.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  NAME_LINK_REGEX = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'gi');
}
// Оборачивает найденные названия в кликабельные ссылки. text уже должен быть
// экранирован (esc()) ДО вызова — сама функция ничего не экранирует, только
// расставляет теги <a> вокруг совпадений.
function linkifyMentions(escapedText){
  if (!NAME_LINK_INDEX) buildNameLinkIndex();
  if (!escapedText) return escapedText;
  return escapedText.replace(NAME_LINK_REGEX, (match) => {
    const hit = NAME_LINK_INDEX.get(match.toLowerCase());
    if (!hit) return match;
    return `<a data-open="${hit.kind}" data-id="${esc(hit.id)}">${match}</a>`;
  });
}

function getMeaning(item){
  if (!item.canonical_az) return null;
  if (state.lang === 'az') return null; // заголовок уже на этом языке
  const meaning = state.lang === 'ru' ? item.ru_meaning : state.lang === 'en' ? item.en_meaning : null;
  if (meaning) return meaning;
  const translit = state.lang === 'ru' ? item.ru_translit : state.lang === 'en' ? item.en_translit : null;
  return translit || null;
}
function firstLetter(s){ const c=(s||'?').trim()[0]; return c ? c.toUpperCase() : '?'; }
function depthClass(item){
  const depths = new Set((item.mentions||[]).map(m=>m.mention_depth).filter(Boolean));
  if (depths.has('substantive')) return depths.has('passing') ? 'mixed' : 'substantive';
  return 'passing';
}
function depthWord(cls){ return cls==='substantive'?T().depthSubst:cls==='mixed'?T().depthMixed:T().depthPassing; }

function renderSchoolNav(){
  const nav = document.getElementById('schoolNav');
  const counts = {};
  Object.keys(SL()).forEach(s => counts[s] = 0);
  TERMS.forEach(m => (m.schools_mentioned_canonical||[]).forEach(s => { if (s in counts) counts[s]++; }));
  let html = '';
  html += `<li><button class="navlink ${!state.school?'active':''}" data-school-nav="">${state.lang==='ru'?'Все':state.lang==='az'?'Hamısı':'All'}</button></li>`;
  Object.keys(SL()).forEach(s => {
    if (!counts[s]) return;
    const active = state.school===s;
    html += `<li><button class="navlink ${active?'active':''}" data-school-nav="${esc(s)}">${esc(SL()[s])} <span style="color:var(--text-soft)">(${counts[s]})</span></button></li>`;
    if (active) {
      const subs = subgroupsForSchool(s).slice(0, 20);
      subs.forEach(([sg,cnt]) => {
        html += `<li style="padding-left:12px"><button class="navlink ${state.subgroup===sg?'active':''}" data-subgroup-nav="${esc(sg)}" style="font-size:12.5px">${esc(sg)} <span style="color:var(--text-soft)">(${cnt})</span></button></li>`;
      });
    }
  });
  nav.innerHTML = html;
}

function getList(){
  if (isTermTab(state.tab)) return DATA[state.tab];
  return DATA.carriers;
}

// Проверка «есть ли у записи название именно на этом языке» — для списка,
// в отличие от displayName(), которая при показе статьи всё ещё подстраховывается
// запасным вариантом, чтобы не показывать пустоту, если КОНКРЕТНУЮ статью открыли
// напрямую (например, по ссылке из другого места).
function itemHasLang(item, lang){
  if (item.names) {
    return !!(item.names[lang] && item.names[lang].length);
  }
  if (item.elem_id) {
    const isAz = looksAzCyrillic(item.elem_id.replace('elem_',''));
    if (lang === 'az') return isAz;
    if (lang === 'ru') return !isAz;
    return false; // английских названий элементов у нас нет вообще
  }
  return true;
}

function filteredSorted(){
  const q = state.query.trim().toLowerCase();
  let list = getList();
  if (state.source) list = list.filter(it => isTermTab(state.tab) ? ((it.source_counts||{})[state.source]) : it.source_id === state.source);
  if (state.tab !== 'carriers') {
    if (state.school) list = list.filter(m => (m.schools_mentioned_canonical||[]).includes(state.school));
    if (state.subgroup) list = list.filter(m => (m.subgroups_mentioned||[]).includes(state.subgroup));
    if (q) list = list.filter(item => {
      const hay = [item.id, ...(item.old_ids||[]), ...(item.canonical_az_variants||[]), item.canonical_az, item.ru_meaning, item.en_meaning, item.ru_translit, item.en_translit,
        ...(item.names?[].concat(item.names.ru||[],item.names.az||[],item.names.en||[]):[]), ...(item.mentions||[]).map(x=>x.quote)].join(' ').toLowerCase();
      return hay.includes(q);
    });
    return list.slice().sort((a,b)=> azCompare(displayName(a), displayName(b)));
  } else {
    if (q) list = list.filter(item => [item.motif_name,item.trade_name,item.quote,item.description,item.location,item.museum_or_collection].join(' ').toLowerCase().includes(q));
    return list;
  }
}

function subgroupsForSchool(school){
  const counts = new Map();
  TERMS.forEach(m => {
    const schools = m.schools_mentioned_canonical || [];
    // Берём подшколы ТОЛЬКО у мотивов с ОДНОЙ школой. У мотивов с несколькими
    // школами подшколы и школы слиты в общие списки без постраничной привязки
    // (см. Pass 2) — невозможно честно сказать, какая подшкола к какой школе
    // относится, поэтому не гадаем и не показываем (иначе Гарабағ всплывает
    // под Губа-Ширван и т.п.)
    if (schools.length !== 1 || schools[0] !== school) return;
    (m.subgroups_mentioned||[]).forEach(sg => counts.set(sg, (counts.get(sg)||0)+1));
  });
  return [...counts.entries()].sort((a,b)=>b[1]-a[1]);
}

function sectionDescription(){
  if (state.tab === 'motifs') return state.lang==='ru'
    ? 'Крупные самостоятельные фигуры орнамента (бута, гёль, лячек-турундж, дерево жизни). Роль определена по тексту Керимова; термин, который встречается и как мотив, и как элемент, есть в обоих списках — это одна и та же статья. Число в скобках — упоминаний в книге.'
    : state.lang==='az' ? 'Ornamentin böyük müstəqil fiqurları (buta, göl, ləçək-turunc, həyat ağacı). Rol Kərimovun mətninə görə müəyyən edilib. Mötərizədəki rəqəm — kitabda neçə dəfə xatırlanıb.'
    : 'Large self-contained ornament figures (buta, göl, lechek-turunj, tree of life). Roles follow Kerimov\'s text. The number in brackets is how many times the book mentions it.';
  if (state.tab === 'borders') return state.lang==='ru'
    ? 'Каймы и полосы каймы (хашия, су, мядахиль, сичандиши и т.п.) — по тексту и таблицам Керимова.'
    : state.lang==='az' ? 'Haşiyələr və haşiyə zolaqları (su, mədaxil, siçandişi və s.) — Kərimovun mətni və cədvəllərinə görə.'
    : 'Borders and border stripes (hashiye, su, medakhil, sichandishi, etc.) per Kerimov\'s text and tables.';
  if (state.tab === 'carpets') return state.lang==='ru'
    ? 'Названия ковров и композиций (чаще всего по селу: Пирабедиль, Зейва, Годжа), а также типы изделий (килим, сумах, верни, намазлык). У Керимова — колонка «Для какого ковра характерен» и перечни в тексте. Это не мотивы: ковёр может называться по мотиву, но это отдельная статья.'
    : state.lang==='az' ? 'Xalça və kompozisiya adları (əsasən kəndə görə: Pirəbədil, Zeyvə, Qoca) və məmulat növləri (kilim, sumax, vərni, namazlıq). Motiv deyil: xalça motivin adını daşıya bilər, amma ayrıca məqalədir.'
    : 'Carpet and composition names (mostly after villages: Pirebedil, Zeyva, Gyoja) and product types (kilim, sumakh, verni, namazlyk). Not motifs: a carpet may be named after a motif, but it is a separate article.';
  if (state.tab === 'elements') return state.lang==='ru'
    ? 'Отдельные декоративные формы (крюк, розетка, звезда и т.п.), из которых складываются мотивы. Одна форма может входить во много разных мотивов.'
    : state.lang==='az' ? 'Motivləri təşkil edən ayrı-ayrı bəzək formaları (qarmaq, rozet, ulduz və s.).'
    : 'Individual decorative shapes (hook, rosette, star, etc.) that make up motifs.';
  return state.lang==='ru'
    ? 'Конкретные реальные ковры, описанные в книге с датой, местом или собранием — не абстрактные мотивы, а физические образцы.'
    : state.lang==='az' ? 'Kitabda tarix, yer və ya kolleksiya ilə təsvir olunan konkret xalçalar.'
    : 'Specific physical carpets described in the book with a date, place or collection.';
}

  html += `<p style="color:var(--text-soft);font-size:13.5px;margin:0 0 14px">${({ru:'Каждое упоминание на сайте ссылается на источник и страницу. Нажмите на число, чтобы увидеть записи из этого источника.',az:'Saytdakı hər qeyd mənbəyə və səhifəyə istinad edir.',en:'Every mention on the site cites a source and page. Click a number to see the entries from that source.'})[L]}</p>`;
  const TYPE = {museum_collection:{ru:'музейное собрание',az:'muzey kolleksiyası',en:'museum collection'},monograph:{ru:'монография',az:'monoqrafiya',en:'monograph'},journal:{ru:'журнал',az:'jurnal',en:'journal'},auction_catalogue:{ru:'аукционный каталог',az:'hərrac kataloqu',en:'auction catalogue'}};
  html += `<table class="carrier-list"><tr><th>${({ru:'Источник',az:'Mənbə',en:'Source'})[L]}</th><th>${({ru:'Тип',az:'Növ',en:'Type'})[L]}</th><th>${({ru:'Термины',az:'Terminlər',en:'Terms'})[L]}</th><th>${({ru:'Упоминания',az:'Qeydlər',en:'Mentions'})[L]}</th><th>${({ru:'Носители',az:'Daşıyıcılar',en:'Carriers'})[L]}</th></tr>`;
  SOURCES.forEach(s => {
    const nt = TERMS.filter(t=>(t.source_counts||{})[s.id]).length;
    const nm = TERMS.reduce((a,t)=>a+((t.source_counts||{})[s.id]||0),0);
    const nc = DATA.carriers.filter(c=>c.source_id===s.id).length;
    const tt = (TYPE[s.type]||{})[L] || s.type;
    html += `<tr><td><strong>${esc(s.author)}</strong>. ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcTitle(s))}</a>`:esc(srcTitle(s))}. ${esc(s.publisher||'')}, ${s.year}.${srcNote(s)?`<div class="q">${esc(srcNote(s))}</div>`:''}</td><td>${esc(tt)}</td>
      <td>${nt?`<a data-src-go="${s.id}" data-src-tab="elements">${nt}</a>`:'—'}</td><td>${nm||'—'}</td><td>${nc?`<a data-src-go="${s.id}" data-src-tab="carriers">${nc}</a>`:'—'}</td></tr>`;
  });
  html += `</table>`;
  document.getElementById('main').innerHTML = html;
}

      const n = displayName(item), L = firstLetter(n);
      if (L !== currentLetter) {
        if (openUl) body += '</ul>';
        body += `<div class="index-letter">${esc(L)}</div><ul class="index-list">`;
        currentLetter = L; openUl = true;
      }
      const kind = 'term';
      const idAttr = item.id;
      const meaning = getMeaning(item);
      const hasPix = (PIX.bySite[idAttr]||[]).length > 0;
      const untranslated = !item.canonical_az;
      const untransLabel = state.lang==='az' ? 'AZ tərcüməsi yoxdur' : state.lang==='en' ? 'no Azerbaijani translation yet' : 'нет азерб. перевода — показано по русскому названию';
      body += `<li><a data-open="${kind}" data-id="${esc(idAttr)}">${esc(n)}</a>${untranslated?` <span class="meta" title="${esc(untransLabel)}" style="border:1px solid var(--border-light);border-radius:3px;padding:0 3px">RU</span>`:''}${hasPix?` <span class="meta" title="${esc(PT().hasPix)}">★</span>`:''} <span class="meta">(${item.mention_count})</span>${meaning?` <span class="meta">— ${esc(meaning)}</span>`:''}</li>`;
    });
    if (openUl) body += '</ul>';
    body += '</div>';
    html += body;
  }

  document.getElementById('main').innerHTML = html;
  attachIndexHandlers();
}

function attachIndexHandlers(){
  const sf = document.getElementById('schoolFilter');
  if (sf) sf.addEventListener('change', e => { state.school = e.target.value; state.subgroup=''; renderSchoolNav(); renderIndex(); });
  const srf = document.getElementById('sourceFilter');
  if (srf) srf.addEventListener('change', e => { state.source = e.target.value; renderIndex(); });
}

// Один делегированный обработчик на весь документ — работает и для ссылок в
// списке, и для ссылок внутри статьи (перекрёстные ссылки мотив<->элемент,
// категории школ), без необходимости перепривязывать после каждого рендера.
document.addEventListener('click', e => {
  const openEl = e.target.closest('[data-open]');
  if (openEl) { openArticle(openEl.dataset.open, openEl.dataset.id); return; }
  const carrierEl = e.target.closest('[data-open-carrier]');
  if (carrierEl) { openArticle('carrier', carrierEl.dataset.openCarrier); return; }
  const schoolEl = e.target.closest('[data-goto-school]');
  if (schoolEl) {
    setTab(isTermTab(state.tab) ? state.tab : 'carpets'); state.school = schoolEl.dataset.gotoSchool; state.subgroup=''; state.query = '';
    document.getElementById('search').value = '';
    renderSchoolNav(); renderIndex();
    return;
  }
  const subEl = e.target.closest('[data-goto-subgroup]');
  if (subEl) {
    setTab(isTermTab(state.tab) ? state.tab : 'carpets'); state.subgroup = subEl.dataset.gotoSubgroup; state.query = '';
    document.getElementById('search').value = '';
    renderSchoolNav(); renderIndex();
    return;
  }
  const srcGo = e.target.closest('[data-src-go]');
  if (srcGo) { state.source = srcGo.dataset.srcGo; setTab(srcGo.dataset.srcTab === 'carriers' ? 'carriers' : (TERMS.some(t=>(t.source_counts||{})[state.source] && t.tabs.includes('borders')) && state.source==='huseynov_2012' ? 'borders' : 'elements')); state.school=''; renderIndex(); return; }
  const clearSubEl = e.target.closest('[data-clear-subgroup]');
  if (clearSubEl) { state.subgroup=''; renderIndex(); return; }
  const schoolNavEl = e.target.closest('[data-school-nav]');
  if (schoolNavEl) {
    setTab(isTermTab(state.tab) ? state.tab : 'carpets'); state.school = schoolNavEl.dataset.schoolNav; state.subgroup=''; state.query='';
    document.getElementById('search').value = '';
    renderSchoolNav(); renderIndex();
    return;
  }
  const subgroupNavEl = e.target.closest('[data-subgroup-nav]');
  if (subgroupNavEl) {
    setTab(isTermTab(state.tab) ? state.tab : 'carpets'); state.subgroup = subgroupNavEl.dataset.subgroupNav; state.query='';
    document.getElementById('search').value = '';
    renderSchoolNav(); renderIndex();
    return;
  }
});

function mentionsToArticle(mentions){
  let body = '', refs = '';
  (mentions||[]).forEach((m,i) => {
    const n = i+1;
    const scanUrl = SCAN_LINKS[sourceKey(m.source)];
    const scanLink = scanUrl ? ` <a href="${esc(scanUrl)}" target="_blank" rel="noopener">[скан]</a>` : '';
    body += `<p>${m.origin_notes?esc(m.origin_notes)+' ':''}${m.quote?`«${esc(m.quote)}»`:''}<sup class="cite">[<a href="#ref${n}">${n}</a>]</sup></p>`;
    refs += `<li id="ref${n}">${esc(cleanSource(m.source))}${m.form?` <span style="color:var(--text)">— «${esc(m.form)}»</span>`:''}${scanLink}${m.quote?` — <span class="ref-quote">«${esc(m.quote)}»</span>`:''}${m.mention_depth?` <em>(${depthWord(m.mention_depth==='substantive'?'substantive':'passing')})</em>`:''}</li>`;
  });
  return { body, refs };
}

function reportBoxHtml(pageType, pageId, pageTitle){
  return `
    <div class="report-box">
      <button class="report-toggle" id="reportToggleBtn">${esc(T().reportBtn)}</button>
      <div class="report-form" id="reportForm">
        <textarea id="reportNote" placeholder="${esc(T().reportPlaceholder)}"></textarea>
        <div class="row">
          <button id="reportSendBtn">${esc(T().reportSend)}</button>
          <button id="reportCancelBtn">${esc(T().reportCancel)}</button>
        </div>
        <div class="status" id="reportStatus"></div>
      </div>
    </div>
    <input type="hidden" id="reportPageType" value="${esc(pageType)}">
    <input type="hidden" id="reportPageId" value="${esc(pageId)}">
    <input type="hidden" id="reportPageTitle" value="${esc(pageTitle)}">
  `;
}

function attachReportHandlers(){
  const toggleBtn = document.getElementById('reportToggleBtn');
  const form = document.getElementById('reportForm');
  if (!toggleBtn) return;
  toggleBtn.addEventListener('click', () => form.classList.toggle('open'));
  document.getElementById('reportCancelBtn').addEventListener('click', () => form.classList.remove('open'));
  document.getElementById('reportSendBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('reportStatus');
    const note = document.getElementById('reportNote').value.trim();
    statusEl.textContent = '…';
    try {
      const db = await (window.claude ? window.claude.use('db') : Promise.resolve(null));
      if (!db) { statusEl.textContent = T().reportUnavailable; return; }
      await db.collection('error_reports').add({
        pageType: document.getElementById('reportPageType').value,
        pageId: document.getElementById('reportPageId').value,
        pageTitle: document.getElementById('reportPageTitle').value,
        note, lang: state.lang, reportedAt: new Date().toISOString()
      });
      statusEl.textContent = T().reportSent;
      document.getElementById('reportNote').value = '';
    } catch (e) {
      statusEl.textContent = T().reportUnavailable;
    }
  });
}

function openArticle(kind, id){
  let html = `<a class="back-link" href="javascript:void(0)" id="backLink">${esc(T().backLink)}</a>`;

  if (kind === 'carrier') {
    const c = DATA.carriers[+id];
    const title = carrierDisplayName(c) || '—';
    const matchedMotif = (c.term_id && TERM_BY_ID[c.term_id]) || findMotifByName(c.motif_name);
    const cPage = c.source_id && c.source_id.startsWith('kerimov') ? sourceKey(c.source) : (String(c.source||'').match(/файл\s+([^)]+)/)||[])[1] || null;
    const sameMotifs = cPage ? TERMS.filter(m => pagesOf(m).has(cPage)) : [];
    const sameElements = [];
    const scanUrl = cPage ? SCAN_LINKS[cPage] : null;

    html += `<h1 class="page-title">${esc(title)}</h1>`;
    html += `<div class="article-wrap"><div class="article-body">`;
    if (matchedMotif) {
      const meaning = getMeaning(matchedMotif);
      if (meaning) html += `<p style="font-size:16px;font-style:italic;margin:0 0 6px">«${esc(meaning)}»</p>`;
    }
    html += `<p>${c.quote?`«${esc(c.quote)}»`:((c.description||!(c.source_id||'kerimov').startsWith('kerimov'))?'':`<em>${esc(T().quoteNone)}</em>`)}</p>`;
    if (c.description) html += `<p>${esc(c.description)}</p>`;
    if (c.attribution === 'auction') html += `<div class="disclaimer warn">${({ru:'Название и датировка — из аукционного каталога (торговая атрибуция), не из научной публикации.',az:'Ad və tarix hərrac kataloqundandır (ticarət atributsiyası), elmi nəşrdən deyil.',en:'Name and dating come from an auction catalogue (trade attribution), not a scholarly publication.'})[state.lang]}</div>`;
    if (carrierUrl(c)) html += `<p><a href="${esc(carrierUrl(c))}" target="_blank" rel="noopener">${({ru:'Карточка в собрании музея ↗',az:'Muzey kolleksiyasında kart ↗',en:'Record in the museum collection ↗'})[state.lang]}</a>${c.image_url?` · <a href="${esc(c.image_url)}" target="_blank" rel="noopener">${({ru:'фото ↗',az:'foto ↗',en:'photo ↗'})[state.lang]}</a>`:''}${c.public_domain?` <span style="font-size:11.5px;color:var(--text-soft)">(public domain)</span>`:''}</p>`;
    if (c.article) html += `<p style="font-size:12.5px;color:var(--text-soft)">${({ru:'Статья',az:'Məqalə',en:'Article'})[state.lang]}: ${esc(c.article)}</p>`;
    html += `<h2 class="section-h">${esc(T().infoDetails)}</h2><table class="carrier-list">`;
    [[T().infoDateL,cf(c,'date')],[T().infoSchool, c.school ? (SL()[c.school]||c.school) : null],[T().infoSizeL,c.size_cm&&(c.size_cm.width||c.size_cm.height)?`${c.size_cm.width||'?'}×${c.size_cm.height||'?'}`:null],
     [T().infoPlaceL,displayAzAware(cf(c,'location'))],[({ru:'Материал',az:'Material',en:'Material'})[state.lang], cf(c,'materials')],[({ru:'Тип',az:'Növ',en:'Type'})[state.lang], c.technique && c.technique!=='ворсовый ковёр' ? c.technique : null],[T().infoCollectionL,displayAzAware(cf(c,'collection')||c.museum_or_collection)],[T().infoInvL,c.inv_number],[T().infoTechL,displayAzAware(cf(c,'technique'))],[T().infoFigL,c.figure_ref]]
      .filter(([,v])=>v).forEach(([k,v])=>{ html += `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`; });
    html += `</table>`;

    if (matchedMotif) {
      const isCar = matchedMotif.kind !== 'ornament';
      const mTitle = isCar ? ({ru:'Статья о ковре',az:'Xalça haqqında məqalə',en:'Carpet article'})[state.lang] : (state.lang==='ru'?'Соответствующий мотив':state.lang==='az'?'Uyğun motiv':'Matching motif');
      html += `<h2 class="section-h">${mTitle}</h2><div class="categories"><a class="cat" data-open="term" data-id="${esc(matchedMotif.id)}">${esc(displayName(matchedMotif))}</a></div>`;
    }
    if (sameMotifs.length || sameElements.length) {
      const sTitle = state.lang==='ru'?'На той же странице':state.lang==='az'?'Eyni səhifədə':'On the same page';
      html += `<h2 class="section-h">${sTitle}</h2><div class="categories">`;
      sameMotifs.forEach(m => html += `<a class="cat" data-open="term" data-id="${esc(m.id)}">${esc(displayName(m))}</a>`);
      sameElements.forEach(e => html += `<a class="cat" data-open="element" data-id="${esc(e.elem_id)}">${esc(displayName(e))}</a>`);
      html += `</div>`;
    }

    html += `<h2 class="section-h">${esc(T().infoSourceSection)}</h2><p style="font-size:13px;color:var(--text-soft)">${c.source_id&&SOURCE_BY_ID[c.source_id]?`${esc(SOURCE_BY_ID[c.source_id].author)}. ${esc(srcTitle(SOURCE_BY_ID[c.source_id]))}. — `:''}${esc(cleanSource(c.source))}${scanUrl?` <a href="${esc(scanUrl)}" target="_blank" rel="noopener">[скан]</a>`:''}</p>`;
    html += reportBoxHtml('carrier', id, title);
    html += `</div></div>`;
    document.getElementById('main').innerHTML = html;
    document.getElementById('backLink').addEventListener('click', renderIndex);
    attachReportHandlers();
    return;
  }

  const item = findTerm(id);
  if (!item) { renderIndex(); return; }
  id = item.id; kind = 'term';
  const title = displayName(item);
  const { body, refs } = mentionsToArticle(item.mentions);
  const schools = item.schools_mentioned_canonical || [];
  const altNames = [].concat(item.canonical_az_variants||[], (item.names.az||[]).map(transliterateAzCyrillic), item.names.ru||[]).filter((v,i,a)=>v && a.findIndex(x=>x.toLowerCase()===v.toLowerCase())===i && v.toLowerCase()!==title.toLowerCase());
  const meaning = getMeaning(item);

  html += `<h1 class="page-title">${esc(title)}</h1>`;
  html += `<div class="article-wrap"><div class="article-body">`;
  if (meaning) html += `<p style="font-size:16px;font-style:italic;margin:0 0 6px">«${esc(meaning)}»${item.is_proper_noun?` <span style="font-size:12px;color:var(--text-soft);font-style:normal">(${state.lang==='ru'?'имя собственное':'proper noun'})</span>`:''}</p>`;
  if (altNames.length) html += `<p style="color:var(--text-soft);font-size:12.5px">${state.lang==='ru'?'варианты написания в источнике':'source spelling variants'}: ${altNames.map(esc).join(' · ')}</p>`;
  html += `<div id="pixSlot" data-id="${esc(id)}"></div>`;
  html += body || `<p><em>${esc(T().noQuoteMentions)}</em></p>`;
  html += `<h2 class="section-h">${esc(T().sectionNotes)}</h2>`;
  html += refs ? `<ol class="refs">${refs}</ol>` : `<p><em>${esc(T().noNotes)}</em></p>`;

  if (schools.length) {
    html += `<div class="categories">${schools.map(s=>`<a class="cat" href="javascript:void(0)" data-goto-school="${esc(s)}">${esc(SL()[s]||s)}</a>`).join('')}</div>`;
  }
  if ((item.subgroups_mentioned||[]).length) {
    const subLabel = state.lang==='ru'?'Подшкола:':state.lang==='az'?'Alt məktəb:':'Sub-school:';
    html += `<p style="font-size:12.5px;color:var(--text-soft);margin:6px 0 0">${subLabel}</p>`;
    html += `<div class="categories">${item.subgroups_mentioned.map(sg=>`<a class="cat" href="javascript:void(0)" data-goto-subgroup="${esc(sg)}">${esc(sg)}</a>`).join('')}</div>`;
  }
  {
    const related = termsOnSamePages(item);
    const relOrn = related.filter(t=>t.kind==='ornament'), relCar = related.filter(t=>t.kind!=='ornament');
    const catLinks = arr => `<div class="categories">${arr.slice().sort((a,b)=>azCompare(displayName(a),displayName(b))).map(m=>`<a class="cat" href="javascript:void(0)" data-open="term" data-id="${esc(m.id)}">${esc(displayName(m))}</a>`).join('')}</div>`;
    if (relOrn.length) html += `<h2 class="section-h">${esc(T().relOrn)}</h2>` + catLinks(relOrn);
    if (relCar.length) html += `<h2 class="section-h">${esc(T().relCarpets)}</h2>` + catLinks(relCar);
    const motifNamesSet = new Set([].concat(item.names.ru||[], item.names.az||[], item.names.en||[], item.aliases||[]).filter(Boolean).map(n=>n.trim().toLowerCase()));
    const itemPages = pagesOf(item);
    const relatedCarriers = DATA.carriers
      .map((c,i)=>({c,i}))
      .filter(({c}) => c.term_id === item.id || (c.motif_name && motifNamesSet.has(c.motif_name.trim().toLowerCase())) || (c.source_id && c.source_id.startsWith('kerimov') && sourceKey(c.source) && itemPages.has(sourceKey(c.source))));
    if (relatedCarriers.length) {
      const cTitle = state.lang==='ru'?'Известные образцы (носители)':state.lang==='az'?'Bilinən nümunələr (daşıyıcılar)':'Known examples (carriers)';
      html += `<h2 class="section-h">${cTitle}</h2><div class="categories">${relatedCarriers.map(({c,i})=>`<a class="cat" data-open-carrier="${i}">${esc(carrierDisplayName(c)||'—')}${c.date?' · '+esc(c.date):''}</a>`).join('')}</div>`;
    }
  }
  const visualEls = visualElementsForItem(item);
  if (visualEls.length) {
    const vTitle = state.lang==='ru'?'Видно на скане (модель-зрение)':state.lang==='az'?'Skanda görünür (görmə modeli)':'Seen on the scan (vision model)';
    html += `<h2 class="section-h">${vTitle}</h2>`;
    html += `<div class="categories">${visualEls.map(v=>{
      const url = SCAN_LINKS[v.page];
      const label = `${esc(v.element)}${v.confidence==='low'?' ?':''}`;
      return url ? `<a class="cat" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(v.page)}">${label}</a>` : `<span class="cat" title="${esc(v.page)}">${label}</span>`;
    }).join('')}</div>`;
  }

  if ((item.related_pattern_mentions||[]).length) {
    const rTitle = state.lang==='ru'?'Связанные узоры (упомянуты рядом)':state.lang==='az'?'Əlaqəli naxışlar':'Related patterns';
    html += `<h2 class="section-h">${rTitle}</h2><div class="categories">${item.related_pattern_mentions.map(p=>{
      if (!NAME_LINK_INDEX) buildNameLinkIndex();
      const hit = NAME_LINK_INDEX.get(p.toLowerCase());
      return hit ? `<a class="cat" data-open="term" data-id="${esc(hit.id)}">${esc(p)}</a>` : `<span class="cat">${esc(p)}</span>`;
    }).join('')}</div>`;
  }

  if ((item.external_references||[]).length) {
    const extTitle = state.lang==='ru'?'Внешние источники':state.lang==='az'?'Xarici mənbələr':'External sources';
    html += `<h2 class="section-h">${extTitle}</h2><ul class="plain">`;
    item.external_references.forEach(ref => {
      html += `<li><a href="${esc(ref.url)}" target="_blank" rel="noopener">${esc(ref.source)}</a>${ref.license?` <span style="font-size:11px;color:var(--text-soft)">(${esc(ref.license)})</span>`:''}${ref.note?`<div style="color:var(--text-soft);font-size:12.5px;margin:2px 0 8px">${esc(ref.note)}${ref.note.length>=300?'…':''}</div>`:''}</li>`;
    });
    html += `</ul>`;
  }

  html += reportBoxHtml(kind, id, title);
  html += `</div>`;

  html += `<div class="infobox">
    <div class="ib-title">${esc(title)}</div>
    <div id="pixIb"></div>
    <table>
      <tr><th>${esc(T().infoType)}</th><td>${esc((item.tabs||[]).map(t=>({motifs:T().tabMotifs,elements:T().tabElements,borders:T().tabBorders,carpets:T().tabCarpets})[t]).join(', '))}</td></tr>
      ${item.book && Object.keys(item.book.roles||{}).length ? `<tr><th>${esc(T().infoRoles)}</th><td>${Object.entries(item.book.roles).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`${esc((ROLE_LABEL[state.lang]||ROLE_LABEL.ru)[r]||r)} (${n})`).join(', ')}</td></tr>` : ''}
      ${item.book && item.book.kerimov_translation && state.lang!=='az' ? `<tr><th>${esc(T().infoKerTr)}</th><td>«${esc(item.book.kerimov_translation)}»</td></tr>` : ''}
      ${(item.alt_meanings||[]).length && state.lang==='ru' ? `<tr><th>${esc(T().altMeanings)}</th><td>${item.alt_meanings.map(esc).join('; ')}</td></tr>` : ''}
      <tr><th>${esc(T().infoMentions)}</th><td>${item.mention_count}</td></tr>
      ${Object.keys(item.source_counts||{}).length ? `<tr><th>${({ru:'Источники',az:'Mənbələr',en:'Sources'})[state.lang]}</th><td>${Object.entries(item.source_counts).map(([s,n])=>`${esc((SOURCE_BY_ID[s]||{}).short||s)} (${n})`).join('<br>')}</td></tr>` : ''}
      <tr><th>${esc(T().infoDepth)}</th><td>${depthWord(depthClass(item))}</td></tr>
      ${schools.length?`<tr><th>${esc(T().infoSchool)}</th><td>${schools.map(s=>esc(SL()[s]||s)).join(', ')}${item.school_inferred?` <span style="color:var(--text-soft);font-size:11px">(${state.lang==='ru'?'выведено по соседним страницам':state.lang==='az'?'qonşu səhifələrdən çıxarılıb':'inferred from nearby pages'})</span>`:''}</td></tr>`:''}
      ${(item.types_mentioned||[]).length?`<tr><th>${esc(T().infoElemType)}</th><td>${item.types_mentioned.map(esc).join(', ')}</td></tr>`:''}
      <tr><th>${esc(T().infoStatus)}</th><td>${esc(T().statusUnverified)}${item.canonical_source==='machine_translation'?`<br><span style="font-size:11px">${state.lang==='az'?'ad maşın tərcüməsidir (Kərimovda yalnız rusca təsvir var)':state.lang==='en'?'name is a machine translation (Kerimov gives only a Russian description)':'название — машинный перевод (у Керимова только русское описание)'}</span>`:item.canonical_source==='kerimov_reading'?`<br><span style="font-size:11px">${state.lang==='az'?'ad Kərimovun mətnindən oxunub':state.lang==='en'?'name read from Kerimov\'s text':'название прочитано по тексту Керимова'}</span>`:''}</td></tr>
      <tr><th>${esc(T().infoId)}</th><td style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all">${esc(item.id)}</td></tr>
    </table>
  </div>`;
  html += `</div>`;

  document.getElementById('main').innerHTML = html;
  document.getElementById('backLink').addEventListener('click', renderIndex);
  attachReportHandlers();
  fillPixSlots();
}

/* ===================== Пиксельные схемы (из Carpet Pattern Studio) ===================== */
const PIX = { items: [], byId: {}, bySite: {}, loaded: false, db: null, canEdit: null, err: '' };
function cpsBase(){ try{ return (localStorage.getItem('cpsBaseUrl') || 'http://localhost:8000').replace(/\/$/,''); }catch(e){ return 'http://localhost:8000'; } }
function cpsSetBase(){ let cur=''; try{ cur=localStorage.getItem('cpsBaseUrl')||''; }catch(e){} const v=prompt('Адрес Carpet Pattern Studio (для кнопки «редактировать»):', cur||cpsBase()); if(v===null) return; try{ localStorage.setItem('cpsBaseUrl', v.trim()); }catch(e){} pixRefreshView(); }
function pixEditLink(it){ if(!PIX.canEdit) return ''; return `<a href="${esc(cpsBase())}/?fid=${encodeURIComponent(it.id)}" target="_blank" rel="noopener">✎ ${esc(PT().edit)}</a>`; }
const PIX_T = {
  ru: { tab:'Иллюстрации', title:'Иллюстрации: пиксельные схемы', desc:'Схемы элементов, перерисованные по узлам с таблиц книги. 1 клетка = 1 узел.',
        none:'Схем пока нет.', import:'Импорт пакета…', importHint:'Файл pixel_schemes_bundle.json из Carpet Pattern Studio («Каталог» → «Пакет для сайта»).',
        imported:n=>`Загружено схем: ${n}`, onPage:'Схема из книги', knots:'узлов', carpet:'Ковёр', source:'Источник', del:'удалить', edit:'редактировать', cpsSettings:'адрес CPS', hasPix:'есть пиксельная схема',
        loading:'загрузка схем…', noAccess:'Нет прав на запись (нужен доступ «может редактировать»).', unavailable:'Хранилище недоступно в этом просмотре.', pages:'Страницы', unlinked:'без привязки', png:'PNG' },
  az: { tab:'İllüstrasiyalar', title:'İllüstrasiyalar: piksel sxemləri', desc:'Kitabın cədvəllərindən ilmə-ilmə köçürülmüş element sxemləri. 1 xana = 1 ilmə.',
        none:'Hələ sxem yoxdur.', import:'Paketi yüklə…', importHint:'Carpet Pattern Studio-dan pixel_schemes_bundle.json faylı.',
        imported:n=>`Yüklənən sxem: ${n}`, onPage:'Kitabdan sxem', knots:'ilmə', carpet:'Xalça', source:'Mənbə', del:'sil', edit:'redaktə et', cpsSettings:'CPS ünvanı', hasPix:'piksel sxemi var',
        loading:'sxemlər yüklənir…', noAccess:'Yazmaq hüququ yoxdur.', unavailable:'Yaddaş bu baxışda əlçatan deyil.', pages:'Səhifələr', unlinked:'bağlantısız', png:'PNG' },
  en: { tab:'Illustrations', title:'Illustrations: pixel charts', desc:'Element charts redrawn knot by knot from the book plates. 1 cell = 1 knot.',
        none:'No charts yet.', import:'Import bundle…', importHint:'pixel_schemes_bundle.json from Carpet Pattern Studio.',
        imported:n=>`Imported charts: ${n}`, onPage:'Chart from the book', knots:'knots', carpet:'Carpet', source:'Source', del:'delete', edit:'edit', cpsSettings:'CPS address', hasPix:'has a pixel chart',
        loading:'loading charts…', noAccess:'No write access (edit permission required).', unavailable:'Storage unavailable in this view.', pages:'Pages', unlinked:'unlinked', png:'PNG' }
};
function PT(){ return PIX_T[state.lang] || PIX_T.ru; }

function pixIndex(){
  PIX.byId = {}; PIX.bySite = {};
  PIX.items.sort((a,b)=> (+a.table||999)-(+b.table||999) || (+a.fig||0)-(+b.fig||0) || String(a.id).localeCompare(String(b.id)));
  for (const it of PIX.items) {
    PIX.byId[it.id] = it;
    for (const s0 of (it.site_ids||[])) { const s = resolveId(s0); const L = (PIX.bySite[s] = PIX.bySite[s] || []); if (!L.includes(it)) L.push(it); }
  }
}
function pixCanvas(it, maxW, maxH, opts){
  opts = opts || {};
  const w = +it.w, h = +it.h, rows = it.rows || [], pal = it.palette || ['#ffffff','#222222'];
  const cs = Math.max(1, Math.floor(Math.min(maxW / w, maxH / h)));
  const c = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  c.width = w * cs * dpr; c.height = h * cs * dpr; c.style.width = (w*cs)+'px'; c.style.height = (h*cs)+'px';
  c.style.imageRendering = 'pixelated'; c.style.display = 'block';
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  x.fillStyle = pal[0] || '#fff'; x.fillRect(0, 0, w*cs, h*cs);
  for (let j = 0; j < h; j++) { const r = rows[j] || ''; for (let i = 0; i < w; i++) {
    const ch = r[i] || '.'; if (ch === '.') continue; const k = parseInt(ch, 36);
    x.fillStyle = pal[k] || '#f0f'; x.fillRect(i*cs, j*cs, cs, cs); } }
  if (cs >= 5 && opts.grid !== false && pixGridOn()) {   // единая сетка CPS: светло-голубая, жирная каждые 10 узлов от левого верхнего угла
    x.strokeStyle = 'rgba(150,198,240,.55)'; x.lineWidth = 1; x.beginPath();
    for (let i = 0; i <= w; i++) { x.moveTo(i*cs+0.5, 0); x.lineTo(i*cs+0.5, h*cs); }
    for (let j = 0; j <= h; j++) { x.moveTo(0, j*cs+0.5); x.lineTo(w*cs, j*cs+0.5); }
    x.stroke();
    x.strokeStyle = 'rgba(74,146,214,.9)'; x.beginPath();
    for (let i = 0; i <= w; i += 10) { x.moveTo(i*cs+0.5, 0); x.lineTo(i*cs+0.5, h*cs); }
    for (let j = 0; j <= h; j += 10) { x.moveTo(0, j*cs+0.5); x.lineTo(w*cs, j*cs+0.5); }
    x.stroke();
  }
  c.title = it.name || it.id;
  return c;
}
function pixGridOn(){ try { return localStorage.getItem('pixGrid') !== '0'; } catch(e) { return true; } }
function pixL(o, fb){ if (o && typeof o === 'object') { const L = state.lang; return o[L] || (L==='az' ? '' : o.ru) || fb || ''; } return fb || ''; }
function pixCaption(it){
  const bits = [], L = state.lang, nm = it.names || {};
  const title = nm.az || it.name;
  const mean = L === 'az' ? '' : (nm[L] || (L === 'ru' ? it.translation : ''));
  if (title) bits.push(`<b>${esc(titleCase(title, 'az'))}</b>${mean?` — «${esc(mean)}»`:''}`);
  const school = it.school && SCHOOL_LABEL[L] && SCHOOL_LABEL[L][it.school];
  const src = pixL(it.source_i18n, it.source || (it.table?`Табл. ${it.table}, рис. ${it.fig}`:''));
  const sub = [pixL(it.carpet_i18n, it.carpet), school || it.type, src, `${it.w}×${it.h} ${PT().knots}`].filter(Boolean).map(esc).join(' · ');
  const note = pixL(it.note_i18n, it.note);
  return bits.join('') + `<div style="color:var(--text-soft);font-size:12px">${sub}</div>` + (note?`<div style="font-size:12.5px;margin-top:3px">${esc(note)}</div>`:'');
}
function pixFrame(it, maxW, maxH){
  const fig = document.createElement('figure');
  fig.style.cssText = 'margin:0 0 14px;display:inline-block;vertical-align:top;max-width:100%';
  const box = document.createElement('div');
  box.style.cssText = 'border:1px solid var(--border-light);background:#fff;padding:6px;display:inline-block;cursor:zoom-in;max-width:100%;overflow:auto';
  box.appendChild(pixCanvas(it, maxW, maxH));
  box.addEventListener('click', () => pixZoom(it));
  const cap = document.createElement('figcaption'); cap.style.cssText = 'font-size:13px;margin-top:5px;max-width:'+Math.max(220,maxW)+'px';
  cap.innerHTML = pixCaption(it);
  fig.appendChild(box); fig.appendChild(cap);
  return fig;
}
function pixZoom(it){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';
  const card = document.createElement('div');
  card.style.cssText = 'background:var(--bg);color:var(--text);padding:14px;max-width:100%;max-height:100%;overflow:auto;border:1px solid var(--border);cursor:default';
  const holder = document.createElement('div'); holder.style.cssText = 'background:#fff;padding:8px;display:inline-block';
  const cv = pixCanvas(it, Math.min(window.innerWidth-80, 1100), Math.min(window.innerHeight-200, 800)); holder.appendChild(cv);
  const cap = document.createElement('div'); cap.style.marginTop = '8px'; cap.innerHTML = pixCaption(it);
  card.appendChild(holder); card.appendChild(cap);
  card.addEventListener('click', e => e.stopPropagation());
  ov.appendChild(card); ov.addEventListener('click', () => ov.remove());
  document.addEventListener('keydown', function k(e){ if (e.key==='Escape'){ ov.remove(); document.removeEventListener('keydown', k);} });
  document.body.appendChild(ov);
}
/* вставка в статью элемента/мотива */
function fillPixSlots(){
  const slot = document.getElementById('pixSlot'); if (!slot) return;
  const key = slot.dataset.id; const list = PIX.bySite[key] || [];
  slot.innerHTML = ''; const ib = document.getElementById('pixIb'); if (ib) ib.innerHTML = '';
  if (!list.length) return;
  const h = document.createElement('h2'); h.className = 'section-h'; h.textContent = PT().onPage + (list.length>1?` (${list.length})`:'');
  slot.appendChild(h);
  const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:18px';
  list.forEach(it => {
    const fig = pixFrame(it, 300, 300);
    if (PIX.canEdit) {
      const links = document.createElement('div'); links.style.cssText = 'font-size:12.5px;margin-top:3px';
      links.innerHTML = [pixEditLink(it), `<a data-pix-del="${esc(it.id)}" style="color:var(--text-soft)">${esc(PT().del)}</a>`].filter(Boolean).join(' · ');
      fig.querySelector('figcaption').appendChild(links);
    }
    wrap.appendChild(fig);
  });
  slot.appendChild(wrap);
  slot.addEventListener('click', e => {
    const d = e.target.closest('[data-pix-del]'); if (d && PIX.db && confirm('Удалить схему ' + d.dataset.pixDel + '?')) PIX.db.collection('pixel_schemes').doc(d.dataset.pixDel).delete().catch(er => alert(er.message||er));
  });
  if (ib) { const b = document.createElement('div'); b.style.cssText = 'background:#fff;padding:8px;display:flex;justify-content:center;border-bottom:1px solid var(--border);cursor:zoom-in';
    b.appendChild(pixCanvas(list[0], 220, 220, {grid:false})); b.addEventListener('click', () => pixZoom(list[0])); ib.appendChild(b); }
}
/* страница «Иллюстрации» */
function siteTitleFor(id){
  const it = findTerm(id);
  return it ? displayName(it) : id;
}
function renderIllustrations(){
  const main = document.getElementById('main'); const t = PT();
  let html = `<h1 class="page-title">${esc(t.title)}</h1><p style="color:var(--text-soft);font-size:13.5px;margin:0 0 10px">${esc(t.desc)}</p>`;
  html += `<div class="subtitle-count">${PIX.loaded ? T().recordsCount(PIX.items.length) : esc(PIX.err || t.loading)}</div>`;
  html += `<div id="pixAdmin" style="margin-bottom:16px;display:none"><label class="report-toggle" style="display:inline-block">${esc(t.import)}<input type="file" id="pixFile" accept=".json,application/json" hidden></label> <button class="report-toggle" id="pixCpsBtn" type="button">⚙ ${esc(t.cpsSettings)}</button> <span id="pixStatus" style="font-size:12.5px;color:var(--text-soft)"></span><div style="font-size:12px;color:var(--text-soft);margin-top:4px">${esc(t.importHint)}</div></div>`;
  html += `<div style="margin:0 0 10px"><label style="font-size:13px;cursor:pointer"><input type="checkbox" id="pixGridT" ${pixGridOn()?'checked':''}> ${esc(({ru:'сетка',az:'tor',en:'grid'})[state.lang]||'сетка')}</label></div>`;
  html += `<div id="pixGallery"></div>`;
  main.innerHTML = html;
  const gal = document.getElementById('pixGallery');
  document.getElementById('pixGridT').onchange = e => { try { localStorage.setItem('pixGrid', e.target.checked ? '1' : '0'); } catch(er) {} renderIllustrations(); };
  if (PIX.loaded && !PIX.items.length) gal.innerHTML = `<p><em>${esc(t.none)}</em></p>`;
  let lastSec = null, grid = null;
  for (const it of PIX.items) {
    const sec = pixL(it.section_i18n, it.section || '') + (it.table ? ` — ${({ru:'Табл.',az:'Cədvəl',en:'Table'})[state.lang]||'Табл.'} ${it.table}` : '');
    if (sec !== lastSec) { lastSec = sec; const h = document.createElement('div'); h.className = 'index-letter'; h.textContent = sec || '—'; gal.appendChild(h);
      grid = document.createElement('div'); grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:14px 22px'; gal.appendChild(grid); }
    const fig = pixFrame(it, 200, 200);
    const links = document.createElement('div'); links.style.cssText = 'font-size:12.5px;margin-top:3px';
    const ids = it.site_ids || [];
    links.innerHTML = ids.length ? ids.map(s => `<a data-pix-open="${esc(s)}">${esc(siteTitleFor(s))}</a>`).join(' · ') : `<span style="color:var(--text-soft)">${esc(t.unlinked)}</span>`;
    if (PIX.canEdit) links.innerHTML += ` · ${pixEditLink(it)} · <a data-pix-del="${esc(it.id)}" style="color:var(--text-soft)">${esc(t.del)}</a>`;
    fig.querySelector('figcaption').appendChild(links);
    grid.appendChild(fig);
  }
  gal.addEventListener('click', e => {
    const o = e.target.closest('[data-pix-open]'); if (o) { const id = o.dataset.pixOpen; openArticle('term', id); window.scrollTo(0,0); return; }
    const d = e.target.closest('[data-pix-del]'); if (d && PIX.db && confirm('Удалить схему ' + d.dataset.pixDel + '?')) PIX.db.collection('pixel_schemes').doc(d.dataset.pixDel).delete().catch(er => alert(er.message||er));
  });
  pixAdminUi();
}
function pixAdminUi(){
  const box = document.getElementById('pixAdmin'); if (!box) return;
  if (!PIX.db || PIX.canEdit === false) { box.style.display = 'none'; return; }
  box.style.display = '';
  const cpsBtn = document.getElementById('pixCpsBtn'); if (cpsBtn) cpsBtn.addEventListener('click', cpsSetBase);
  document.getElementById('pixFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const st = document.getElementById('pixStatus'); st.textContent = '…';
    try {
      const j = JSON.parse(await f.text());
      const items = Array.isArray(j) ? j : (j.items || []);
      if (!items.length) throw new Error('в файле нет схем');
      let n = 0;
      for (const it of items) {
        if (!it.id || !it.rows || !it.w || !it.h) continue;
        const doc = { id:String(it.id), table:it.table??null, fig:it.fig??null, section:it.section||'', name:it.name||'', translation:it.translation||'',
          carpet:it.carpet||'', type:it.type||'', note:it.note||'', source:it.source||'', site_ids:(it.site_ids||[]).map(String),
          w:+it.w, h:+it.h, rows:it.rows.map(String), palette:(it.palette||[]).map(String), palette_names:(it.palette_names||[]).map(String),
          updated:it.updated||'', imported_at:new Date().toISOString() };
        for (const k of ['names','name_book','carpet_i18n','note_i18n','source_i18n','section_i18n','school','grid_origin','i18n_status','difficulty','source_ref']) if (it[k] != null) doc[k] = it[k];
        await PIX.db.collection('pixel_schemes').doc(doc.id).set(doc); n++;
        st.textContent = PT().imported(n) + ' / ' + items.length;
      }
      st.textContent = PT().imported(n);
    } catch (er) {
      st.textContent = (er && er.code === 'invalid_argument') ? PT().noAccess : ('⚠ ' + (er.message || er));
    }
  });
}
function pixRefreshView(){
  if (state.tab === 'illustrations') { renderIllustrations(); return; }
  if (document.getElementById('pixSlot')) { fillPixSlots(); return; }
  renderIndex();
}
(async function initPix(){
  try {
    const db = await (window.claude ? window.claude.use('db') : Promise.resolve(null));
    if (!db) { PIX.err = PT().unavailable; PIX.loaded = true; pixRefreshView(); return; }
    PIX.db = db;
    try { const u = await window.claude.use('user'); PIX.canEdit = u ? (u.canEdit ? !!u.canEdit() : null) : null; } catch(e) { PIX.canEdit = null; }
    db.collection('pixel_schemes').onSnapshot(snap => {
      PIX.items = snap.docs.map(d => d.data()).filter(Boolean).map(x => Object.assign({}, x));
      PIX.loaded = true; pixIndex(); pixRefreshView();
    }, err => { PIX.err = String(err && err.message || err); PIX.loaded = true; pixRefreshView(); });
  } catch (e) { PIX.err = String(e.message || e); PIX.loaded = true; }
})();

renderChrome();
renderSchoolNav();
renderIndex();
