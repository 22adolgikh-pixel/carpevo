<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16171b">
<title>Проверка ковров</title>
<style>
:root{--bg:#16171b;--pan:#212329;--ln:#30333b;--tx:#eceef2;--mut:#9aa0ab;--acc:#ffe066;--ok:#3ecf8e;--bad:#ff5a5f;--blu:#6cb6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--ln);font-size:12px;color:var(--mut);white-space:nowrap}
header b{font-weight:600;color:var(--tx)}header .sp{flex:1}header small{font-size:12px}header a{color:var(--mut);text-decoration:none}
.dots{display:flex;gap:5px;padding:6px 14px 0}.dots i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.dots i.d{background:var(--ok)}.dots i.c{background:var(--acc)}
main{flex:1;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px;min-height:0}
.qrow{display:flex;align-items:center;gap:8px;font-size:12px}.q{flex:1;font-size:12px;font-weight:600}.hint{color:var(--mut);font-size:12px}
.ib{flex:none;width:24px;height:24px;min-height:0;padding:0;border-radius:50%;font-size:13px;line-height:1;color:var(--mut)}.ib.on{border-color:var(--acc);color:var(--acc)}
.tip{display:none;background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}.tip.on{display:block}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row3 button{font-size:22px;font-weight:700;padding:8px}
button.unk{color:var(--mut)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none;position:relative}.stage.z{overflow:hidden;border-radius:10px;background:#0d0e11}
.zb{position:absolute;right:6px;top:6px;z-index:5;min-height:0;padding:4px 10px;font-size:12px;border-radius:14px;display:none}.stage.z .zb{display:block}
.ph{position:relative;display:inline-block;line-height:0;transform-origin:0 0;margin:7% 9%;outline:1px dashed #ffffff33;outline-offset:0}   /* поле вокруг фото: углы обрезанного ковра за краем кадра тоже видны */
.ph img{display:block;max-width:calc(100vw - 90px);max-height:var(--imh,50dvh);width:auto;height:auto;border-radius:6px}
.ph svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.corners{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cz{position:relative;aspect-ratio:1;border-radius:10px;border:2px solid var(--ln);background-color:#000;background-repeat:no-repeat;overflow:hidden}
.cz.sel{border-color:var(--acc)}.cz:before,.cz:after{content:'';position:absolute;background:var(--bad);opacity:.9}.cz:before{left:50%;top:22%;bottom:22%;width:1.5px}.cz:after{top:50%;left:22%;right:22%;height:1.5px}
.cz span{position:absolute;left:3px;top:2px;font-size:10px;color:#fff;background:#0009;padding:0 5px;border-radius:6px;z-index:2}
.fix{position:relative;width:min(92vw,52dvh);aspect-ratio:1;margin:0 auto;border-radius:12px;border:2px solid var(--acc);background-color:#000;background-repeat:no-repeat;touch-action:none}
.fix:before,.fix:after{content:'';position:absolute;background:var(--bad)}.fix:before{left:50%;top:15%;bottom:15%;width:2px}.fix:after{top:50%;left:15%;right:15%;height:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:var(--tx);background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:14px 10px;min-height:52px}
button.yes{background:var(--ok);color:#06210f;border-color:var(--ok);font-weight:600}button.no{border-color:var(--bad);color:#ffb3b5}
button.wide{grid-column:1/-1}button.sm{min-height:40px;padding:8px}button:active{transform:scale(.98)}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1}.end .big{font-size:42px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.mut{color:var(--mut)}
/* v11.52: карточки «элементы», «имена», «тип», «двойники» и выбор вида карточек */
.chips{display:flex;gap:6px;padding:6px 14px 0;overflow-x:auto;scrollbar-width:none}.chips button{flex:none;min-height:0;padding:4px 10px;border-radius:14px;font-size:12px;white-space:nowrap;color:var(--mut)}.chips button.on{border-color:var(--acc);color:var(--tx)}
.smp{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}.smp img{flex:none;height:76px;width:76px;object-fit:contain;border-radius:8px;border:2px solid var(--acc);background:#000}.smp img.sch{image-rendering:pixelated;background:#fff;border-color:var(--ln)}.smp img.big{height:120px;width:120px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1;min-height:0;overflow-y:auto;align-content:start}
/* v11.56: квадрат через padding, а не aspect-ratio — в Safari на iPhone ряды сетки схлопывались и плитки наезжали друг на друга */
.tl{position:relative;height:0;min-height:0;padding:0 0 100%;border-radius:10px;border:2px solid var(--ln);overflow:hidden;background:#000;box-sizing:content-box}.tl img{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;object-fit:contain;display:block;pointer-events:none}
.tl.pre:before{content:'?';position:absolute;right:3px;top:2px;z-index:3;font-size:11px;font-weight:700;color:var(--tx);background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:0 5px}.tl.x{border-color:var(--bad)}.tl.x:after{content:'✗';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--bad);background:#000a}
.tl.sch{background:#fff}.tl.sch img{image-rendering:pixelated;padding:4px 4px 16px}.tl.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tl b{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:500;line-height:1.5;background:#000b;color:#fff;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:0;align-items:center}.pair figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}.pair img{max-width:100%;max-height:54dvh;object-fit:contain;border-radius:6px}.pair figcaption{font-size:11px;color:var(--mut);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cds{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}.cd{background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}.cd b{font-size:18px}.cd blockquote{margin:4px 0 0;padding-left:8px;border-left:2px solid var(--ln);font-size:12.5px}.cd cite{display:block;color:var(--mut);font-size:11.5px;font-style:normal}
/* v11.57: карточка «тип» — описание из книг, ковры этого типа и главные элементы; по тапу пример открывается крупно */
.typ{background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:36dvh;overflow-y:auto}.typ b{font-size:16px}
.typ .ds{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.typ .ds.on{display:block}
.typ .lb{font-size:11px;color:var(--mut)}.typ .strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.typ .strip img{flex:none;height:84px;max-width:120px;object-fit:contain;border-radius:6px;border:1px solid var(--ln);background:var(--bg)}
.typ .strip.el img{height:52px;width:52px;background:#fff;image-rendering:pixelated;padding:2px}
.ovl{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}.ovl img{max-width:100%;max-height:80dvh;object-fit:contain}
button:disabled{opacity:.4}
.flags{display:flex;gap:8px}.flags label{flex:1;display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;font-size:13px;color:var(--mut)}.flags input{width:20px;height:20px;accent-color:var(--acc)}.flags label:has(input:checked){border-color:var(--acc);color:var(--tx)}
</style></head><body>
<header><b>Проверка ковров</b><span class="sp"></span><small id="me"></small><a href="/">студия</a></header>
<div class="chips" id="chips"></div>
<div class="dots" id="dots"></div>
<main id="main"><div class="end"><span class="mut">загружаю…</span></div></main>
<div class="toast" id="toast"></div>
<script>
// v11.39: микрозадачи на телефоне. Одна карточка — один вопрос. Свайп вправо = «да», влево = «не знаю».
const $=id=>document.getElementById(id);
const S={tasks:[],i:0,done:0,me:null,left:null};
const C_RU=['левый верхний','правый верхний','правый нижний','левый нижний'],C_SH=['ЛВ','ПВ','ПН','ЛН'];
async function api(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
  if(r.status===401){location.reload();throw new Error('auth');}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(S.tt);S.tt=setTimeout(()=>e.classList.remove('on'),1400);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function head(){const m=S.me||{};$('me').textContent=`сегодня ${m.today||0}`+(m.acc!=null?` · точность ${m.acc}%`:'')+(S.ver?` · ${S.ver}`:'');
  $('dots').innerHTML=S.tasks.map((t,k)=>`<i class="${k<S.i?'d':k===S.i?'c':''}"></i>`).join('');}
// v11.52: виды карточек. Кнопки вверху включают и выключают вид; выбор помнится на этом телефоне. /m?k=quad,frame — задать выбор ссылкой.
const KINDS=[['quad','углы'],['frame','кадр'],['marks','элементы'],['name','имена'],['comp','тип'],['same','двойники'],['split','развороты'],['cdup','дубли'],['xsame','между коврами']];
function kindsInit(){let k=new URLSearchParams(location.search).get('k');
  if(!k){try{k=localStorage.getItem('cps_m_k');}catch(e){}}
  S.k=(k||'').split(',').filter(x=>KINDS.some(a=>a[0]===x));if(!S.k.length)S.k=KINDS.map(a=>a[0]);}
function chips(){const L=S.left||{};$('chips').innerHTML=KINDS.map(([k,n])=>`<button data-k="${k}" class="${S.k.includes(k)?'on':''}">${n}${L[k]!=null?' '+L[k]:''}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(S.k.includes(k)){if(S.k.length===1)return toast('хотя бы один вид карточек');S.k=S.k.filter(x=>x!==k);}else S.k.push(k);
    try{localStorage.setItem('cps_m_k',S.k.join(','));}catch(e){}load();});}
async function load(){$('main').innerHTML='<div class="end"><span class="mut">загружаю…</span></div>';
  try{const j=await api('/api/micro/next?n=6&k='+S.k.join(','));S.tasks=j.tasks;S.i=0;S.me=j.me;S.left=j.left;S.ver=j.ver||S.ver;chips();head();show();}
  catch(e){$('main').innerHTML=`<div class="end"><span>Не загрузилось: ${esc(e.message)}</span><button onclick="load()">ещё раз</button></div>`;}}
const img=t=>'/rugmid/'+encodeURIComponent(t.rid)+'.jpg';
function zoomBg(el,t,x,y,Z){const r=el.getBoundingClientRect(),im=S.im;if(!im||!im.naturalWidth)return;
  const BW=r.width*Z,BH=BW*im.naturalHeight/im.naturalWidth;
  el.style.backgroundImage=`url("${img(t)}")`;el.style.backgroundSize=`${BW}px ${BH}px`;el.style.backgroundPosition=`${r.width/2-x*BW}px ${r.height/2-y*BH}px`;}
function show(){head();const t=S.tasks[S.i];
  if(!t){const L=S.left||{};$('main').innerHTML=`<div class="end"><div class="big">✓ ${S.done}</div><div>готово! сегодня ${(S.me||{}).today||0}${(S.me||{}).acc!=null?` · точность ${S.me.acc}%`:''}</div>
    <div class="mut">в очереди: ${KINDS.filter(a=>S.k.includes(a[0])).map(a=>`${a[1]} — ${L[a[0]]||0}`).join(', ')}</div>${L.name_wait&&S.k.includes('name')?`<div class="mut">ещё ${L.name_wait} элементов ждут имени, но у их ковров не указан тип</div>`:''}
    ${S.k.some(k=>L[k])?'<button class="yes" style="min-width:220px" onclick="load()">ещё 6 карточек</button>':'<div>Всё проверено — спасибо!</div>'}</div>`;return;}
  ({frame:showFrame,quad:showQuad,marks:showMarks,name:showName,comp:showComp,same:showSame,split:showSplit,cdup:showCdup,xsame:showXsame})[t.type](t);}
function qhead(q,tip){return `<div class="qrow"><span class="q">${q}</span><button class="ib" id="ib" aria-label="подсказка">i</button></div><div class="tip hint" id="tip">${tip}</div>`;}
function qtip(){const b=$('ib'),t=$('tip');if(b&&t)b.onclick=()=>{t.classList.toggle('on');b.classList.toggle('on');};}
function stage(t,extra=''){return `<div class="stage" id="stage"><div class="ph" id="ph"><img id="im" src="${img(t)}" alt="">${extra}</div></div>`;}
// два пальца — масштаб и сдвиг фото (проверить кромку и узор); один палец при увеличении — сдвиг; двойной тап — сброс
function zoomable(){const st=$('stage'),ph=$('ph');if(!st||!ph)return;let k=1,x=0,y=0;const P=new Map();let d0=0,k0=1,c0=null,x0=0,y0=0,tap=0;
  const apply=()=>{ph.style.transform=`translate(${x}px,${y}px) scale(${k})`;st.classList.toggle('z',k>1.02);};
  const reset=()=>{k=1;x=y=0;apply();};
  const b=document.createElement('button');b.className='zb';b.textContent='⤢ сбросить';b.onclick=e=>{e.stopPropagation();reset();};st.appendChild(b);
  const dist=()=>{const a=[...P.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);},mid=()=>{const a=[...P.values()];return [(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];};
  st.onpointerdown=e=>{if(e.target.closest('button'))return;st.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===2){d0=dist();k0=k;c0=mid();x0=x;y0=y;}else if(P.size===1){c0=[e.clientX,e.clientY];x0=x;y0=y;const n=Date.now();if(n-tap<300)reset();tap=n;}};
  st.onpointermove=e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);const r=st.getBoundingClientRect();
    if(P.size>=2){const m=mid(),nk=Math.max(1,Math.min(8,k0*dist()/d0)),cx=c0[0]-r.left,cy=c0[1]-r.top;   // точка между пальцами остаётся на месте
      x=(m[0]-r.left)-(cx-x0)*nk/k0;y=(m[1]-r.top)-(cy-y0)*nk/k0;k=nk;apply();}
    else if(k>1.02){x=x0+e.clientX-c0[0];y=y0+e.clientY-c0[1];apply();}};
  st.onpointerup=st.onpointercancel=e=>{P.delete(e.pointerId);if(P.size===1){const a=[...P.values()][0];c0=a;x0=x;y0=y;}if(k<=1.02)reset();};
  window.__zoom=()=>k;}
// v11.45: на каждой карточке свои галочки; отправляем только их, чтобы не стирать отметки с другой карточки
function rdFlags(t){const o={},m={fw:'wavy',fs:'skew',fd:'damaged'};for(const k in m){const e=$(k);if(e)o[m[k]]=e.checked;}if(Object.keys(o).length)t.fl=o;}
async function answer(t,a,q,x){rdFlags(t);const k=S.i;S.i++;S.done++;show();
  try{const j=await api('/api/micro/answer',{type:t.type,rid:t.rid,a,q,c:t.c,flags:t.fl,s:t.qsrc,...(x||{})});S.me.total=(S.me.total||0)+1;if(a!=='skip')S.me.today=(S.me.today||0)+1;
    if(j.ctl===false)toast('контрольная карточка: тут была ошибка — смотрите внимательнее');else if(j.applied)toast('принято ✓');head();}
  catch(e){toast('не сохранилось: '+e.message);S.i=k;S.done--;show();}}
// v11.45: кадр — три ответа (целый / обрезан / деталь) плюс «не ковёр»; порог «чуть вылез» — 3 % по одному краю.
// Рваные края и перспектива — отдельные галочки: такой ковёр остаётся целым и в работе.
function showFrame(t){document.documentElement.style.setProperty('--imh','40dvh');
  $('main').innerHTML=`${qhead('Это целый ковёр?','Целиком в кадре; срезано меньше ~3 % одного края — тоже целый. «Деталь» — снят кусок ковра, целого не видно. «Несколько ковров» — разворот книги или коллаж: потом такое фото разделим на ковры. Два пальца — увеличить, двойной тап — сбросить.')}${stage(t)}
   <div class="flags"><label><input type="checkbox" id="fs">снят в перспективе</label><label><input type="checkbox" id="fd">рваные края / дыры</label></div>
   <div class="btns"><button class="yes wide" id="a1">✓ целый ковёр</button><button id="a2">обрезан заметно</button><button id="a3">только деталь</button><button class="no" id="a4">не ковёр</button><button id="a6">несколько ковров</button><button class="sm wide" id="a5">не знаю</button></div>
  `;qtip();
  if(t.fl){$('fs').checked=!!t.fl.skew;$('fd').checked=!!t.fl.damaged;}
  S.im=$('im');$('a1').onclick=()=>answer(t,'whole');$('a2').onclick=()=>answer(t,'cropped');$('a3').onclick=()=>answer(t,'detail');$('a4').onclick=()=>answer(t,'not_rug');$('a6').onclick=()=>answer(t,'multi');$('a5').onclick=()=>answer(t,'skip');
  zoomable();}
function poly(q){return q.map(p=>p.join(',')).join(' ');}
function showQuad(t){t.q=t.q||t.quad.map(p=>[...p]);document.documentElement.style.setProperty('--imh','36dvh');
  $('main').innerHTML=`${qhead('Рамка точно по краю ковра?','Внизу углы крупно: крест должен стоять на углу ковра (бахрома не в счёт). Чтобы поправить угол — тап по нему. Два пальца — увеличить фото.')}
   ${stage(t,`<svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="pg" points="${poly(t.q)}" fill="#ffe0661a" stroke="#ffe066" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`)}
   <div class="corners" id="cz">${[0,1,3,2].map(k=>`<div class="cz" data-k="${k}"><span>${C_SH[k]}</span></div>`).join('')}</div>
   <div class="flags"><label><input type="checkbox" id="fw">края сильно кривые</label><label><input type="checkbox" id="fd">край / угол повреждён</label></div>
   <div class="row3"><button class="yes" id="a1" aria-label="да, точно">✓</button><button class="no" id="a3" aria-label="не то / не ковёр">✗</button><button class="unk" id="a4" aria-label="не знаю">?</button></div>`;qtip();
  if(t.fl){$('fw').checked=!!t.fl.wavy;$('fd').checked=!!t.fl.damaged;}S.im=$('im');const paint=()=>document.querySelectorAll('#cz .cz').forEach(e=>{const k=+e.dataset.k;zoomBg(e,t,t.q[k][0],t.q[k][1],6);});
  S.im.complete?paint():S.im.onload=paint;
  document.querySelectorAll('#cz .cz').forEach(e=>e.onclick=()=>fixQuad(t,+e.dataset.k));
  $('a1').onclick=()=>answer(t,'ok');$('a3').onclick=()=>answer(t,'bad');$('a4').onclick=()=>answer(t,'skip');
  zoomable();}
function fixQuad(t,k){t.fixed=true;rdFlags(t);
  $('main').innerHTML=`<div class="q">Угол: ${C_RU[k]}</div><div class="hint">двигайте фото пальцем, пока угол ковра не встанет под красный крест</div>
   <div class="fix" id="fx"></div>
   <div class="btns"><button class="sm" id="pv">← пред. угол</button><button class="sm" id="nx">след. угол →</button><button class="yes wide" id="ok">✓ сохранить углы</button><button class="sm wide" id="bk">отмена</button></div>`;
  const fx=$('fx'),Z=6,paint=()=>zoomBg(fx,t,t.q[k][0],t.q[k][1],Z);paint();
  let p0=null;fx.onpointerdown=e=>{fx.setPointerCapture(e.pointerId);p0=[e.clientX,e.clientY,...t.q[k]];};
  fx.onpointermove=e=>{if(!p0)return;const r=fx.getBoundingClientRect(),BW=r.width*Z,BH=BW*S.im.naturalHeight/S.im.naturalWidth;
    t.q[k]=[Math.max(-0.6,Math.min(1.6,p0[2]-(e.clientX-p0[0])/BW)),Math.max(-0.6,Math.min(1.6,p0[3]-(e.clientY-p0[1])/BH))];paint();};
  fx.onpointerup=fx.onpointercancel=()=>{p0=null;};
  $('pv').onclick=()=>fixQuad(t,(k+3)%4);$('nx').onclick=()=>fixQuad(t,(k+1)%4);
  $('ok').onclick=()=>answer(t,'fix',t.q.map(p=>p.map(v=>+v.toFixed(5))));
  $('bk').onclick=()=>{t.q=t.quad.map(p=>[...p]);showQuad(t);};}
// ---------- v11.52: новые карточки ----------
const crop=(rid,b,s,pad,mark)=>`/api/rugs/${encodeURIComponent(rid)}/crop?b=${b.join(',')}&s=${s}&pad=${pad}&mark=${mark}`;
// «элементы»: рамки, которые предложила машина. Тап по плитке — «это не то»; ✓ принимает остальные.
function showMarks(t){t.x=t.x||Object.fromEntries((t.pre||[]).map(i=>[i,true]));const hasS=!!t.sample,pre=new Set(t.pre||[]);
  $('main').innerHTML=`${qhead(hasS?'Это тот же элемент? Нажмите на лишние':'Это отдельные элементы узора? Нажмите на лишние',
     'Машина нашла на ковре похожие места. Жёлтая рамка — что именно предложено, вокруг — соседний узор. Тап — отметить ✗ (не то, криво обведено, захвачено лишнее). ✓ — остальные верны.'+(t.pre?' Самые похожие на образец идут первыми; где сеть сомневается, ✗ уже стоит (с пометкой «?») — снимите, если это тот же элемент.':''))}
   ${hasS||t.scheme?`<div class="smp">${hasS?`<img src="${crop(t.rid,t.sample,200,0.15,0)}" alt="образец">`:''}${t.scheme?`<img class="sch" src="${t.scheme}" alt="схема">`:''}<span>${hasS?'образец':'схема Керимова'}${t.more?` · в группе ещё ${t.more}`:''}<br>${esc(t.title||'')}</span></div>`:''}
   <div class="grid" id="gr">${t.items.map(m=>`<button class="tl${t.x[m.id]?' x':''}${pre.has(m.id)?' pre':''}" data-id="${esc(m.id)}"><img src="${crop(t.rid,m.box,240,0.35,1)}" alt=""></button>`).join('')}</div>
   <div class="row3"><button class="yes" id="a1" aria-label="готово: неотмеченные верны">✓</button><button class="no" id="a3" aria-label="все не то">✗ все</button><button class="unk" id="a4" aria-label="не знаю">?</button></div>`;qtip();
  document.querySelectorAll('#gr .tl').forEach(e=>e.onclick=()=>{const i=e.dataset.id;t.x[i]=!t.x[i];e.classList.toggle('x',!!t.x[i]);});
  const ids=t.items.map(m=>m.id);
  $('a1').onclick=()=>answer(t,'done',null,{ok:ids.filter(i=>!t.x[i]),bad:ids.filter(i=>t.x[i]),pre:t.pre||[]});
  $('a3').onclick=()=>answer(t,'done',null,{ok:[],bad:ids});$('a4').onclick=()=>answer(t,'skip',null,{ids});}
// «имена»: подтверждённый элемент без названия; выбор из схем Керимова для типа этого ковра (закрытый список)
function showName(t){
  $('main').innerHTML=`${qhead('Какой это элемент?','Сверху элемент с ковра (жёлтая рамка). Ниже — все схемы Керимова для ковров типа «'+esc(t.comp)+'». Выберите схему и нажмите ✓. Поворот и цвет не важны, важна форма.')}
   <div class="smp"><img class="big" src="${crop(t.rid,t.sample,260,0.3,1)}" alt="элемент">${(t.also||[]).map(b=>`<img src="${crop(t.rid,b,160,0.15,0)}" alt="">`).join('')}<span>тип: ${esc(t.comp)}</span></div>
   <div class="grid" id="gr">${t.opts.map(o=>`<button class="tl sch${t.sel===o.id?' sel':''}" data-id="${esc(o.id)}"><img src="${o.img}" alt="">${o.name?`<b>${esc(o.name)}</b>`:''}</button>`).join('')}</div>
   <div class="row3"><button class="yes" id="a1" aria-label="это выбранная схема" ${t.sel?'':'disabled'}>✓</button><button class="no" id="a3" style="font-size:13px">нет в списке</button><button class="unk" id="a4" aria-label="не знаю">?</button></div>`;qtip();
  document.querySelectorAll('#gr .tl').forEach(e=>e.onclick=()=>{t.sel=e.dataset.id;document.querySelectorAll('#gr .tl').forEach(x=>x.classList.toggle('sel',x===e));$('a1').disabled=false;});
  $('a1').onclick=()=>t.sel&&answer(t,t.sel,null,{g:t.g});$('a3').onclick=()=>answer(t,'none',null,{g:t.g});$('a4').onclick=()=>answer(t,'skip',null,{g:t.g});}
// «тип»: машина предложила тип ковра по названию или по двойнику
function showComp(t){document.documentElement.style.setProperty('--imh','30dvh');
  const h=(t.hint||[])[0],refs=t.refs||[],els=t.els||[];
  $('main').innerHTML=`${qhead('Похож на ковры типа «'+esc(t.az||t.ru)+'»?','Сравните фото внизу с примерами этого типа и с описанием. Похож по устройству поля и главным элементам — ✓. Явно другой — ✗. Не понятно — «?». Пример можно открыть крупно тапом. Описания — черновики ИИ по книгам.')}
   <div class="typ"><div><b>${esc(t.az||t.ru)}</b> <span class="lb">${esc([t.ru&&t.az?t.ru:'',t.school].filter(Boolean).join(' · '))}</span></div>
    ${h?`<div class="ds" id="ds">${esc(h.text)}</div><div class="lb">${esc(h.src)}${h.pages&&h.pages.length?', с. '+esc(h.pages.join(', ')):''} · черновик ИИ</div>`:'<div class="lb">описания типа в книгах пока нет — сравните с примерами</div>'}
    ${refs.length?`<div class="lb">ковры этого типа</div><div class="strip" id="refs">${refs.map(i=>`<img src="/rugthumb/${encodeURIComponent(i)}.jpg" data-r="${esc(i)}" alt="пример">`).join('')}</div>`:'<div class="lb">подтверждённых ковров этого типа пока нет</div>'}
    ${els.length?`<div class="lb">главные элементы (схемы Керимова)</div><div class="strip el">${els.map(e=>`<img src="${esc(e.img)}" alt="" title="${esc(e.name||'')}">`).join('')}</div>`:''}
    <div class="lb">почему предложено: ${esc(t.why||'')}</div></div>
   ${stage(t)}
   <div class="row3"><button class="yes" id="a1" aria-label="похож">✓</button><button class="no" id="a3" aria-label="не похож">✗</button><button class="unk" id="a4" aria-label="не знаю">?</button></div>`;qtip();
  const ds=$('ds');if(ds)ds.onclick=()=>ds.classList.toggle('on');
  const rf=$('refs');if(rf)rf.onclick=e=>{const r=e.target.dataset&&e.target.dataset.r;if(!r)return;const o=document.createElement('div');o.className='ovl';
    o.innerHTML=`<img src="/rugmid/${encodeURIComponent(r)}.jpg" alt=""><span class="mut">пример типа «${esc(t.az||t.ru)}» · тап — закрыть</span>`;o.onclick=()=>o.remove();document.body.appendChild(o);};
  S.im=$('im');$('a1').onclick=()=>answer(t,'yes',null,{cid:t.cid});$('a3').onclick=()=>answer(t,'no',null,{cid:t.cid});$('a4').onclick=()=>answer(t,'skip',null,{cid:t.cid});zoomable();}
// «двойники»: пара фото, в которой машина не уверена
function showSame(t){const o={rid:t.other};
  $('main').innerHTML=`${qhead('Это один и тот же ковёр?','Один и тот же предмет на двух фото (другой свет, другой музейный снимок) — «тот же». Тот же рисунок, но другой ковёр (другие мелочи, потёртости, размер) — «похожи».')}
   <div class="pair"><figure><img src="${img(t)}" alt=""><figcaption>${esc(t.title||t.rid)}${t.src?' · '+esc(t.src):''}</figcaption></figure><figure><img src="${img(o)}" alt=""><figcaption>${esc(t.title2||t.other)}${t.src2?' · '+esc(t.src2):''}</figcaption></figure></div>
   <div class="btns"><button class="yes" id="a1">✓ тот же ковёр</button><button id="a2">похожи, но разные</button><button class="no" id="a3">✗ разные</button><button class="sm unk" id="a4">не знаю</button></div>`;qtip();
  const x={other:t.other};$('a1').onclick=()=>answer(t,'same',null,x);$('a2').onclick=()=>answer(t,'similar',null,x);$('a3').onclick=()=>answer(t,'diff',null,x);$('a4').onclick=()=>answer(t,'skip',null,x);}
// «развороты»: на фото несколько ковров; показываем, как машина предлагает разрезать
const PC=['#ffe066','#6cb6ff','#3ecf8e','#ff8fd0','#ffa94d','#b39dff'];
function showSplit(t){document.documentElement.style.setProperty('--imh','50dvh');
  $('main').innerHTML=`${qhead('Разрезать так — на '+t.parts.length+' ковр'+(t.parts.length<5?'а':'ов')+'?','Каждая цветная рамка станет отдельным ковром. ✓ — разрезано правильно (каждый ковёр целиком в своей рамке, лишнего нет). «Один ковёр» — фото не надо резать. Если рамки не те, но ковров несколько, — «не знаю»: поправим в студии.')}
   ${stage(t,`<svg viewBox="0 0 1 1" preserveAspectRatio="none">${t.parts.map((b,i)=>`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="${PC[i%6]}22" stroke="${PC[i%6]}" stroke-width="3" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`)}
   <div class="btns"><button class="yes wide" id="a1">✓ разрезать так</button><button id="a2">один ковёр</button><button class="sm unk" id="a4">не знаю</button></div>`;qtip();
  S.im=$('im');$('a1').onclick=()=>answer(t,'split');$('a2').onclick=()=>answer(t,'one');$('a4').onclick=()=>answer(t,'skip');zoomable();}
// v11.56 «дубли»: два названия ковра из словаря Carpet DNA, которые почти совпадают. Вопрос о словах, фото нет.
function showCdup(t){const sd=x=>`<div class="cd"><b>${esc(x.az)}</b>${x.ru.length?`<div>${esc(x.ru.join(' · '))}</div>`:''}
    ${x.names.length>1?`<div class="hint">ещё пишут: ${esc(x.names.filter(n=>n!==x.az).join(', '))}</div>`:''}
    <div class="hint">${x.school?'школа: '+esc(x.school)+' · ':''}${esc(x.sources.join(', ')||'источник не указан')}${x.schemes?' · схем '+x.schemes:''}</div>
    ${x.quotes.map(q=>`<blockquote>${esc(q.quote)}<cite>${esc(q.where)}</cite></blockquote>`).join('')}</div>`;
  $('main').innerHTML=`${qhead('Это одно и то же название ковра?','В словаре два слова, которые различаются одной-двумя буквами. Если это одно и то же село или ковёр, записанные по-разному, — «одно и то же». Если это разные сёла или разные ковры — «разные». Ниже — что о каждом сказано в книгах. Решение в словарь вносится не сразу: его потом проверят.')}
   <div class="cds">${sd(t.a)}${sd(t.b)}</div>
   <div class="btns"><button class="yes" id="a1">✓ одно и то же</button><button class="no" id="a3">✗ разные</button><button class="sm unk" id="a4">не знаю</button></div>`;qtip();
  const x={pid:t.pid};$('a1').onclick=()=>answer(t,'same',null,x);$('a3').onclick=()=>answer(t,'diff',null,x);$('a4').onclick=()=>answer(t,'skip',null,x);}
// v11.59 «между коврами»: два элемента с разных ковров, которые сеть считает похожими. Поворот и зеркало не важны.
function showXsame(t){const f=(x)=>`<figure><img src="${crop(x.rid,x.box,300,0.3,1)}" alt=""><figcaption>${esc(x.title||x.rid)}${x.n>1?' · повторов '+x.n:''}</figcaption></figure>`;
  $('main').innerHTML=`${qhead('Это один и тот же элемент узора?','Элементы с двух разных ковров (жёлтая рамка). Поворот, зеркало, цвет и размер не важны — важна форма. «Тот же» — один и тот же элемент (как одно слово у Керимова). «Похож» — родственные, но различаются. Ответы собирают элементы в группы между коврами; потом группе дадим имя один раз.')}
   <div class="pair">${f(t.a)}${f(t.b)}</div>
   <div class="btns"><button class="yes" id="a1">✓ тот же</button><button id="a2">похож, но другой</button><button class="no" id="a3">✗ разные</button><button class="sm unk" id="a4">не знаю</button></div>`;qtip();
  const x={key:t.key};$('a1').onclick=()=>answer(t,'same',null,x);$('a2').onclick=()=>answer(t,'similar',null,x);$('a3').onclick=()=>answer(t,'diff',null,x);$('a4').onclick=()=>answer(t,'skip',null,x);}
kindsInit();load();
</script></body></html>
