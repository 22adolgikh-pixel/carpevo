function dyesPlace(){const E=$('dyesScr');E.style.top=document.querySelector('header').getBoundingClientRect().bottom+'px';E.style.bottom=Math.max(0,window.innerHeight-$('sbar').getBoundingClientRect().top)+'px';}
async function dyesOpen(){if(R.on)rugsClose();if(S.mode==='grid'||S.mode==='pix'){try{ovClose();}catch(e){}}
  DY.on=true;$('dyesScr').style.display='grid';dyesPlace();['pipe','sheet','queue','rugs'].forEach(k=>$('tab-'+k)&&$('tab-'+k).classList.remove('on'));$('tab-dyes').classList.add('on');await dyesLoad();}
function dyesClose(){DY.on=false;$('dyesScr').style.display='none';$('tab-dyes').classList.remove('on');}
async function dyesLoad(){const j=await api('/api/dyes?usage=1');DY.list=j.dyes;S.dyes=j.dyes;DY.rc=j.recolor;if(!DY.sel||!DY.list.find(d=>d.id===DY.sel))DY.sel=(DY.list[0]||{}).id||null;dyesList();await dyesSide();dyesPoll(j.recolor);}
function dyesPoll(rc){clearTimeout(DY.pollT);const st=$('dyStat');if(!rc)return;
  if(rc.running){st.innerHTML=`<span class="zg">перекрашиваю рисунки (${esc(rc.dye)}): ${rc.done} / ${rc.total}</span>`;DY.wasRun=true;DY.pollT=setTimeout(async()=>{try{const j=await api('/api/dyes');dyesPoll(j.recolor);}catch(e){}},1200);}
  else{st.textContent=rc.last||'';if(DY.wasRun){DY.wasRun=false;stat(rc.last||'перекрашено','ok');refreshFigures().catch(()=>{});dyesLoad();}}}
function dyesList(){const L=$('dyCards');
  L.innerHTML=DY.list.map(d=>`<button class="dycard ${d.id===DY.sel?'cur':''}" data-id="${esc(d.id)}" aria-pressed="${d.id===DY.sel}"><i style="background:${d.hex}"></i><span><b>${esc(d.az)}</b><small>${esc(d.ru||'')}</small><small class="mut">${d.used?'в '+d.used+' рис.':'не используется'}${d.suggested?' · предложен в '+d.suggested:''}</small></span></button>`).join('')
    +`<button class="dycard add" id="dyAddBtn"><i></i><span><b>＋ краситель</b><small class="mut">новый цвет в палитре</small></span></button>`;
  L.querySelectorAll('.dycard[data-id]').forEach(b=>b.onclick=()=>{DY.sel=b.dataset.id;DY.adding=false;dyesList();dyesSide();});
  $('dyAddBtn').onclick=()=>{DY.adding=true;DY.sel=null;dyesList();dyesSide();};}
async function dyesSide(){const E=$('dySide');const ro=document.body.classList.contains('viewer');
  if(DY.adding){E.innerHTML=`<h3>Новый краситель</h3><label>Название (az)<input id="dyNAz" placeholder="məs.: tünd göy"></label><label>По-русски<input id="dyNRu" placeholder="тёмно-синий"></label>
      <label>Цвет<input type="color" id="dyNHex" value="#3a5a8c"></label><div class="rgrow"><button class="pri" id="dyNGo">Добавить</button><button id="dyNX">Отмена</button></div>`;
    $('dyNX').onclick=()=>{DY.adding=false;DY.sel=(DY.list[0]||{}).id;dyesList();dyesSide();};
    $('dyNGo').onclick=async()=>{try{const j=await api('/api/dyes',{az:$('dyNAz').value,ru:$('dyNRu').value,hex:$('dyNHex').value});DY.adding=false;DY.sel=j.dye.id;stat('краситель добавлен: '+j.dye.az,'ok');await dyesLoad();}catch(e){fail(e);}};return;}
  const d=DY.list.find(x=>x.id===DY.sel);if(!d){E.innerHTML='<p class="mut">Выберите краситель.</p>';return;}
  let figs=[];try{figs=(await api('/api/dyes/'+encodeURIComponent(d.id)+'/figures')).figures;}catch(e){}
  if(DY.sel!==d.id)return;
  const lk=figs.filter(f=>f.linked),sg=figs.filter(f=>!f.linked);
  const fig=f=>`<button class="dyfig" data-fig="${esc(f.id)}" title="${esc(f.id)}${f.linked?'':' — предложен автоматом, не подтверждён'}"><img loading="lazy" src="/out/${encodeURIComponent(f.id)}_x12.png?t=${Date.now()}" alt=""><small>${esc(f.id)}</small></button>`;
  E.innerHTML=`<div class="dyhead"><i style="background:${d.hex}"></i><div><h3>${esc(d.az)}</h3><small class="mut">${esc(d.ru||'')} · id ${esc(d.id)}</small></div></div>
    <label>Цвет в палитре<span class="mut"> — так краситель выглядит во всех рисунках и выгрузках</span><span class="flex" style="gap:8px"><input type="color" id="dyHex" value="${d.hex}" ${ro?'disabled':''}><input id="dyHexT" value="${d.hex}" style="width:90px" ${ro?'disabled':''}></span></label>
    <label>Цвет в печати книги<span class="mut"> — по нему автомат узнаёт краситель на скане (обычно не трогать)</span><span class="flex" style="gap:8px"><input type="color" id="dyScan" value="${d.scan}" ${ro?'disabled':''}><small class="mut">${d.scan}</small></span></label>
    <div class="flex" style="gap:8px"><label style="flex:1">Название (az)<input id="dyAz" value="${esc(d.az)}" ${ro?'disabled':''}></label><label style="flex:1">По-русски<input id="dyRu" value="${esc(d.ru||'')}" ${ro?'disabled':''}></label></div>
    ${ro?'':`<div class="rgrow"><button class="pri" id="dySave" disabled>Сохранить${lk.length?' и перекрасить '+lk.length+' рис.':''}</button><button id="dyReset" disabled>Отменить</button></div>`}
    <h4>Связаны с палитрой (${lk.length})</h4><div class="dyfigs">${lk.map(fig).join('')||'<p class="mut">пока нет — в редакторе узора выберите этот краситель для цвета</p>'}</div>
    ${sg.length?`<h4>Предложен автоматом, не подтверждён (${sg.length})</h4><div class="dyfigs sug">${sg.map(fig).join('')}</div>`:''}`;
  E.querySelectorAll('[data-fig]').forEach(b=>b.onclick=()=>{dyesClose();openFigure(b.dataset.fig).catch(fail);});
  if(ro)return;
  const dirty=()=>{const ch=$('dyHex').value!==d.hex||$('dyScan').value!==d.scan||$('dyAz').value!==d.az||$('dyRu').value!==(d.ru||'');$('dySave').disabled=$('dyReset').disabled=!ch;
    E.querySelector('.dyhead i').style.background=$('dyHex').value;const c=document.querySelector(`.dycard[data-id="${CSS.escape(d.id)}"] i`);if(c)c.style.background=$('dyHex').value;};
  $('dyHex').oninput=()=>{$('dyHexT').value=$('dyHex').value;dirty();};
  $('dyHexT').oninput=()=>{if(/^#[0-9a-f]{6}$/i.test($('dyHexT').value)){$('dyHex').value=$('dyHexT').value.toLowerCase();dirty();}};
  $('dyScan').oninput=dirty;$('dyAz').oninput=dirty;$('dyRu').oninput=dirty;
  $('dyReset').onclick=()=>dyesSide();
  $('dySave').onclick=async()=>{try{const j=await api('/api/dyes',{id:d.id,hex:$('dyHex').value,scan:$('dyScan').value,az:$('dyAz').value,ru:$('dyRu').value});
    stat(j.recolor==='started'?'краситель сохранён — перекрашиваю связанные рисунки…':(j.recolor==='busy'?'сохранено; перекраска уже идёт — этот краситель обновится при следующем сохранении':'краситель сохранён'),'ok');
    if(S.fig){resolvePal(S.fig);redraw();}await dyesLoad();}catch(e){fail(e);}};}
(()=>{
  const t=document.createElement('button');t.id='tab-dyes';t.textContent='Красители';t.setAttribute('data-tip','Одна палитра красителей на все рисунки: сменили цвет здесь — он поменялся везде');$('tab-rugs').after(t);t.onclick=dyesOpen;
  ['pipe','sheet','queue','rugs'].forEach(k=>$('tab-'+k).addEventListener('click',()=>{if(DY.on)dyesClose();},true));
  const d=document.createElement('div');d.id='dyesScr';
  d.innerHTML=`<section class="dymain"><div class="dybar"><b>Красители</b><span class="mut">одна палитра на все рисунки — сменили цвет здесь, он поменялся во всех связанных рисунках и выгрузках</span><span class="sp"></span><span id="dyStat" class="mut"></span></div><div class="dycards" id="dyCards"></div></section><aside id="dySide"></aside>`;
  document.body.appendChild(d);
  window.addEventListener('resize',()=>{if(DY.on)dyesPlace();});
})();

/* ============ v11.2: центр событий — «Нужно решение», «Система», «Люди», автоматические задачи, отчёт ============ */
const EV={on:false,tab:'need',data:null,rep:null,repDays:7,pollT:null};
function evPlace(){const E=$('evScr');E.style.top=document.querySelector('header').getBoundingClientRect().bottom+'px';E.style.bottom=Math.max(0,window.innerHeight-$('sbar').getBoundingClientRect().top)+'px';}
async function evCount(){clearTimeout(EV.pollT);try{const c=await api('/api/events/count');const b=$('bellN');
  if(c.need){b.hidden=false;b.className='';b.textContent=c.need>99?'99+':c.need;}else if(c.can||c.unseen){b.hidden=false;b.className='dot';b.textContent='';}else b.hidden=true;
  $('bellBtn').setAttribute('aria-label',`Центр событий: нужно решение ${c.need}, можно сделать ${c.can}, новых в «Система» ${c.unseen}`);}catch(e){}
  EV.pollT=setTimeout(evCount,60000);}
async function evOpen(tab){if(R.on)rugsClose();if(DY.on)dyesClose();if(S.mode==='grid'||S.mode==='pix'){try{await ovClose();}catch(e){}}
  EV.on=true;if(tab)EV.tab=tab;$('evScr').style.display='grid';$('bellBtn').classList.add('on');evPlace();await evLoad();
  try{await api('/api/events/seen',{});}catch(e){}evCount();}
function evClose(){EV.on=false;$('evScr').style.display='none';$('bellBtn').classList.remove('on');}
async function evLoad(){EV.data=await api('/api/events');evRender();evSide();evReport();}
const evAgo=t=>{const d=new Date(t*1000),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});};
function evRender(){const D=EV.data,M=$('evList');if(!D)return;const ro=document.body.classList.contains('viewer');
  const vis=D.decisions.filter(x=>!x.hidden),hid=D.decisions.filter(x=>x.hidden);
  $('evSeg').innerHTML=[['need',`Нужно решение${vis.length?' ('+vis.length+')':''}`],['sys',`Система${D.unseen?' · '+D.unseen+' нов.':''}`],['ppl','Люди']].map(([k,l])=>`<button data-t="${k}" class="${EV.tab===k?'cur':''}" aria-pressed="${EV.tab===k}">${l}</button>`).join('');
  $('evSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{EV.tab=b.dataset.t;evRender();});
  if(EV.tab==='need'){
    const it=x=>`<div class="evit ${x.level==='need'?'need':''} ${x.hidden?'hid':''}" data-k="${esc(x.key)}"><span class="lv"></span><div class="bd"><b>${esc(x.title)}</b><p>${esc(x.body||'')}</p>
      ${x.sheets?`<div class="evsheets">${x.sheets.map(s=>`<div class="evsh"><img loading="lazy" src="/api/sheet_thumb?path=${encodeURIComponent(s.path)}&w=260" alt=""><small title="${esc(s.path)}">${esc(s.path.split('/').pop())} · ${s.n} рис.</small><div class="rgrow"><button class="sm" data-open-sheet="${esc(s.path)}">открыть</button>${ro?'':`<button class="sm" data-ok-sheet="${esc(s.path)}">✓ верно</button>`}</div></div>`).join('')}</div>`:''}
      <div class="acts">${x.action&&!(ro&&x.action.do!=='open')?`<button class="sm pri" data-act="${esc(x.key)}">${esc(x.action.label||'Открыть')}</button>`:''}${x.sheets&&!ro?`<button class="sm" data-ok-all="${esc(x.key)}">✓ все показанные верны</button>`:''}${x.hidden?`<button class="sm" data-unhide="${esc(x.key)}">вернуть</button>`:`<button class="sm" data-hide="${esc(x.key)}" data-tip="Скрыть, пока не изменится">скрыть</button>`}</div></div></div>`;
    M.innerHTML=(vis.map(it).join('')||'<p class="mut" style="padding:20px 4px">Сейчас ничего не ждёт вашего решения.</p>')+(hid.length?`<h4 class="mut" style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em">Скрытые (${hid.length})</h4>`+hid.map(it).join(''):'');
  }else if(EV.tab==='sys'){
    M.innerHTML=D.system.map(e=>`<div class="evit ${e.level==='warn'?'warn':''} ${e.new?'new':''}"><span class="lv"></span><div class="bd"><b>${esc(e.title)}</b>${e.body?`<p>${esc(e.body)}</p>`:''}</div><span class="t">${evAgo(e.t)}</span></div>`).join('')||'<p class="mut" style="padding:20px 4px">Пока ничего — здесь появятся итоги ночных прогонов, обучения, перекраски и недельные отчёты.</p>';
  }else{
    const days={};D.people.forEach(p=>(days[p.day]=days[p.day]||[]).push(p));
    M.innerHTML=Object.entries(days).map(([d,ps])=>`<h4 class="mut" style="margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em">${new Date(d+'T12:00').toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})}</h4>`+ps.map(p=>`<div class="evit"><span class="lv"></span><div class="bd"><b>${esc(p.user)}</b><p>${[p.figs?`рисунков: ${p.figs}`:'',p.rugs?`ковров: ${p.rugs}`:'',p.other?`других правок: ${p.other}`:''].filter(Boolean).join(' · ')}</p></div><span class="t">до ${p.last}</span></div>`).join('')).join('')||'<p class="mut" style="padding:20px 4px">За неделю правок не было.</p>';}
  M.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>evAct(b.dataset.act));
  M.querySelectorAll('[data-hide],[data-unhide]').forEach(b=>b.onclick=async()=>{const k=b.dataset.hide||b.dataset.unhide,x=D.decisions.find(y=>y.key===k);
    try{await api('/api/events/dismiss',{key:k,sig:b.dataset.hide?x.sig:null});await evLoad();evCount();}catch(e){fail(e);}});
  M.querySelectorAll('[data-open-sheet]').forEach(b=>b.onclick=()=>evGo('sheets',b.dataset.openSheet));
  const okSheets=async ps=>{try{const j=await api('/api/sheet_checked',{paths:ps});stat('отмечено: рамки верны на '+j.checked+' '+(j.checked===1?'листе':'листах'),'ok');await evLoad();evCount();}catch(e){fail(e);}};
  M.querySelectorAll('[data-ok-sheet]').forEach(b=>b.onclick=()=>okSheets([b.dataset.okSheet]));
  M.querySelectorAll('[data-ok-all]').forEach(b=>b.onclick=()=>{const x=D.decisions.find(y=>y.key===b.dataset.okAll);if(confirm('Отметить рамки верными на '+x.sheets.length+' показанных листах?'))okSheets(x.sheets.map(s=>s.path));});}
async function evGo(to,arg){evClose();
  if(to==='sheets'){setMode('sheet');if(arg)await openSheet(arg).catch(fail);}
  else if(to==='queue'||to==='pipe'){setMode(to);}
  else if(to==='rugs-dup'){rugsOpen();R.fdup=true;$('rgFDup')&&($('rgFDup').checked=true);R.gridN=150;setTimeout(rugList,400);}
  else if(to==='dyes'){dyesOpen();}}
async function evAct(key){const x=EV.data.decisions.find(y=>y.key===key);if(!x)return;const a=x.action||{};
  if(a.do==='open'){if(key==='sheets'&&x.sheets&&x.sheets[0])return evGo('sheets',x.sheets[0].path);return evGo(a.arg);}
  try{const j=await api('/api/events/act',{key});stat(j.result||'сделано','ok');if(j.open)return evGo(j.open);await evLoad();evCount();}catch(e){fail(e);}}
function evSide(){const D=EV.data,E=$('evAuto');if(!D)return;const ro=document.body.classList.contains('viewer');
  const WD=['пн','вт','ср','чт','пт','сб','вс'];
  E.innerHTML=D.automations.map(a=>`<div class="evau" data-a="${a.id}"><b>${esc(a.title)}</b><p>${esc(a.rule)}</p>
    <div class="flex"><label><input type="checkbox" data-f="enabled" ${a.enabled?'checked':''} ${ro?'disabled':''}> включена</label><label data-tip="Делать самой, не спрашивая. Без галочки — задача появится в «Нужно решение» с кнопкой"><input type="checkbox" data-f="auto" ${a.auto?'checked':''} ${ro||!a.enabled?'disabled':''}> без вопросов</label>
    ${a.weekday!=null?`<label>день <select data-f="weekday" ${ro?'disabled':''}>${WD.map((d,i)=>`<option value="${i}" ${a.weekday===i?'selected':''}>${d}</option>`).join('')}</select></label>`:''}
    ${a.hour!=null?`<label>в <select data-f="hour" ${ro?'disabled':''}>${[...Array(24).keys()].map(h=>`<option value="${h}" ${a.hour===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></label>`:''}</div>
    <div class="last">${a.last_run?`последний раз ${esc(a.last_run)} — ${esc(a.last_result||'')}`:'ещё не запускалась'}</div></div>`).join('')+`<small class="mut">Время — ${esc(D.tz)} (Баку). Задачи выполняет сервер — компьютер может спать.</small>`;
  E.querySelectorAll('.evau').forEach(box=>box.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=async()=>{const f=inp.dataset.f,v=inp.type==='checkbox'?inp.checked:+inp.value;
    try{const j=await api('/api/automation',{id:box.dataset.a,[f]:v});EV.data.automations=j.automations;evSide();stat('задача «'+j.automations.find(x=>x.id===box.dataset.a).title+'» сохранена','ok');}catch(e){fail(e);}}));}
async function evReport(){const E=$('evRep');try{EV.rep=await api('/api/events/report?days='+EV.repDays);}catch(e){E.innerHTML='';return;}const r=EV.rep;
  E.innerHTML=`<div class="flex" style="justify-content:space-between"><h4 style="margin:0">Отчёт · ${r.from}–${r.to}</h4><div class="evseg" style="margin:0"><button data-d="7" class="sm ${EV.repDays===7?'cur':''}">неделя</button><button data-d="30" class="sm ${EV.repDays===30?'cur':''}">30 дней</button></div></div>
    <div class="nums"><div><b>${r.done_new??'—'}</b><small>принято рисунков</small></div><div><b>${r.sheets_new??'—'}</b><small>нарезано листов</small></div><div><b>${r.marks_confirmed??'—'}</b><small>подтверждено рамок на коврах</small></div><div><b>${r.done_total??'—'}<span class="mut" style="font-size:12px"> / ${r.figs_total??'—'}</span></b><small>готово всего</small></div></div>
    ${r.people.length?`<p style="margin:6px 0;font-size:12.5px">${r.people.map(p=>`<b style="display:inline">${esc(p.user)}</b> — рисунков ${p.figs}, ковров ${p.rugs} (${p.days} ${p.days===1?'день':'дн.'})`).join('<br>')}</p>`:'<p class="mut" style="font-size:12.5px">правок людей не было</p>'}
    <p class="mut" style="font-size:12px;margin:6px 0 0">Система: событий ${r.system}${r.trained?' · модель обучалась':''}${r.open.length?' · ждёт решения: '+r.open.length:''}</p>`;
  E.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{EV.repDays=+b.dataset.d;evReport();});
  E.querySelector('.evseg').querySelectorAll('button').forEach(b=>b.classList.toggle('cur',+b.dataset.d===EV.repDays));}
(()=>{
  const d=document.createElement('div');d.id='evScr';
  d.innerHTML=`<section class="evmain" aria-label="События"><div class="evseg" id="evSeg" role="group" aria-label="Раздел"></div><div id="evList"></div></section><aside id="evSide"><h4>Автоматические задачи</h4><div id="evAuto"></div><div class="evrep" id="evRep"></div></aside>`;
  document.body.appendChild(d);
  $('bellBtn').onclick=()=>EV.on?evClose():evOpen();
  ['pipe','sheet','queue','rugs','dyes'].forEach(k=>$('tab-'+k)&&$('tab-'+k).addEventListener('click',()=>{if(EV.on)evClose();},true));
  window.addEventListener('resize',()=>{if(EV.on)evPlace();});
  setTimeout(evCount,1500);
})();

/* ---- v11.3: «Ковры» — обзор: источники и школы слева, цифры сверху, карточка ковра под курсором справа ---- */
function rugTree(){const E=$('rgTree');if(!E)return;const base=R.list.filter(r=>!(r.split_into&&r.split_into.length));
  const kinds={};base.forEach(r=>{const k=srcKind(r.src);const K=kinds[k]=kinds[k]||{n:0,src:{}};K.n++;K.src[r.src||'']=(K.src[r.src||'']||0)+1;});
  const sch={};base.forEach(r=>{const k=r.school||'-';sch[k]=(sch[k]||0)+1;});R.fschs=R.fschs||new Set();
  E.innerHTML=`<h4>Источники</h4><div class="ptree"><button class="pn ${!R.fsrc&&!R.fsrc2?'cur':''}" data-k=""><span class="ch"></span><span class="nm">Все источники</span><span class="c">${base.length}</span></button>`+
    Object.keys(RSRC).filter(k=>kinds[k]).map(k=>{const K=kinds[k],subs=Object.entries(K.src).sort((a,b)=>b[1]-a[1]),op=R.fsrc===k;
      return `<button class="pn ${R.fsrc===k&&!R.fsrc2?'cur':''}" data-k="${k}"><span class="ch">${subs.length>1?(op?'▾':'▸'):''}</span><span class="nm">${esc(RSRC[k])}</span><span class="c">${K.n}</span></button>`+
        (op&&subs.length>1?subs.map(([sv,n])=>`<button class="pn sub ${R.fsrc2===sv?'cur':''}" data-k="${k}" data-s="${esc(sv)}"><span class="ch"></span><span class="nm">${esc(SRCRU[sv]||sv||'—')}</span><span class="c">${n}</span></button>`).join(''):'');}).join('')+`</div>
    <h4 style="margin-top:14px">Школа</h4>${Object.entries(RSCH).filter(([k])=>k&&sch[k]).concat(sch['-']?[['-','школа не известна']]:[]).map(([k,v])=>`<label class="sch"><input type="checkbox" data-sch="${esc(k)}" ${R.fschs.has(k)?'checked':''}><span class="nm">${esc(v)}</span><span class="c">${sch[k]}</span></label>`).join('')}`;
  E.querySelectorAll('.pn').forEach(b=>b.onclick=()=>{const k=b.dataset.k||'',sv=b.dataset.s;
    if(sv!=null){R.fsrc=k;R.fsrc2=sv;}else if(R.fsrc===k&&!R.fsrc2&&k){R.fsrc='';}else{R.fsrc=k;R.fsrc2='';}R.fbig=false;$('rgFBig').checked=false;R.gridN=150;rugList();});
  E.querySelectorAll('[data-sch]').forEach(c=>c.onchange=()=>{c.checked?R.fschs.add(c.dataset.sch):R.fschs.delete(c.dataset.sch);R.gridN=150;rugList();});
  const h=[R.fsrc2?(SRCRU[R.fsrc2]||R.fsrc2):(R.fsrc?RSRC[R.fsrc]:'Все ковры'),...[...R.fschs].map(k=>k==='-'?'школа ?':(RSCH[k]||k))];$('rgH').textContent=h.join(' · ');}
function rugKpi(byId,kb,nker){const E=$('rgKpi');if(!E)return;const base=R.list.filter(r=>!(r.split_into&&r.split_into.length));
  const groups=new Set(base.filter(r=>r.group).map(r=>r.group)).size,marked=base.filter(r=>r.n).length;
  const cs=base.filter(r=>!r.composition&&r.comp_sug),ct=cs.filter(r=>r.comp_sug_kind==='title').length,cw=cs.length-ct,nc=base.filter(r=>!r.composition).length;
  // v11.19: сводка одной строкой (карточки занимали пол-экрана)
  E.innerHTML=`<span><b>${base.length}</b> фото</span><span><b>${marked}</b> размечено <span class="kbar"><i style="width:${base.length?100*marked/base.length:0}%"></i></span></span><span><b>${groups}</b> групп двойников</span><span><b class="${kb?'zg':''}">${kb}</b> из ${nker} Керимова с фото крупнее</span><span id="rgKpiComp"><b class="${cs.length?'zg':''}">${nc}</b> без типа ковра${cs.length?` · предложен у ${cs.length}${!rro()?`: ${cw?`<button class="sm" data-cacc="twin" data-tip="взять тип у двойника, у которого он указан">от двойников (${cw})</button>`:''}${ct?` <button class="sm" data-cacc="title" data-tip="тип по слову в названии: «Pirəbədil carpet…», «Ковёр Касымушагы». Проверьте выборочно — названия бывают неточные">по названию (${ct})</button>`:''}`:''}`:''}</span>`;
  E.querySelectorAll('[data-cacc]').forEach(b=>b.onclick=async()=>{const k=b.dataset.cacc,n=k==='title'?ct:cw;if(!confirm(`Поставить предложенный тип ковра у ${n} ковров (${k==='title'?'по слову в названии':'от двойника'})? Потом его можно поменять в паспорте.`))return;
    try{const j=await api('/api/rugs_comp_accept',{all:true,kind:k});stat('тип ковра поставлен у '+j.n+' ковров','ok');await rugsLoadList();}catch(e){fail(e);}});}
function rugPeek(id){const E=$('rgPeek');if(!E)return;const r=id&&R.list.find(x=>x.id===id);R.peekId=r?r.id:null;
  if(!r){E.innerHTML=`<h4>Ковёр</h4><p class="mut" style="font-size:12.5px">Наведите на плитку — здесь появится карточка ковра и его двойники. Клик по плитке — открыть в редакторе.</p>`;return;}
  const tw=R.list.filter(x=>x.id!==r.id&&((r.group&&x.group===r.group)||(r.same_ids||[]).includes(x.id)));
  E.innerHTML=`<h4>Ковёр</h4><img class="pim" src="/rugthumb/${encodeURIComponent(r.id)}.jpg" alt=""><div class="pt">${esc(r.title||r.id)}</div>
    <div class="pm">${esc(SRCRU[r.src]||r.src||'')}${r.school?' · '+esc(RSCH[r.school]||r.school):' · школа ?'}${r.w?' · '+r.w+'×'+r.h:''}<br>${r.n?`рамок ${r.n} · ✓ ${r.confirmed}`:'не размечен'}${r._big?` · <span style="color:var(--ok)">⬆ у двойника фото ×${r._big.k.toFixed(1)}</span>`:''}</div>
    <div class="rgrow" style="margin-top:10px"><button class="pri" id="rgPeekOpen">Открыть в редакторе</button></div>
    ${tw.length?`<h4 style="margin-top:14px">Этот же ковёр в других источниках (${tw.length})</h4>${tw.slice(0,8).map(x=>`<button class="tw" data-open="${esc(x.id)}"><img src="/rugthumb/${encodeURIComponent(x.id)}.jpg" alt=""><span><b>${esc(SRCRU[x.src]||x.src||'')}</b><br><span class="mut">${x.w?x.w+'×'+x.h:''}${(r.same_no||[]).includes(x.id)?' · ✗ другой':''}</span></span></button>`).join('')}`:''}`;
  $('rgPeekOpen').onclick=()=>rugOpen(r.id);E.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>rugOpen(b.dataset.open));}

/* ---- v11.3: «Узоры» — дерево источников слева (источник → таблица) и цифры сверху ---- */
function figSrc(f){const p=String(f.sheet||'').replace(/\\/g,'/').split('/');return p.length>1?p[0]:'(загружено)';}
function srcTitle(k){return (S.srcTitles||{})[k]||k.replace(/_/g,' ');}
function srcOk(f){return (!S.fsrc||figSrc(f)===S.fsrc)&&(S.ftab==null||String(f.table)===String(S.ftab));}
function kpiRow(){const F=S.figures.filter(srcOk),sch=F.filter(f=>!f.photo),done=sch.filter(f=>f.done).length,q=sch.filter(f=>f.auto&&f.size&&!f.done).length;
  return `<div class="kpirow"><div><b>${sch.length}</b><small>схем узоров${S.fsrc?' в источнике':''}</small><span class="kbar"><i style="width:${sch.length?100*done/sch.length:0}%"></i></span></div><div><b>${done}</b><small>приняты</small></div><div><b class="${q?'zg':''}">${q}</b><small>ждут проверки</small></div><div><b>${(S.dyes||[]).length}</b><small>красителей в палитре</small></div></div>`;}
function patTree(){const L=$('left');if(!L)return;S.srcOpen=S.srcOpen||new Set();
  const by={};S.figures.forEach(f=>{const k=figSrc(f);const s=by[k]=by[k]||{n:0,done:0,q:0,tabs:{}};s.n++;s.done+=f.done?1:0;s.q+=(f.auto&&f.size&&!f.done&&!f.photo)?1:0;
    const t=f.table??'—';const T=s.tabs[t]=s.tabs[t]||{n:0,done:0,q:0};T.n++;T.done+=f.done?1:0;T.q+=(f.auto&&f.size&&!f.done&&!f.photo)?1:0;});
  const cnt=x=>S.mode==='queue'?(x.q?`<span class="c zg" title="ждут проверки">${x.q}</span>`:`<span class="c">✓</span>`):`<span class="c" title="принято / всего">${x.done}/${x.n}</span>`;
  const keys=Object.keys(by).sort((a,b)=>srcTitle(a).localeCompare(srcTitle(b),'ru'));
  L.innerHTML=`<h4>Источники</h4><div class="ptree" role="tree" aria-label="Источники узоров"><button class="pn ${!S.fsrc?'cur':''}" data-src="" role="treeitem"><span class="ch"></span><span class="nm">Все источники</span>${cnt({n:S.figures.length,done:S.figures.filter(f=>f.done).length,q:S.figures.filter(f=>f.auto&&f.size&&!f.done&&!f.photo).length})}</button>`+
    keys.map(k=>{const s=by[k],op=S.srcOpen.has(k)||S.fsrc===k;const tabs=Object.keys(s.tabs).sort((a,b)=>(+a||0)-(+b||0));
      return `<button class="pn ${S.fsrc===k&&S.ftab==null?'cur':''}" data-src="${esc(k)}" role="treeitem" aria-expanded="${op}"><span class="ch" data-tog="${esc(k)}">${tabs.length>1?(op?'▾':'▸'):''}</span><span class="nm" title="${esc(srcTitle(k))}">${esc(srcTitle(k))}</span>${cnt(s)}</button>`+
        (op&&tabs.length>1?tabs.map(t=>`<button class="pn sub ${S.fsrc===k&&String(S.ftab)===String(t)?'cur':''}" data-src="${esc(k)}" data-tab="${esc(t)}" role="treeitem"><span class="ch"></span><span class="nm">${t==='—'?'без таблицы':'Табл. '+esc(t)}</span>${cnt(s.tabs[t])}</button>`).join(''):'');}).join('')+`</div>`;
  const re=()=>{patTree();S.mode==='queue'?renderQueue():renderCatalog();};
  L.querySelectorAll('[data-tog]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const k=e.dataset.tog;S.srcOpen.has(k)?S.srcOpen.delete(k):S.srcOpen.add(k);patTree();});
  L.querySelectorAll('.pn').forEach(b=>b.onclick=()=>{const k=b.dataset.src||null,t=b.dataset.tab;
    if(t!=null){S.fsrc=k;S.ftab=t==='—'?null:t;}else if(S.fsrc===k&&S.ftab==null&&k){S.fsrc=null;}else{S.fsrc=k;S.ftab=null;if(k)S.srcOpen.add(k);}re();});}
api('/api/config').then(c=>{S.srcTitles=c.src_titles||{};if(S.mode==='queue'||S.mode==='cat')patTree();}).catch(()=>{});

/* ---- v11.8: все пояснения (.hint) спрятаны за «i» — по клику раскрываются ---- */
function hintsToI(root){(root||document).querySelectorAll('.hint:not([data-i])').forEach(h=>{h.setAttribute('data-i','1');
  const b=document.createElement('button');b.type='button';b.className='ib-i';b.textContent='i';b.setAttribute('aria-label','Пояснение');b.setAttribute('aria-expanded','false');
  b.onclick=e=>{e.stopPropagation();e.preventDefault();const o=!h.classList.contains('open');h.classList.toggle('open',o);b.classList.toggle('on',o);b.setAttribute('aria-expanded',o);};
  h.parentNode.insertBefore(b,h);});}
new MutationObserver(ms=>{for(const m of ms)if(m.addedNodes.length){hintsToI();break;}}).observe(document.body,{childList:true,subtree:true});hintsToI();

/* ============ v11.3: колонка разделов, «где вы сейчас», шпаргалка клавиш ============ */
const RAIL_IC={pipe:'<path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 2h-13z"/><path d="M8.5 18a1.8 1.8 0 0 0 3 0"/>',
  sheet:'<path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5"/><rect x="7.5" y="9" width="5" height="5"/>',
  queue:'<path d="M10 3l7 7-7 7-7-7z"/><path d="M10 7l3 3-3 3-3-3z"/>',
  rugs:'<rect x="4" y="2.5" width="12" height="15" rx="1"/><rect x="7" y="6" width="6" height="8"/>',
  dyes:'<circle cx="7" cy="8" r="3.5"/><circle cx="13" cy="8" r="3.5"/><circle cx="10" cy="13" r="3.5"/>',
  kb:'<rect x="2.5" y="5.5" width="15" height="10" rx="1.5"/><path d="M5.5 9h1M9.5 9h1M13.5 9h1M6 12.5h8"/>'};
const RAIL_LB={pipe:'События',sheet:'Листы',queue:'Узоры',rugs:'Ковры',dyes:'Красители'};
function railIcon(k){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">${RAIL_IC[k]}</svg>`;}
function crumbsText(){const P=[];
  if(EV.on)P.push('События');
  else if(DY.on){P.push('Красители');const d=DY.list.find(x=>x.id===DY.sel);if(d)P.push(d.az);}
  else if(R.on){P.push('Ковры');if(R.view==='edit'&&R.rug){P.push(SRCRU[(R.rug.cat||{}).src]||(R.rug.cat||{}).src||'');P.push(R.rug.title||R.rug.id);}
    else{if(R.fsrc2)P.push(SRCRU[R.fsrc2]||R.fsrc2);else if(R.fsrc)P.push(RSRC[R.fsrc]||R.fsrc);else P.push('Все источники');}}
  else{const m=S.mode;
    if(m==='pipe'){P.push('Узоры');P.push('Сводка');}
    else if(m==='sheet'){P.push('Узоры');P.push('Листы');if(S.sheet&&S.sheet.path)P.push(S.sheet.path.split('/').slice(-2).join(' / '));}
    else if(m==='queue'||m==='cat'){P.push('Узоры');P.push(m==='queue'?'Очередь проверки':'Все рисунки');if(S.fsrc)P.push(srcTitle(S.fsrc));if(S.ftab!=null)P.push('Табл. '+S.ftab);}
    else if((m==='grid'||m==='pix')&&S.fig){P.push('Узоры');P.push(S.fig.id+(S.fig.meta&&S.fig.meta.name_az?' · '+S.fig.meta.name_az:''));P.push(m==='grid'?'Геометрия':'Пиксели');}}
  return P.filter(Boolean);}
function crumbsUpd(){const pb=$('rgPassBtn');if(pb){const on=!!(R.on&&R.view==='edit'&&R.rug);if(pb.hidden===on)pb.hidden=!on;if(!pb.onclick)pb.onclick=()=>rugPassOpen();}   // v11.19: паспорт — у названия ковра, справа в шапке
  const P=crumbsText(),k=P.join('|');if(k===crumbsUpd.k)return;crumbsUpd.k=k;
  $('crumbs').innerHTML=P.map((x,i)=>i?`<span>${esc(x)}</span>`:`<b>${esc(x)}</b>`).join('<i>/</i>');
  const cur=EV.on?'pipe':DY.on?'dyes':R.on?'rugs':(S.mode==='grid'||S.mode==='pix'||S.mode==='cat'||S.mode==='sheet'||S.mode==='pipe')?'queue':S.mode;
  ['pipe','sheet','queue','rugs','dyes'].forEach(t=>{const b=$('tab-'+t);if(b){b.classList.toggle('on',t===cur);b.setAttribute('aria-current',t===cur?'page':'false');}});}
function keysHelp(){const W=$('modal');
  const G=[['Везде',[['1 / 2','Узоры: листы / очередь проверки'],['+ −','масштаб'],['0','вписать'],['пробел (держать)','двигать / подглядеть скан'],['⌘Z, ⇧⌘Z','отменить / повторить'],['⌘S','сохранить'],['Esc','закрыть окно / редактор'],['?','эта шпаргалка']]],
    ['Редактор узора',[['Tab','Геометрия ↔ Пиксели'],['[ ]','соседний рисунок'],['B / P','перо'],['E','ластик'],['G / F','заливка'],['L','линия'],['R','прямоугольник (ещё раз — с заливкой)'],['C','копировать область'],['1…9, 0','цвет (1 — фон)'],['X','предыдущий цвет'],['U','подложка скана'],['Q','углы ↔ сетка (геометрия)'],['⌘\'','сетка'],['⌘Enter','готово']]],
    ['Очередь проверки',[['← → ↑ ↓','по карточкам'],['пробел','отметить'],['A','принять'],['X','на доработку'],['O','оригинал'],['Enter','открыть']]],
    ['Редактор ковра',[['B','рамка'],['H','рука'],['F / 0','вписать'],['Z','поле и каймы'],['I','паспорт'],['← → или [ ]','соседний ковёр'],['Tab','следующая рамка'],['C / X','верно / неверно'],['1…8','зона'],['R','повтор'],['J','тот же узор, что…'],['U','отделить от повторов'],['Q / W','повернуть / зеркало'],['S','схема поверх'],['D','фокус'],['G','найти этот узор на других коврах'],['E','вижу ещё (повторы с порогом ниже)'],['K','несколько ковров на фото — разделить'],['пробел (держать)','спрятать рамки, посмотреть узор'],['Delete','удалить рамку']]]];
  W.innerHTML=`<div class="mbox" style="width:min(860px,94vw)" role="dialog" aria-modal="true" aria-labelledby="kbH"><div class="flex" style="margin-bottom:8px"><b id="kbH" style="font-size:15px">Горячие клавиши</b><span class="sp"></span><button class="sm" id="mClose">Закрыть</button></div>
    <div class="kbgrid">${G.map(([h,ks])=>`<section><h4>${h}</h4>${ks.map(([k,d])=>`<div><kbd>${esc(k)}</kbd><span>${esc(d)}</span></div>`).join('')}</section>`).join('')}</div>
    <p class="mut" style="font-size:12px;margin:8px 0 0">Клавиши работают в любой раскладке (рус / az / en).</p></div>`;
  W.hidden=false;const close=()=>{W.hidden=true;W.innerHTML='';W.onclick=null;};$('mClose').onclick=close;W.onclick=e=>{if(e.target===W)close();};}
(()=>{
  ['pipe','queue','rugs','dyes'].forEach(k=>{const b=$('tab-'+k);if(!b)return;b.innerHTML=railIcon(k)+`<span>${RAIL_LB[k]}</span>`;b.setAttribute('aria-label',RAIL_LB[k]);$('rail').appendChild(b);});
  $('tab-sheet').hidden=true;   // v11.8: «Листы» — вкладка внутри «Узоров» (клавиша 1 работает как раньше)
  const kb=document.createElement('button');kb.id='railKeys';kb.className='kb';kb.setAttribute('aria-label','Горячие клавиши');kb.setAttribute('data-tip','Горячие клавиши (?)');kb.innerHTML=railIcon('kb')+'<span>Клавиши</span>';kb.onclick=keysHelp;$('rail').appendChild(kb);
  window.addEventListener('keydown',e=>{const ae=document.activeElement;if(e.key==='?'&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))&&$('modal').hidden&&!S.rv&&!S.hv&&!S.sv){e.preventDefault();e.stopImmediatePropagation();keysHelp();}},true);
  // v11.19: «Обзор» был про узоры — он теперь «Сводка» внутри «Узоров»; в колонке вместо него — «События» (что ждёт решения)
  const pb=$('tab-pipe');pb.setAttribute('data-tip','События: что ждёт вашего решения, итоги ночных прогонов, кто что сделал');
  pb.addEventListener('click',e=>{e.stopImmediatePropagation();e.preventDefault();EV.on?evClose():evOpen();},true);
  setInterval(crumbsUpd,400);crumbsUpd();
})();
</script></body></html>
