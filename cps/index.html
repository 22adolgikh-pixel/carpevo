#rgTypesV{position:absolute;inset:0;display:none;grid-template-columns:330px minmax(0,1fr)}#tyList{background:var(--pan);border-right:1px solid var(--ln);overflow:auto;padding:10px}#tySheet{overflow:auto;padding:12px 18px 30px}

.tyrow:hover{background:var(--pan2)}.tyrow.cur{border-color:var(--tx);background:var(--pan2)}.tyrow b{font-size:13px}.tyrow small{display:block;color:var(--mut);font-size:11.5px}.tybar{height:4px;background:var(--ln);border-radius:2px;margin-top:4px;overflow:hidden}.tybar i{display:block;height:100%;background:var(--ok)}.tybar i.p{background:var(--warn)}

.tyel.ok{border-color:var(--ok)}.tyel.pr{border-color:var(--warn)}.tyel.on{box-shadow:0 0 0 2px var(--tx)}
.typh{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.tyc{background:var(--pan2);border:1px solid var(--ln);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.tyc.dim{opacity:.45}
.tyc .im{height:180px;background:#0b0c0f;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}.tyc .im img{max-width:100%;max-height:100%;object-fit:contain}.tyc .bd{position:absolute;left:5px;top:5px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}.tyc .bd span{background:rgba(0,0,0,.75);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:9px}
.tyc .t{padding:6px 8px 0;font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tyc .m{padding:2px 8px;color:var(--mut);font-size:11.5px}.tyc .rgrow{padding:4px 8px 8px;margin:0}
#rgLoad{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.8);color:#fff;padding:6px 12px;border-radius:16px;font-size:12.5px}
.rgtw .vd{display:flex;gap:2px;justify-content:center;margin-top:2px}.rgtw .vd button{padding:0 5px;font-size:11px;line-height:16px;min-height:0;border-radius:4px}.rgtw .vd button.on{background:var(--tx);color:var(--bg)}
#modal .mbox.rgpassm{width:min(760px,94vw);max-height:88vh}
.rghint{margin:6px 0 4px}.rghint .hl{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.rghint button.hi{display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:4px;background:var(--pan2);border:1px solid var(--ln);border-radius:6px;color:var(--tx);cursor:pointer}
.rghint button.hi:hover{border-color:var(--tx)}.rghint button.hi img{width:66px;height:52px;object-fit:contain;background:#f2eee2;border-radius:3px;image-rendering:pixelated}.rghint button.hi.ph img{background:#0b0c0f;image-rendering:auto}
.rghint button.hi b{font-size:11px;font-weight:600;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rghint button.hi small{font-size:10px;color:var(--mut)}
#modal .mbox.msm{width:min(1180px,96vw);max-height:90vh;display:flex;flex-direction:column}
.msq{width:72px;height:72px;object-fit:contain;background:#0b0c0f;border-radius:6px;flex:none}.msh{font-size:16px;font-weight:600}
.msbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}.msbar .seg{display:inline-flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden}.msbar .seg button{border:0;border-radius:0}.msbar .seg button.on{background:var(--tx);color:var(--bg)}
#msBody{overflow:auto;min-height:200px}.mscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mscard{background:var(--pan2);border:1px solid var(--ln);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px}
.mscard .msim{height:170px;background:#0b0c0f;border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden}.mscard .msim img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto}

.mscard.yes{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}.mscard.no{opacity:.45}.mscard .rgrow{margin:0}
.msidx{margin-top:10px;color:var(--mut);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.msprog{height:4px;background:var(--ln);border-radius:2px;overflow:hidden;width:220px}.msprog>i{display:block;height:100%;background:var(--tx)}

.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}

.hintbox{font-family:Georgia,serif;font-style:italic;border:1px solid var(--ln2);display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--mut);font-size:10.5px;font-weight:700;cursor:help;position:relative;vertical-align:middle;flex:none;line-height:1}

.seg{display:inline-flex}

  <div id="vpbar"><button class="sm" id="zOut" data-tip="уменьшить" data-key="−">−</button><span id="zLbl">100%</span><button class="sm" id="zIn" data-tip="увеличить" data-key="+">+</button><button class="sm" id="zFit" data-tip="вписать в окно" data-key="0">вписать</button></div>
</footer>
<span id="cur" hidden></span>
<div id="modal" hidden></div>
<div id="tip"></div>

<script>
"use strict";
/* ============================ утилиты ============================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HT=html=>'<span class="hintbox" tabindex="0" aria-label="Пояснение">i<span class="htxt">'+html+'</span></span>';
async function api(path,body,method){
  const opt=body===undefined&&!method?{}:{method:method||'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)};
  const r=await fetch(path,opt);
  if(r.status===401){location.reload();throw new Error('нужен вход');}
  if(!r.ok){const t=await r.text();let m=null;try{m=JSON.parse(t).error}catch(e){}throw new Error(m||(path+' → '+r.status+' '+t.slice(0,200)));}
  return r.json();
}
/* v11.16: долгие расчёты (поиск повторов) приходят как {pending:id} — опрашиваем, пока не будет готово */
async function apiJob(path,body){let j=await api(path,body);const t0=Date.now();
  while(j&&j.pending){if(Date.now()-t0>600000)throw new Error('сервер считает слишком долго — попробуйте позже');await new Promise(r=>setTimeout(r,1500));j=await api('/api/jobs/'+j.pending,undefined,'GET');}
  return j;}
/* строка состояния: последнее сообщение остаётся на месте (тускнеет), вся история — по кнопке ☰ */
function stat(t,kind){const e=$('stat');e.className=kind||'';e.title=t;e.innerHTML=kind==='busy'?'<span class="spin"></span>'+esc(t):esc(t);
  if(t){S.log=S.log||[];const l=S.log[S.log.length-1];if(!l||l.t!==t)S.log.push({ts:new Date(),t,kind:kind||''});if(S.log.length>200)S.log.shift();if($('logPanel'))logRender();}
  if(kind==='ok'||!kind)setTimeout(()=>{if(e.title===t)e.classList.add('old');},t.length>60?9000:4000);}
function logRender(){const p=$('logPanel');if(!p)return;p.innerHTML=(S.log||[]).slice().reverse().map(l=>`<div class="${l.kind}"><span class="t">${l.ts.toTimeString().slice(0,8)}</span>${esc(l.t)}</div>`).join('')||'<div class="t">пока пусто</div>';}
function logToggle(){let p=$('logPanel');if(p){p.remove();return;}p=document.createElement('div');p.id='logPanel';document.body.appendChild(p);logRender();}
function fail(e){console.error(e);stat('⚠ '+(e.message||e),'err');}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('не загрузилась картинка '+src));i.src=src;});}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}

/* всплывающие подсказки: любой элемент с data-tip (и data-key — клавиша) */
(()=>{const tip=document.getElementById('tip');let cur=null;
  document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el===cur)return;cur=el;
    if(!el){tip.style.display='none';return;}
    tip.innerHTML=esc(el.dataset.tip)+(el.dataset.key?'<kbd>'+esc(el.dataset.key)+'</kbd>':'');tip.style.display='block';
    const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    let x=r.left+r.width/2-tw/2,y=r.bottom+6;if(y+th>innerHeight-4)y=r.top-th-6;
    tip.style.left=clamp(x,4,innerWidth-tw-4)+'px';tip.style.top=y+'px';});
  document.addEventListener('mousedown',()=>{tip.style.display='none';cur=null;});})();
const SV=(d,extra)=>`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra||''}>${d}</svg>`;
const ICON={
  pen:SV('<path d="M13.5 3.5l3 3L7 16H4v-3z"/><path d="M11.5 5.5l3 3"/>'),
  eraser:SV('<path d="M8 16h9"/><path d="M3.6 11.6l7-7a1.5 1.5 0 0 1 2.1 0l3.7 3.7a1.5 1.5 0 0 1 0 2.1L11 16H7.4l-3.8-3.8a.8.8 0 0 1 0-.6z"/><path d="M7 8l5 5"/>'),
  fill:SV('<path d="M4 9l5-5 7 7-5 5a1.4 1.4 0 0 1-2 0L4 11a1.4 1.4 0 0 1 0-2z"/><path d="M4 10h12"/><path d="M17 13.5s1.5 1.8 1.5 2.8a1.5 1.5 0 0 1-3 0c0-1 1.5-2.8 1.5-2.8z" fill="currentColor"/>'),
  pick:SV('<path d="M12.5 3.5a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L14 10l-4-4z"/><path d="M11 7l-7 7v2h2l7-7"/>'),
  line:SV('<path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="4" r="1.3" fill="currentColor"/>'),
  rect:SV('<rect x="4" y="5" width="12" height="10" rx="1"/>'),
  rectf:SV('<rect x="4" y="5" width="12" height="10" rx="1" fill="currentColor"/>'),
  undo:SV('<path d="M7 5L3.5 8.5 7 12"/><path d="M4 8.5h8a4 4 0 0 1 0 8H9"/>'),
  redo:SV('<path d="M13 5l3.5 3.5L13 12"/><path d="M16 8.5H8a4 4 0 0 0 0 8h3"/>'),
  symX:SV('<path d="M10 2.5v15" stroke-dasharray="2 2"/><path d="M8 6L3.5 10 8 14z"/><path d="M12 6l4.5 4-4.5 4z" fill="currentColor"/>'),
  symY:SV('<path d="M2.5 10h15" stroke-dasharray="2 2"/><path d="M6 8l4-4.5L14 8z"/><path d="M6 12l4 4.5 4-4.5z" fill="currentColor"/>'),
  rot:SV('<circle cx="10" cy="10" r="1.3" fill="currentColor"/><path d="M4.5 7.5A6 6 0 0 1 15 6"/><path d="M15.5 12.5A6 6 0 0 1 5 14"/><path d="M15 3v3h-3"/><path d="M5 17v-3h3"/>'),
  pixels:SV('<rect x="3" y="3" width="6" height="6" fill="currentColor"/><rect x="11" y="3" width="6" height="6"/><rect x="3" y="11" width="6" height="6"/><rect x="11" y="11" width="6" height="6" fill="currentColor"/>'),
  under:SV('<path d="M2.5 10s2.8-5 7.5-5 7.5 5 7.5 5-2.8 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.3"/>'),
  trim:SV('<circle cx="5.5" cy="5.5" r="2"/><circle cx="5.5" cy="14.5" r="2"/><path d="M7 7l10 8"/><path d="M7 13l10-8"/>'),
  flipH:SV('<path d="M10 3v14"/><path d="M7.5 5.5L3 10l4.5 4.5z"/><path d="M12.5 5.5L17 10l-4.5 4.5z"/>'),
  flipV:SV('<path d="M3 10h14"/><path d="M5.5 7.5L10 3l4.5 4.5z"/><path d="M5.5 12.5L10 17l4.5-4.5z"/>'),
  clear:SV('<path d="M4 6h12"/><path d="M8 6V4h4v2"/><path d="M5.5 6l.8 10.5h7.4L14.5 6"/>'),
  save:SV('<path d="M4 4h9.5L16 6.5V16H4z"/><path d="M7 4v4h6V4"/><rect x="7" y="11" width="6" height="5"/>'),
  copy:SV('<rect x="3" y="7" width="8" height="10" rx="1"/><path d="M7 7V4.5a1 1 0 0 1 1-1H16a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H14.5"/>'),
  paste:SV('<rect x="4" y="4" width="12" height="13" rx="1"/><path d="M7.5 4V3h5v1"/><path d="M6.5 9h7M6.5 12h7M6.5 15h4"/>'),
  grid:SV('<rect x="3" y="3" width="14" height="14" rx="1"/><path d="M3 8h14M3 13h14M8 3v14M13 3v14"/>'),
};
const IB=(ic,tip,key,attrs,on)=>`<button class="ib ${on?'on':''}" data-tip="${esc(tip)}" ${key?`data-key="${esc(key)}"`:''} ${attrs||''}>${ICON[ic]}</button>`;
/* сложность узора — выставляется при первичном просмотре листа */
const dispName=f=>f.name_az||f.name||'';

/* ============================ состояние ============================ */
const S={
  mode:'sheet',
  sheets:[],figures:[],siteIndex:[],legend:[],dyes:[],
  sheet:null,            // {path,img,table,boxes:[],sel}
  fig:null,              // рабочие данные рисунка (см. loadFigure)
  dirty:false,autoFill:true,autoMode:(()=>{try{return localStorage.getItem('cpsMode')||'auto';}catch(e){return 'auto';}})(),showGrid:(()=>{try{return localStorage.getItem('cpsGrid')!=='0';}catch(e){return true;}})(),
  catQ:'',
};

/* ============================ вьюпорт (зум/пан) ============================ */
const cv=$('cv'),ctx=cv.getContext('2d');
const V={s:1,tx:0,ty:0,dpr:1,w:0,h:0};
let spaceDown=false,panning=null;
function resize(){const r=cv.getBoundingClientRect();V.dpr=window.devicePixelRatio||1;V.w=r.width;V.h=r.height;cv.width=Math.round(r.width*V.dpr);cv.height=Math.round(r.height*V.dpr);redraw();}
function toWorld(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-V.tx)/V.s,y:(ev.clientY-r.top-V.ty)/V.s};}
function fitTo(w,h,pad){pad=pad??30;const s=Math.min((V.w-pad*2)/w,(V.h-pad*2)/h);V.s=s>0?s:1;V.tx=(V.w-w*V.s)/2;V.ty=(V.h-h*V.s)/2;redraw();}
function zoomAt(f,cx,cy){const ns=clamp(V.s*f,0.05,200);f=ns/V.s;V.tx=cx-(cx-V.tx)*f;V.ty=cy-(cy-V.ty)*f;V.s=ns;redraw();}
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();const r=cv.getBoundingClientRect();const cx=ev.clientX-r.left,cy=ev.clientY-r.top;
  const mouseWheel=ev.deltaMode===1||(ev.deltaX===0&&Math.abs(ev.deltaY)>=50&&Number.isInteger(ev.deltaY));
  if(ev.ctrlKey||ev.metaKey||mouseWheel){zoomAt(Math.exp(-ev.deltaY*(ev.ctrlKey?0.01:0.0015)),cx,cy);}
  else{V.tx-=ev.deltaX;V.ty-=ev.deltaY;redraw();}
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);
  if(ev.button===1||(ev.button===0&&spaceDown)){panning={x:ev.clientX,y:ev.clientY,tx:V.tx,ty:V.ty};cv.style.cursor='grabbing';return;}
  const h=H();if(h&&h.down)h.down(toWorld(ev),ev);
});
cv.addEventListener('pointermove',ev=>{
  if(panning){V.tx=panning.tx+ev.clientX-panning.x;V.ty=panning.ty+ev.clientY-panning.y;redraw();return;}
  const w=toWorld(ev);const h=H();if(h&&h.move)h.move(w,ev);if(h&&h.hud)$('hud').textContent=h.hud(w);
});
cv.addEventListener('pointerup',ev=>{if(panning){panning=null;cv.style.cursor='';return;}const h=H();if(h&&h.up)h.up(toWorld(ev),ev);});
function toggleGrid(){S.showGrid=!S.showGrid;try{localStorage.setItem('cpsGrid',S.showGrid?'1':'0');}catch(e){}const el=$('gridTog');if(el)el.classList.toggle('on',S.showGrid);const c=$('vGridTog');if(c)c.classList.toggle('on',S.showGrid);redraw();}
$('zIn').onclick=()=>zoomAt(1.25,V.w/2,V.h/2);$('zOut').onclick=()=>zoomAt(0.8,V.w/2,V.h/2);$('zFit').onclick=()=>{const h=H();if(h&&h.fit)h.fit();};
let rafPending=false;
function redraw(){if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;draw();});}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(V.dpr*V.s,0,0,V.dpr*V.s,V.dpr*V.tx,V.dpr*V.ty);ctx.imageSmoothingEnabled=false;
  const h=H();if(h&&h.draw)h.draw(ctx);
  $('zLbl').textContent=Math.round(V.s*100)+'%';
}
const px1=()=>1/V.s;   // 1 экранный пиксель в мировых координатах
function handle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r*px1(),0,7);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=1.5*px1();ctx.strokeStyle=stroke||'#000';ctx.stroke();}
function near(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<=r*px1();}

/* ============================ режимы ============================ */
const MODES={};
function H(){return MODES[S.mode==='grid'?(S.gridView||'grid'):S.mode];}
function setMode(m,opt){
  opt=opt||{};
  const ov=m==='grid'||m==='pix',wasOv=S.mode==='grid'||S.mode==='pix';
  if(ov&&!wasOv){S.back=opt.back||S.mode||'queue';S.backScroll=$('catalog').scrollTop;}
  if(m!=='sheet'&&m!=='cat'&&m!=='queue'&&m!=='pipe'&&!S.fig){stat('сначала откройте рисунок в «Каталоге» (или нарежьте лист)','err');m=S.fig?m:(S.mode==='sheet'?'sheet':'queue');}
  S.mode=m;S.peek=false;if(typeof pvHide==='function')pvHide();$('peek').style.display='none';
  document.body.classList.toggle('noleft',!['sheet','queue','cat'].includes(m));   // v11.3: у «Узоров» слева — дерево источников
  const under=ov?(S.back||'queue'):m;
  ['sheet','queue'].forEach(k=>$('tab-'+k).classList.toggle('on',k===under||(k==='queue'&&(under==='cat'||under==='pipe'))));
  $('tab-edit').style.display=!ov&&S.fig&&m!=='pipe'?'':'none';
  ['grid','pix','close'].forEach(k=>$('tab-'+k).style.display=ov?'':'none');
  $('tab-grid').classList.toggle('on',m==='grid');$('tab-pix').classList.toggle('on',m==='pix');
  $('catalog').style.display=(m==='cat'||m==='queue'||m==='pipe')?'block':'none';
  $('vpbar').style.display=$('hud').style.display=(m==='cat'||m==='queue'||m==='pipe')?'none':'';
  $('toolcol').style.display=m==='pix'?'flex':'none';
  renderLeft();renderRight();renderNav();renderSbInfo();
  requestAnimationFrame(()=>{resize();const h=H();if(h&&h.fit)h.fit();else redraw();});
}
/* навигация по рисункам в шапке (вместо левого списка на экранах 2–3) */
function renderNav(){
  const N=$('nav');
  if(S.mode==='sheet'||S.mode==='cat'||S.mode==='queue'||S.mode==='pipe'||!S.fig){N.innerHTML='';return;}
  const list=S.figures,i=list.findIndex(f=>f.id===S.fig.id);
  N.innerHTML=`<button class="ib" id="navPrev" data-tip="предыдущий рисунок" data-key="[">‹</button>`+
    `<select id="navSel" data-tip="перейти к рисунку">${list.map(f=>`<option value="${esc(f.id)}" ${f.id===S.fig.id?'selected':''}>${f.done?'✓ ':(f.auto?'⚡ ':(f.size?'◐ ':'○ '))}${esc(f.id)}${dispName(f)?' — '+esc(dispName(f)):''}</option>`).join('')}</select>`+
    `<span class="pos">${i+1}/${list.length}</span>`+
    `<button class="ib" id="navNext" data-tip="следующий рисунок" data-key="]">›</button>`+
    `<button class="sm" id="navTodo" data-tip="следующий неготовый">⏭</button>`;
  $('navPrev').onclick=()=>gotoFig(-1);$('navNext').onclick=()=>gotoFig(1);$('navTodo').onclick=()=>gotoFig(1,true);
  $('navSel').onchange=e=>{e.target.blur();openFigure(e.target.value).then(()=>{const want=S.fig.M?'pix':'grid';if(S.mode!==want)setMode(want);}).catch(fail);};
}
async function gotoFig(delta,todo){
  const list=S.figures;if(!list.length||!S.fig)return;let i=list.findIndex(f=>f.id===S.fig.id);
  for(let k=0;k<list.length;k++){i=(i+delta+list.length)%list.length;if(!todo||!list[i].done)break;}
  if(list[i].id===S.fig.id){stat(todo?'неготовых рисунков больше нет':'это единственный рисунок','ok');return;}
  await openFigure(list[i].id);
  const want=S.fig.M?'pix':'grid';if(S.mode!==want)setMode(want);   // готовые — сразу в пиксели, новые — в сетку
}
['pipe','sheet','queue'].forEach(k=>$('tab-'+k).onclick=()=>{if(S.mode==='grid'||S.mode==='pix'){ovClose(k);}else setMode(k);});
/* редактор (геометрия/пиксели) — окно поверх экрана, из которого открыли; закрытие возвращает туда же и на то же место списка */
async function ovClose(to){
  const back=to||S.back||'queue',sc=S.backScroll||0;
  if(S.dirty){try{await saveFigure(true);}catch(e){fail(e);}}
  setMode(back);
  try{await refreshFigures();}catch(e){}
  if(!to){const c=$('catalog');if(c)c.scrollTop=sc;}
}
function ovSwitch(){
  if(S.mode==='grid'||S.mode==='pix'){if(S.mode==='grid'){if(S.fig&&S.fig.M)setMode('pix');else stat('пикселей ещё нет — сначала сетка','err');}else setMode('grid');}
  else if(S.fig)setMode(S.fig.M?'pix':'grid');else stat('сначала откройте рисунок','err');
}
$('tab-grid').onclick=()=>setMode('grid');$('tab-pix').onclick=()=>setMode('pix');$('tab-close').onclick=()=>ovClose();
$('tab-edit').onclick=()=>ovSwitch();

/* ============================ левая панель ============================ */
/* дерево источников: папка → подпапка → листы (до двух уровней) */
function foldLoad(){try{return new Set(JSON.parse(localStorage.getItem('cpsFold')||'[]'));}catch(e){return new Set();}}
function foldSave(){try{localStorage.setItem('cpsFold',JSON.stringify([...(S.fopen||[])]));}catch(e){}}
function sheetItem(s){return `<div class="item ${S.sheet&&S.sheet.path===s.path?'sel':''}" data-p="${esc(s.path)}" style="${s.no_figures?'opacity:.5':''}"><img class="thumb" loading="lazy" src="/api/sheet_thumb?path=${encodeURIComponent(s.path)}" alt=""><div>${esc(s.name)}<small>${s.no_figures?'пусто (без рисунков)':(s.table?('Табл. '+esc(s.table)+' · '):'')+(s.n?(s.n+' рис., готово '+s.done):'не размечен')}</small><span class="dot ${s.no_figures?'':(s.n?(s.done===s.n?'done':'mid'):'')}" style="display:inline-block;margin-top:3px"></span></div></div>`;}
function sheetTree(){
  S.fopen=S.fopen||foldLoad();
  if(!S.sheets.length)return '<div class="info">сканов нет</div>';
  const tree={};S.sheets.forEach(s=>{const a=s.source||'(без папки)',b=s.sub||'';((tree[a]=tree[a]||{})[b]=tree[a][b]||[]).push(s);});
  const cur=S.sheet&&S.sheets.find(x=>x.path===S.sheet.path),stat_=l=>{const n=l.reduce((t,s)=>t+s.n,0),d=l.reduce((t,s)=>t+s.done,0);return `${l.length} л.${n?` · ${d}/${n}`:''}`;};
  const srcs=Object.keys(tree).sort(),single=srcs.length===1&&Object.keys(tree[srcs[0]]).length===1;
  return srcs.map(a=>{
    const subs=Object.keys(tree[a]).sort(),all=subs.flatMap(b=>tree[a][b]);
    const ka='a|'+a,openA=S.fopen.has('x|'+ka)?false:true;
    const body=subs.map(b=>{
      if(!b)return tree[a][b].map(sheetItem).join('');
      const kb='b|'+a+'|'+b,openB=S.fopen.has('x|'+kb)?false:(S.fopen.has(kb)||!!(cur&&cur.source===a&&cur.sub===b));
      return `<div class="fld sub" data-f="${esc(kb)}" data-open="${openB?1:0}"><span class="chev">${openB?'▾':'▸'}</span><span class="fn">${esc(b)}</span><small>${stat_(tree[a][b])}</small></div>`+(openB?`<div class="fbody sub">${tree[a][b].map(sheetItem).join('')}</div>`:'');}).join('');
    return `<div class="fld" data-f="${esc(ka)}" data-open="${openA?1:0}"><span class="chev">${openA?'▾':'▸'}</span><span class="fn">${esc(a)}</span><small>${stat_(all)}</small></div>`+(openA?`<div class="fbody">${body}</div>`:'');
  }).join('');}
function renderLeft(){
  const L=$('left');
  if(S.mode==='sheet'){
    L.innerHTML='<div style="margin-bottom:8px">'+viewSwitch()+'</div><h4>Сканы листов</h4>'+
      '<div class="flex" style="margin-bottom:6px"><button id="upSheets" class="sm">+ загрузить сканы</button><button id="rfSheets" class="sm">обновить</button></div>'+
      '<input type="file" id="upFile" multiple accept="image/*" hidden>'+sheetTree()+

async function uploadFiles(url,files){
  files=files.filter(f=>/^image\//.test(f.type)||/\.(png|jpe?g|webp|tiff?|bmp)$/i.test(f.name));
  if(!files.length){stat('нет картинок в выборе','err');return;}
  for(let i=0;i<files.length;i+=10){
    stat('загрузка '+i+'/'+files.length,'busy');
    const fd=new FormData();files.slice(i,i+10).forEach(f=>fd.append('files',f));
    const r=await fetch(url,{method:'POST',body:fd});if(!r.ok)throw new Error('загрузка: HTTP '+r.status);
  }
  stat('загружено '+files.length,'ok');
}

/* ============================ ГЕОМЕТРИЯ: гомография и выпрямление ============================ */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[m][i]))m=k;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];

    A.push([u,v,1,0,0,0,-u*x,-v*x]);b.push(x);A.push([0,0,0,u,v,1,-u*y,-v*y]);b.push(y);}

    let x=(h[0]*uu+h[1]*vv+h[2])/d-0.5,y=(h[3]*uu+h[4]*vv+h[5])/d-0.5;
    if(x<0)x=0;if(y<0)y=0;if(x>sw-1.001)x=sw-1.001;if(y>sh-1.001)y=sh-1.001;
    const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=y0*sw+x0;

  F.W=W;F.H=Hh;F.wg=out;}

  const lut=new Float32Array(256);for(let i=0;i<256;i++){let v=(i/255-0.5)*c+0.5+b;v=clamp(v,0,1);v=Math.pow(v,g);if(inv)v=1-v;lut[i]=v*255;}
  for(let i=0;i<n;i++){const s=F.wg[i];const i0=s|0;ag[i]=i0>=255?lut[255]:lut[i0]+(lut[i0+1]-lut[i0])*(s-i0);}
  F.ag=ag;
  const can=F.wcan||(F.wcan=document.createElement('canvas'));can.width=F.W;can.height=F.H;
  const x=can.getContext('2d'),im=x.createImageData(F.W,F.H),d=im.data;
  for(let i=0;i<n;i++){const v=ag[i];d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}
  x.putImageData(im,0,0);

/* оригинал скана в цвете, выпрямленный по тем же углам — для «подглядеть» по пробелу */
function colorWarp(F){
  const key=F.quad.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('|')+'|'+F.W+'x'+F.H;
  if(F._wcolKey===key&&F.wcol)return F.wcol;

  const x=can.getContext('2d'),im=x.createImageData(W,Hh),d=im.data;

let rewarpT=0;
function rewarp(full){const F=S.fig;if(!F)return;if(full!==false)warp(F);adjust(F);F.samples=null;redraw();}

/* ============================ автосетка ============================ */
function boxBlur1D(a,n,stride,count,r){ // по месту, многократно
  const tmp=new Float32Array(n);
  for(let c=0;c<count;c++){const off=c*(stride===1?n:1);
    let acc=0;const get=i=>a[off+clamp(i,0,n-1)*stride];
    for(let i=-r;i<=r;i++)acc+=get(i);
    for(let i=0;i<n;i++){tmp[i]=acc/(2*r+1);acc+=get(i+r+1)-get(i-r);}
    for(let i=0;i<n;i++)a[off+i*stride]=tmp[i];}}
function gridProfiles(F){
  const W=F.W,Hh=F.H,g=F.wg,bl=Float32Array.from(g);
  for(let k=0;k<2;k++){boxBlur1D(bl,W,1,Hh,3);boxBlur1D(bl,Hh,W,W,3);}
  const hp=new Float32Array(W*Hh);for(let i=0;i<hp.length;i++)hp[i]=bl[i]-g[i]; // тонкие тёмные линии > 0
  const med=(arr)=>{arr.sort();return arr[arr.length>>1];};
  const px=new Float32Array(W),py=new Float32Array(Hh);
  const col=new Float32Array(Hh);for(let x=0;x<W;x++){for(let y=0;y<Hh;y++)col[y]=hp[y*W+x];px[x]=med(col);}
  const row=new Float32Array(W);for(let y=0;y<Hh;y++){for(let x=0;x<W;x++)row[x]=hp[y*W+x];py[y]=med(row);}
  return[px,py];}
function combScore(pr,p){let re=0,im=0;const n=pr.length,w=2*Math.PI/p;for(let i=0;i<n;i++){re+=pr[i]*Math.cos(w*i);im-=pr[i]*Math.sin(w*i);}
  return{s:Math.hypot(re,im)/n,ph:((-Math.atan2(im,re)/(2*Math.PI))*p%p+p)%p};}
function acPeriod(pr){ // первый значимый пик автокорреляции = основной шаг (гармоники не мешают)
  const n=pr.length;let mean=0;for(const v of pr)mean+=v;mean/=n;const z=pr.map(v=>v-mean);
  const L=Math.floor(Math.min(90,n/2.5));const ac=new Float32Array(L+2);
  for(let l=0;l<=L+1;l++){let s=0;for(let i=0;i+l<n;i++)s+=z[i]*z[i+l];ac[l]=s/(n-l);}
  const peaks=[];for(let l=3;l<=L;l++)if(ac[l]>ac[l-1]&&ac[l]>=ac[l+1]&&ac[l]>0)peaks.push(l);
  if(!peaks.length)return{z,p:8,ok:false};
  const mx=Math.max(...peaks.map(l=>ac[l]));const l=peaks.find(l=>ac[l]>=0.45*mx);

function estimateGrid(F){
  const[prx,pry]=gridProfiles(F);const ax=acPeriod(prx),ay=acPeriod(pry);let pw,ph,ox,oy;

  const F=S.fig;if(!F)return;stat('ищу шаг сетки…','busy');
  setTimeout(()=>{try{estimateGrid(F);const G=F.grid;F.samples=null;markDirty();renderRight();redraw();
    stat('шаг '+G.pw.toFixed(2)+'×'+G.ph.toFixed(2)+' px, клеток '+G.cols+'×'+G.rows,'ok');}catch(e){fail(e);}},20);}

/* ============================ выборка клеток и тоны ============================ */
function sampleCells(F){
  const G=F.grid,W=F.W,ag=F.ag,inner=F.cls.inner/100,out=new Float32Array(G.cols*G.rows);
  for(let j=0;j<G.rows;j++)for(let i=0;i<G.cols;i++){
    const cx=G.ox+(i+0.5)*G.pw,cy=G.oy+(j+0.5)*G.ph,hw=Math.max(0.5,G.pw*inner/2),hh=Math.max(0.5,G.ph*inner/2);
    let x0=Math.floor(cx-hw),x1=Math.ceil(cx+hw),y0=Math.floor(cy-hh),y1=Math.ceil(cy+hh);
    x0=clamp(x0,0,W-1);x1=clamp(x1,x0+1,W);y0=clamp(y0,0,F.H-1);y1=clamp(y1,y0+1,F.H);
    let s=0,n=0;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){s+=ag[y*W+x];n++;}
    out[j*G.cols+i]=n?s/n:255;}

function toneCenters(v,K,auto){ // центры тонов; при auto слабые «тоны» (шум бумаги) сливаются с фоном
  let c=kmeans1d(v,K);if(auto){while(c.length>2&&c[0]-c[1]<35)c=kmeans1d(v,c.length-1);}return c;}

    for(const v of vals){let b=0,bd=1e9;for(let k=0;k<K;k++){const d=Math.abs(v-c[k]);if(d<bd){bd=d;b=k;}}sum[b]+=v;cnt[b]++;}
    for(let k=0;k<K;k++)if(cnt[k])c[k]=sum[k]/cnt[k];}
  return c.sort((a,b)=>b-a);} // от светлого к тёмному

  // палитра по умолчанию — серые уровни найденных тонов (если палитра ещё не настроена руками)

// v6: самые тёмные клетки — цвет 1 (контур), следующие по светлоте — 2, 3…; светлее всех порогов — фон
function classOf(val,t){const s=[...t].sort((a,b)=>a-b);let k=0;while(k<s.length&&val>=s[k])k++;return k>=s.length?0:k+1;}

    m.rows.forEach((r,j)=>{for(let i=0;i<m.w;i++){const ch=r[i]||'.';F.M.d[j*m.w+i]=ch==='.'?0:parseInt(ch,36);}});}

function autoGridSync(F){estimateGrid(F);}
function autoTonesSync(F){const v=sampleCells(F);const c=toneCenters(v,F.cls.tones+1,true);F.cls.tones=c.length-1;F.cls.thr=[];for(let k=0;k<c.length-1;k++)F.cls.thr.push(Math.round((c[k]+c[k+1])/2));F.cls.centers=c.map(Math.round);

const SYM_C='#b07cff';   // ось зеркала — фиолетовый пунктир, чтобы не путать с сеткой и рамкой

function fitPalette(F,c){
  const n=c.length;
  if(!F.palTouched){F.palette=FIXED_PALETTE.slice(0,n);F.palNames=FIXED_NAMES.slice(0,n);return;}
  while(F.palette.length<n){const i=F.palette.length;F.palette.push(FIXED_PALETTE[i]||'#b22222');F.palNames.push(FIXED_NAMES[i]||('тон '+i));}
  if(F.palette.length>n){F.palette.length=n;F.palNames.length=n;}}
let autoT=0,sbT=0;
function markDirty(){S.dirty=true;clearTimeout(autoT);autoT=setTimeout(autosave,1200);clearTimeout(sbT);sbT=setTimeout(renderSbInfo,150);}
function autosave(){ // всё сохраняется само: через ~1 с после правки (не посреди мазка)
  if(!S.fig||!S.dirty)return;if(MODES.pix.drag||MODES.quad.drag||MODES.grid.drag||S.saving){autoT=setTimeout(autosave,600);return;}
  saveFigure(true).catch(fail);}

/* ============================ 2a. УГЛЫ (перспектива) ============================ */
MODES.quad={
  fit(){const F=S.fig;if(F)fitTo(F.src.w,F.src.h);},
  draw(c){const F=S.fig;if(!F)return;c.drawImage(buildRawAdjPreview(F)||F.img,0,0);const q=F.quad;
    c.beginPath();q.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.lineWidth=2*px1();c.strokeStyle='#ffb454';c.stroke();
    // предпросмотр сетки внутри квадра (через гомографию)
    const G=F.grid,h=homography([[0,0],[F.W,0],[F.W,F.H],[0,F.H]],q);const P=(u,v)=>{const d=h[6]*u+h[7]*v+1;return[(h[0]*u+h[1]*v+h[2])/d,(h[3]*u+h[4]*v+h[5])/d];};
    c.lineWidth=px1();c.strokeStyle='rgba(108,182,255,.55)';c.beginPath();
    for(let i=0;i<=G.cols;i+=1){const u=G.ox+i*G.pw;const a=P(u,G.oy),b=P(u,G.oy+G.rows*G.ph);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}
    for(let j=0;j<=G.rows;j+=1){const v=G.oy+j*G.ph;const a=P(G.ox,v),b=P(G.ox+G.cols*G.pw,v);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}
    if(V.s*G.pw>3)c.stroke();
    ['1','2','3','4'].forEach((n,i)=>{handle(q[i][0],q[i][1],7,i===this.sel?'#ffb454':'#fff');c.fillStyle='#000';c.font=`bold ${10*px1()}px system-ui`;c.fillText(n,q[i][0]-3*px1(),q[i][1]+3.5*px1());});
  },
  down(w,ev){const F=S.fig;const i=F.quad.findIndex(p=>near({x:p[0],y:p[1]},w,10));
    if(i>=0){this.sel=i;this.drag={i};}else if(inPoly(w,F.quad)){this.drag={all:true,x:w.x,y:w.y,q:F.quad.map(p=>[...p])};}
    redraw();},
  move(w){const d=this.drag,F=S.fig;if(!d)return;
    if(d.all){F.quad=d.q.map(p=>[p[0]+w.x-d.x,p[1]+w.y-d.y]);}else F.quad[d.i]=[w.x,w.y];
    markDirty();F.quadMoved=true;redraw();},
  up(){if(this.drag){this.drag=null;rewarp();renderRight();}},
  hud(w){const F=S.fig;return F?Math.round(w.x)+', '+Math.round(w.y)+(this.sel!=null?'  угол '+(this.sel+1):''):'';},
  key(e){const F=S.fig;if(this.sel==null)return false;const st=e.shiftKey?5:0.5;
    const mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
    if(mv){F.quad[this.sel]=[F.quad[this.sel][0]+mv[0],F.quad[this.sel][1]+mv[1]];markDirty();rewarpSoon();return true;}
    if(e.key==='Tab'){this.sel=(this.sel+1)%4;redraw();return true;}return false;}
};
function inPoly(p,q){let c=false;for(let i=0,j=3;i<4;j=i++){const a=q[i],b=q[j];if(((a[1]>p.y)!==(b[1]>p.y))&&(p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function rotateQuad(F,deg){
  const rad=deg*Math.PI/180,cos=Math.cos(rad),sin=Math.sin(rad);
  const cx=F.quad.reduce((s,p)=>s+p[0],0)/4,cy=F.quad.reduce((s,p)=>s+p[1],0)/4;
  F.quad=F.quad.map(([x,y])=>{const dx=x-cx,dy=y-cy;return[cx+dx*cos-dy*sin,cy+dx*sin+dy*cos];});
}

MODES.grid={
  fit(){const F=S.fig;if(F)fitTo(F.W,F.H);},
  draw(c){const F=S.fig;if(!F)return;const G=F.grid;
    c.drawImage(S.peek?colorWarp(F):F.wcan,0,0);
    if(S.peek){}
    else if(F.preview){const k=classify(F);for(let j=0;j<G.rows;j++)for(let i=0;i<G.cols;i++){const v=k[j*G.cols+i];if(!v)continue;
        c.fillStyle=F.palette[v]||'#f0f';c.globalAlpha=F.previewAlpha;c.fillRect(G.ox+i*G.pw,G.oy+j*G.ph,G.pw,G.ph);}c.globalAlpha=1;}
    const x1=G.ox+G.cols*G.pw,y1=G.oy+G.rows*G.ph;
    c.lineWidth=px1();c.strokeStyle='rgba(255,180,84,.75)';c.beginPath();
    if(V.s*G.pw>2.5){for(let i=0;i<=G.cols;i++){const x=G.ox+i*G.pw;c.moveTo(x,G.oy);c.lineTo(x,y1);}
      for(let j=0;j<=G.rows;j++){const y=G.oy+j*G.ph;c.moveTo(G.ox,y);c.lineTo(x1,y);}}c.stroke();
    c.lineWidth=2*px1();c.strokeStyle='#ffb454';c.strokeRect(G.ox,G.oy,x1-G.ox,y1-G.oy);
    if(F.showInner&&V.s*G.pw>8){c.strokeStyle='rgba(126,201,107,.7)';c.lineWidth=px1();const inn=F.cls.inner/100;
      for(let j=0;j<G.rows;j++)for(let i=0;i<G.cols;i++){c.strokeRect(G.ox+(i+0.5-inn/2)*G.pw,G.oy+(j+0.5-inn/2)*G.ph,G.pw*inn,G.ph*inn);}}
    handle(G.ox,G.oy,7,'#7ec96b');handle(x1,y1,7,'#7ec96b');},
  down(w){const F=S.fig,G=F.grid;const x1=G.ox+G.cols*G.pw,y1=G.oy+G.rows*G.ph;
    if(near(w,{x:G.ox,y:G.oy},10))this.drag={k:'o',fx:x1,fy:y1};
    else if(near(w,{x:x1,y:y1},10))this.drag={k:'f'};
    else this.drag={k:'m',x:w.x,y:w.y,ox:G.ox,oy:G.oy};},
  move(w,ev){const d=this.drag;if(!d)return;const F=S.fig,G=F.grid;
    if(d.k==='m'){G.ox=+(d.ox+w.x-d.x).toFixed(2);G.oy=+(d.oy+w.y-d.y).toFixed(2);}
    else if(d.k==='o'){G.ox=+w.x.toFixed(2);G.oy=+w.y.toFixed(2);G.pw=+((d.fx-G.ox)/G.cols).toFixed(3);G.ph=+((d.fy-G.oy)/G.rows).toFixed(3);}
    else{G.pw=+((w.x-G.ox)/G.cols).toFixed(3);G.ph=+((w.y-G.oy)/G.rows).toFixed(3);}
    if(G.pw<1)G.pw=1;if(G.ph<1)G.ph=1;
    F.samples=null;markDirty();syncGridInputs();redraw();},
  up(){this.drag=null;},
  hud(w){const F=S.fig;if(!F)return'';const G=F.grid;const i=Math.floor((w.x-G.ox)/G.pw),j=Math.floor((w.y-G.oy)/G.ph);
    let s='клетка '+(i+1)+','+(j+1);if(F.samples&&i>=0&&j>=0&&i<G.cols&&j<G.rows)s+='  яркость '+Math.round(F.samples[j*G.cols+i]);return s;},
  key(e){const F=S.fig,G=F.grid;const st=e.shiftKey?1:0.25;const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];

    else{G.ox=+(G.ox+mv[0]*st).toFixed(2);G.oy=+(G.oy+mv[1]*st).toFixed(2);}
    F.samples=null;markDirty();syncGridInputs();redraw();return true;}
};
function syncGridInputs(){const F=S.fig;if(!F)return;const G=F.grid;[['gPw',G.pw],['gPh',G.ph],['gOx',G.ox],['gOy',G.oy],['gCols',G.cols],['gRows',G.rows]].forEach(([id,v])=>{const e=$(id);if(e&&document.activeElement!==e)e.value=v;});drawHist();}

function histEvents(){const c=$('hist');let dragI=-1;const pos=e=>{const r=c.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width*255,0,255);};

function snap(F){return {w:F.M.w,h:F.M.h,ox:F.M.ox,oy:F.M.oy,d:F.M.d.slice(),pal:F.palette.slice(),names:F.palNames.slice(),dyes:(F.palDyes||[]).slice(),link:(F.palLink||[]).slice(),scan:(F.palScan||[]).slice(),thr:F.cls&&F.cls.thr?F.cls.thr.slice():null,cur:F.cur};}

function mirrorPts(sy,M,i,j){const[mi,mj]=mirrorOf(sy,M,i,j);const seen=new Set([i+','+j]),pts=[];
  const add=(a,b)=>{const k=a+','+b;if(!seen.has(k)){seen.add(k);pts.push([a,b]);}};

function applyRapport(){
  const F=S.fig,rp=F&&F.work.rapport;if(!rp||!rp.found||!rp.unit||!F.M)return;
  const T=rp.period,off=rp.offset,M=F.M,rows=rp.unit.rows.map(r=>[...r].map(c=>c==='.'?0:parseInt(c,36)));
  const len=rp.axis==='v'?M.h:M.w,trim=len>=60?Math.floor(len*0.05):0;let n=0;pushUndo();
  for(let p=trim;p<len-trim;p++){const u=(((p-off)%T)+T)%T;
    if(rp.axis==='v'){for(let i=0;i<M.w;i++){const v=rows[u][i]||0;if(M.d[p*M.w+i]!==v){M.d[p*M.w+i]=v;n++;}}}
    else{for(let j=0;j<M.h;j++){const v=rows[j][u]||0;if(M.d[j*M.w+p]!==v){M.d[j*M.w+p]=v;n++;}}}}
  markDirty();redraw();renderInfo();stat('по раппорту исправлено клеток: '+n,'ok');

function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[ә]/g,'э').replace(/[^a-zа-яəğıöüşç0-9]+/g,' ').trim();}
let suggT=0,suggSeq=0;
function suggestSiteSoon(){clearTimeout(suggT);suggT=setTimeout(suggestSite,250);}
async function suggestSite(){const F=S.fig,e=$('sugg');if(!e||!F)return;const m=F.meta;
  const names=[m.name_az,m.name].filter(Boolean);if(!names.length&&!m.translation){e.innerHTML='';return;}
  const seq=++suggSeq;let hits=[];
  try{hits=await api('/api/site_suggest',{names,translation:m.translation||'',limit:8});}catch(err){e.textContent='подбор недоступен: '+err.message;return;}
  if(seq!==suggSeq||!$('sugg'))return;
  const cur=(m.site_id||'').split(',').map(x=>x.trim());
  e.innerHTML=hits.length?('Похоже на страницы сайта:<br>'+hits.map(s=>`<span class="suggest" data-id="${esc(s.id)}" data-tip="${esc((s.kind==='motif'?'мотив':'элемент')+' · совпадение '+s.score)}">${cur.includes(s.id)?'✓ ':''}${esc(s.az||s.id)}</span> <span style="color:var(--mut)">${esc(s.ru||'')} · ${esc(s.id)}</span>`).join('<br>')):'Совпадений на сайте не нашлось — можно выбрать из списка.';
  e.querySelectorAll('.suggest').forEach(x=>x.onclick=()=>{const ids=(m.site_id||'').split(',').map(t=>t.trim()).filter(Boolean);if(!ids.includes(x.dataset.id))ids.push(x.dataset.id);m.site_id=ids.join(', ');markDirty();const si=document.querySelector('#modal [data-m=site_id]');if(si){si.value=m.site_id;suggestSite();}else renderRight();});}

/* ============================ сохранение ============================ */
function workPayload(){const F=S.fig;const p={quad:F.quad.map(q=>q.map(v=>+v.toFixed(2))),adjust:F.adj,grid:F.grid,classify:{tones:F.cls.tones,inner:F.cls.inner,thr:F.cls.thr,centers:F.cls.centers},
  palette:F.palette,palette_names:F.palNames,palette_dyes:F.palDyes,palette_link:F.palLink,palette_scan:F.palScan,palette_touched:F.palTouched,meta:F.meta,done:F.done,review:!!F.review,transparent_bg:F.transparent,difficulty:F.difficulty||null};
  if(F.M){const M=F.M,rows=[];for(let j=0;j<M.h;j++){let r='';for(let i=0;i<M.w;i++){const v=M.d[j*M.w+i];r+=v?v.toString(36):'.';}rows.push(r);}p.matrix={w:M.w,h:M.h,origin:[M.ox,M.oy],rows};}
  return p;}
function trimSilent(){ // автообрезка по рамке рисунка перед сохранением — не нужно жать «обрезать» руками каждый раз
  const F=S.fig,M=F.M;if(!M)return;let x0=M.w,y0=M.h,x1=-1,y1=-1;
  for(let j=0;j<M.h;j++)for(let i=0;i<M.w;i++)if(M.d[j*M.w+i]){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}
  if(x1<0)return;const m=F.trimMargin|0;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(M.w-1,x1+m);y1=Math.min(M.h-1,y1+m);
  if(x0===0&&y0===0&&x1===M.w-1&&y1===M.h-1)return;
  resizeM(x0,y0,x1-x0+1,y1-y0+1);}
async function saveFigure(silent,opt){const F=S.fig;if(!F)return;opt=opt||{};
  if(F.M&&opt.trim){trimSilent();if(S.mode==='pix'){renderRight();redraw();}}
  const payload=workPayload();S.dirty=false;S.saving=true;renderSbInfo();
  try{const r=await api('/api/work/'+encodeURIComponent(F.id),payload);if(S.fig===F){F.work.saved_at=r.saved_at;F.work.done=F.done;if('rapport' in r)F.work.rapport=r.rapport;outLinks();}}
  catch(e){S.dirty=true;throw e;}finally{S.saving=false;renderSbInfo();}
  if(opt.refresh||!silent)await refreshFigures();if(!silent)stat('сохранено ✓','ok');}
async function renameFigure(nid){const F=S.fig;if(!nid||nid===F.id)return;if(!/^[\w\-]+$/.test(nid)){stat('id: только латиница, цифры, _ и -','err');return;}
  await saveFigure(true);await api('/api/rename/'+encodeURIComponent(F.id),{new_id:nid});F.id=nid;await refreshFigures();$('cur').textContent=nid;stat('переименовано','ok');}

/* ---- 5 · Очередь проверки: авто-результаты, ещё не принятые человеком, от надёжных к рискованным ---- */
const QSORT={risk_asc:['надёжные сначала',(a,b)=>qrisk(a)-qrisk(b)],risk_desc:['рискованные сначала',(a,b)=>qrisk(b)-qrisk(a)],id:['по номеру',(a,b)=>0]};
function qrisk(f){return f.risk!=null?f.risk:(1-(f.auto_conf??0));}
function qItems(){return S.figures.filter(f=>srcOk(f)&&f.auto&&f.size&&!f.done&&!f.photo&&TYPEF[S.qType||''](f)).sort((QSORT[S.qSort||'risk_asc']||QSORT.risk_asc)[1]);}
function renderQueue(){
  pvHide();
  const C=$('catalog');S.qSel=S.qSel||new Set();const thr=S.qThr??0.25;
  const all=S.figures.filter(f=>srcOk(f)&&f.auto&&f.size&&!f.done&&!f.photo),items=qItems(),sure=items.filter(f=>qrisk(f)<=thr);

    <span class="dfilter" data-tip="тип рисунка">${TYPEL.map(([k,l])=>`<button class="${(S.qType||'')===k?'on':''}" data-qt="${k}">${l} <small>${all.filter(TYPEF[k]).length}</small></button>`).join('')}</span>
    <select id="qSort" style="flex:none">${Object.entries(QSORT).map(([k,v])=>`<option value="${k}" ${(S.qSort||'risk_asc')===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>

  <div class="hint" style="margin-bottom:10px">Принять = «готово»: рисунок уйдёт из очереди и попадёт в пакет для сайта. Клик по картинке открывает рисунок для правки; галочка — для массового принятия.</div>
  <div class="cards q">${items.map(f=>{const r=qrisk(f),col=r<=thr?'var(--ok)':(r<0.55?'var(--warn,#e0a030)':'var(--bad)');
    return `<div class="card" data-id="${esc(f.id)}"><label class="qchk" data-tip="выбрать для массового принятия"><input type="checkbox" data-sel="${esc(f.id)}" ${S.qSel.has(f.id)?'checked':''}></label><div class="im"><img loading="lazy" src="/out/${encodeURIComponent(f.id)}_bg.png?t=${Math.round(f.t)}"></div>
    <div class="t"><span class="dot" style="display:inline-block;margin-right:5px;background:${col}"></span>${esc(dispName(f)||f.id)}</div>
    <div class="m">${esc(f.id)} · ${f.size[0]}×${f.size[1]}${f.colors?' · '+f.colors+' цв.':''} · риск ${r.toFixed(2)}${f.sym&&f.n_sus?` · <span style="color:#ff9f1c" data-tip="клеток нарушает симметрию (${esc(f.sym)})">◇${f.n_sus}</span>`:''}${f.border?' · кайма':''}${f.diff_est?' · '+({simple:'простой',medium:'средний',complex:'сложный',ultra:'ультра'}[f.diff_est]||f.diff_est):''}</div></div>`;}).join('')||'<div class="info">Очередь пуста — все авто-результаты проверены.</div>'}</div>`;
  bindViewSwitch(C);bindPreview(C);bindQueueKeys(C);$('qFast').onclick=()=>openReview();$('qHard').onclick=()=>openHard();

  C.querySelectorAll('[data-sel]').forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{cb.checked?S.qSel.add(cb.dataset.sel):S.qSel.delete(cb.dataset.sel);const b=$('qAccept');b.disabled=!S.qSel.size;b.textContent='✓ принять выбранные ('+S.qSel.size+')';$('qRev').disabled=!S.qSel.size;};});

/* ---- предпросмотр: на карточке результат; при наведении картинка меняется на оригинал (клавиша O — то же с клавиатуры) ---- */
function pvHide(){}
function cardSwap(c,orig){
  const im=c.querySelector('.im img');if(!im)return;const id=c.dataset.id,f=S.figures.find(v=>v.id===id);if(!f||!f.size)return;
  if(!im.dataset.r)im.dataset.r=im.getAttribute('src');
  if(orig){im.src='/api/orig_aligned/'+encodeURIComponent(id)+'?t='+Math.round(f.t||0);im.classList.add('orig');c.classList.add('showorig');}
  else{im.src=im.dataset.r;im.classList.remove('orig');c.classList.remove('showorig');}
}
function bindPreview(C){C.querySelectorAll('.card').forEach(el=>{
  const hold=()=>el.dataset.hold==='1';
  el.addEventListener('mouseenter',()=>cardSwap(el,true));el.addEventListener('mouseleave',()=>{if(!hold())cardSwap(el,false);});});}

/* ---- клавиатура в очереди: стрелки — по карточкам, пробел — отметить, A — принять, X — на доработку, Enter — открыть ---- */
function qCards(){return [...document.querySelectorAll('#catalog .card')];}
function qFocus(i,scroll){const cs=qCards();if(!cs.length)return;i=Math.max(0,Math.min(cs.length-1,i));cs.forEach(c=>{c.classList.remove('kf');if(c.dataset.hold==='1'){c.dataset.hold='0';cardSwap(c,false);}});const c=cs[i];c.classList.add('kf');S.qFocus=c.dataset.id;if(scroll!==false)c.scrollIntoView({block:'nearest'});}
function bindQueueKeys(C){const k=S.qFocus;if(k){const i=qCards().findIndex(c=>c.dataset.id===k);if(i>=0)qCards()[i].classList.add('kf');}}
async function qKey(e){
  if(S.mode!=='queue'||S.rv||S.hv||!$('modal').hidden)return false;
  const cs=qCards();if(!cs.length)return false;let i=cs.findIndex(c=>c.dataset.id===S.qFocus);const k=kk(e);
  const cols=(()=>{const t=cs[0].offsetTop;let n=0;for(const c of cs){if(c.offsetTop!==t)break;n++;}return Math.max(1,n);})();
  if(e.key==='ArrowRight'){qFocus(i<0?0:i+1);return true;}
  if(e.key==='ArrowLeft'){qFocus(i<0?0:i-1);return true;}
  if(e.key==='ArrowDown'){qFocus(i<0?0:i+cols);return true;}
  if(e.key==='ArrowUp'){qFocus(i<0?0:i-cols);return true;}
  if(i<0)return false;
  const id=cs[i].dataset.id;
  if(e.code==='Space'){const cb=cs[i].querySelector('[data-sel]');if(cb){cb.checked=!cb.checked;cb.onchange();}qFocus(i+1);return true;}
  if(k==='o'){const on=cs[i].dataset.hold!=='1';cs[i].dataset.hold=on?'1':'0';cardSwap(cs[i],on);return true;}
  if(k==='a'){try{await api('/api/accept',{ids:[id]});await refreshFigures();qFocus(i);stat('принят '+id,'ok');}catch(x){fail(x);}return true;}
  if(k==='x'){try{await api('/api/review_mark',{ids:[id],value:true});await refreshFigures();qFocus(i);stat('на доработку: '+id,'ok');}catch(x){fail(x);}return true;}
  if(e.key==='Enter'){openFigure(id).then(()=>setMode(S.fig.M?'pix':'grid')).catch(fail);return true;}
  return false;
}

/* ---- быстрая проверка: один рисунок на весь экран ---- */
function openReview(){
  const list=qItems();if(!list.length){stat('очередь пуста','ok');return;}

function rvAct(a){

    if(p&&p.a==='rev'){R.rev--;api('/api/review_mark',{ids:[p.id],value:false}).catch(fail);}rvRender();return;}

  if(a==='acc'){api('/api/accept',{ids:[id]}).catch(fail);R.acc++;const f=S.figures.find(v=>v.id===id);if(f)f.done=true;}

function rvKey(e){

  if(e.key==='ArrowLeft'||e.key==='Backspace'){rvAct('back');return true;}

function hvGeom(c){const t=c.d.tiles[c.k],W=c.M[0].length,Hh=c.M.length;
  return {t,x0:Math.max(0,t.x-HV_CTX),y0:Math.max(0,t.y-HV_CTX),x1:Math.min(W,t.x+t.w+HV_CTX),y1:Math.min(Hh,t.y+t.h+HV_CTX)};}
function hvCell(e,cv,inTile){const c=S.hv&&S.hv.cur;if(!c||!c.cs)return null;const g=hvGeom(c),r=cv.getBoundingClientRect(),sc=cv.width/r.width;
  const x=g.x0+Math.floor((e.clientX-r.left)*sc/c.cs),y=g.y0+Math.floor((e.clientY-r.top)*sc/c.cs);
  if(x<g.x0||x>=g.x1||y<g.y0||y>=g.y1)return null;
  if(inTile&&(x<g.t.x||x>=g.t.x+g.t.w||y<g.t.y||y>=g.t.y+g.t.h))return null;     // править можно только внутри куска — его и подтверждаете
  return [x,y];}
function hvSet(c,[x,y],v){const ch=v===0?'.':String(v);if(c.M[y][x]===ch)return;c.M[y][x]=ch;const k=x+','+y;

function hvDraw(){

    ctx.fillStyle='rgba(8,10,14,.45)';ctx.fillRect(0,0,nw*cs,ty);ctx.fillRect(0,ty+th,nw*cs,nh*cs-ty-th);ctx.fillRect(0,ty,tx,th);ctx.fillRect(tx+tw,ty,nw*cs-tx-tw,th);

    ctx.fillStyle='#2bd576';for(const k of c.edits.keys()){const [x,y]=k.split(',').map(Number);ctx.beginPath();ctx.arc((x-g.x0+1)*cs-5,(y-g.y0)*cs+5,3,0,7);ctx.fill();}

}
async function hvOk(){

    if(r.accepted){H.acc++;stat(c.id+' принят: все трудные места проверены','ok');H.busy=false;return hvNext();}
    c.k++;if(c.k>=c.d.tiles.length){H.busy=false;return hvNext();}

function hvKey(e){
  const H=S.hv;if(!H)return false;const k=kk(e),c=H.cur;
  if(e.key==='Escape'){hvClose();return true;}
  if(!c){if(e.key==='Enter')hvClose();return true;}
  if(c.weak){if(k==='f'){$('hvPh')&&$('hvPh').click();return true;}if(k==='s'){$('hvSc')&&$('hvSc').click();return true;}if(k==='d'){$('hvJk')&&$('hvJk').click();return true;}
    if(k==='e'){$('hvEdit')&&$('hvEdit').click();return true;}if(e.key==='ArrowRight'){$('hvSkip')&&$('hvSkip').click();}return true;}
  if(e.key==='ArrowRight'){$('hvSkip')&&$('hvSkip').click();return true;}
  if(k==='x'){$('hvRev')&&$('hvRev').click();return true;}
  if(k==='e'){$('hvEdit')&&$('hvEdit').click();return true;}
  if(c.d&&!c.d.too_many){

async function svMark(k){const V=S.sv;if(!V||V.busy)return;const id=V.list[V.i];V.busy=true;

/* Хоткеи привязаны к физической клавише (e.code), а не к символу: работают в любой раскладке (рус., азерб. и т.д.) */
function kk(e){const c=e.code||'';
  if(/^Key[A-Z]$/.test(c))return c.slice(3).toLowerCase();
  if(/^(Digit|Numpad)\d$/.test(c))return c.slice(-1);
  const m={BracketLeft:'[',BracketRight:']',Minus:'-',Equal:'=',Quote:"'",NumpadAdd:'+',NumpadSubtract:'-'};
  return m[c]||String(e.key||'').toLowerCase();}

  if(!typing&&S.rv){if(rvKey(e)){e.preventDefault();return;}}
  if(!typing&&S.hv){if(hvKey(e)){e.preventDefault();return;}}
  if(!typing&&S.sv){if(svKey(e)){e.preventDefault();return;}}
  if(!typing&&S.mode==='queue'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.key)||e.code==='Space'||['a','x','o'].includes(kk(e)))){qKey(e).then(ok=>{});if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)||e.code==='Space'||['a','x','o'].includes(kk(e))||e.key==='Enter')e.preventDefault();return;}
  if(e.code==='Space'&&!typing){e.preventDefault();if(ae&&ae!==document.body&&ae.blur)ae.blur();if(e.repeat)return;spaceDown=true;cv.style.cursor='grab';
    if(S.fig&&((S.mode==='pix'&&S.fig.M)||(S.mode==='grid'&&(S.gridView||'grid')==='grid'))){S.peek=true;$('peek').textContent='оригинал скана · пока держите пробел';$('peek').style.display='block';redraw();}return;}
  if((e.metaKey||e.ctrlKey)&&kk(e)==="'"){e.preventDefault();toggleGrid();return;}
  if((e.metaKey||e.ctrlKey)&&kk(e)==='s'){e.preventDefault();if(S.fig)saveFigure().catch(fail);return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&S.mode==='pix'&&S.fig&&S.fig.M&&$('modal').hidden){e.preventDefault();finishFigure('done');return;}
  if(e.key==='Escape'&&!$('modal').hidden){$('modal').hidden=true;$('modal').innerHTML='';$('modal').onclick=null;renderRight();if(R.on&&R.view==='edit')rugSide();return;}
  if(typing)return;
  if((e.metaKey||e.ctrlKey)&&kk(e)==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.metaKey||e.ctrlKey)&&kk(e)==='y'){e.preventDefault();redo();return;}
  const sheetSel=false;
  if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&['1','2'].includes(kk(e))&&S.mode!=='pix'&&S.mode!=='grid'&&!sheetSel){setMode(['sheet','queue'][+kk(e)-1]);return;}
  if(e.key==='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&(S.mode==='pix'||S.mode==='grid')){e.preventDefault();ovSwitch();return;}
  if((kk(e)==='['||kk(e)===']')&&S.fig&&(S.mode==='grid'||S.mode==='pix')){gotoFig(kk(e)===']'?1:-1).catch(fail);return;}
  if(kk(e)==='='||kk(e)==='+'){zoomAt(1.25,V.w/2,V.h/2);return;}
  if(kk(e)==='-'){zoomAt(0.8,V.w/2,V.h/2);return;}
  if(kk(e)==='0'&&S.mode!=='pix'&&!sheetSel){const h=H();h&&h.fit&&h.fit();return;}
  if(S.mode==='grid'&&kk(e)==='q'){S.gridView=S.gridView==='quad'?'grid':'quad';renderRight();H().fit();return;}
  const h=H();if(h&&h.key&&h.key(e)){e.preventDefault();return;}
  if(e.key==='Escape'&&(S.mode==='pix'||S.mode==='grid')){ovClose();return;}
});
