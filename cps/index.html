<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carpet Pattern Studio</title>
<style>
:root{--bg:#14161b;--pan:#1c1f26;--pan2:#232731;--ln:#2e3440;--tx:#dde1e8;--mut:#8b93a1;--acc:#ffb454;--ok:#7ec96b;--bad:#e06c75;--blue:#6cb6ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:230px 1fr 310px;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--pan);border-bottom:1px solid var(--ln)}
header b{color:var(--acc);margin-right:8px}
.sp{flex:1}
.btn{text-decoration:none;display:inline-block}
button,.btn{background:var(--pan2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--acc);color:#15171c;border-color:var(--acc)}
button.pri{border-color:var(--acc);color:var(--acc)}
button.sm{padding:2px 7px;font-size:12px}
.tabs button{border-radius:0;margin-left:-1px}
.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0}
aside{background:var(--pan);overflow:auto;padding:10px}
#left{border-right:1px solid var(--ln)}
#right{border-left:1px solid var(--ln)}
main{position:relative;overflow:hidden;background:#0c0e12}
main canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#vpbar{position:absolute;left:10px;bottom:10px;display:flex;gap:4px;align-items:center;background:rgba(20,22,27,.85);padding:4px 6px;border-radius:8px;border:1px solid var(--ln)}
#vpbar span{color:var(--mut);font-size:12px;min-width:44px;text-align:center}
#hud{position:absolute;right:10px;bottom:10px;background:rgba(20,22,27,.85);padding:4px 8px;border-radius:8px;border:1px solid var(--ln);color:var(--mut);font:12px ui-monospace,Menlo,monospace}
.item{padding:5px 7px;border-radius:6px;cursor:pointer;display:flex;gap:7px;align-items:center;line-height:1.25}
.item:hover{background:var(--pan2)}
.item.sel{background:#2a3140;outline:1px solid var(--acc)}
.item small{color:var(--mut);display:block;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
.dot.mid{background:var(--blue)}.dot.done{background:var(--ok)}
h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
h4:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
.row>label{width:92px;color:var(--mut);font-size:12px;flex:none}
.row input[type=range]{flex:1;min-width:60px}
input[type=number],input[type=text],select,textarea{background:var(--pan2);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:4px 6px;font:inherit}
input[type=number]{width:70px}
input[type=text]{flex:1;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
.hint{color:var(--mut);font-size:11.5px;line-height:1.5;margin:6px 0}
.hint kbd{word-break:break-all;background:var(--pan2);border:1px solid var(--ln);border-radius:3px;padding:0 4px;font:11px ui-monospace,Menlo,monospace;color:var(--tx)}
.hintbox{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--mut);font-size:10.5px;font-weight:700;cursor:help;position:relative;vertical-align:middle;flex:none;line-height:1}
.hintbox:hover{background:rgba(255,255,255,.16);color:var(--tx)}
.hintbox .htxt{display:none;position:absolute;left:0;top:20px;z-index:60;width:260px;max-width:70vw;background:var(--pan2);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;font-size:11.5px;font-weight:400;line-height:1.5;color:var(--tx);white-space:normal;box-shadow:0 10px 28px rgba(0,0,0,.45);text-align:left}
.hintbox:hover .htxt{display:block}
.hintbox .htxt kbd{word-break:break-all;background:var(--pan1,var(--bg));border:1px solid var(--ln);border-radius:3px;padding:0 4px;font:11px ui-monospace,Menlo,monospace;color:var(--tx)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
.pal{display:flex;flex-direction:column;gap:4px}
.pal .pr{display:flex;gap:5px;align-items:center;padding:2px;border-radius:6px;border:1px solid transparent}
.pal .pr.on{border-color:var(--acc);background:var(--pan2)}
.pal .pr .k{width:16px;color:var(--mut);font-size:11px;text-align:right}
.pal .pr .sw{width:26px;height:22px;border-radius:4px;border:1px solid #0006;cursor:pointer;flex:none}
.pal input[type=color]{width:28px;height:24px;padding:0;border:none;background:none}
.boxlist .bx{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:5px}
.boxlist .bx.sel{background:#2a3140}
.boxlist input{width:52px}
#stat{font-size:12px;color:var(--mut)}#stat.err{color:var(--bad)}#stat.ok{color:var(--ok)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#catalog{position:absolute;inset:0;overflow:auto;padding:14px;display:none;background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:8px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card .im{height:130px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:4px;overflow:hidden}
.card img{max-width:100%;max-height:100%;image-rendering:pixelated}
.card .t{margin-top:6px;font-weight:600}.card .m{color:var(--mut);font-size:11.5px}
.suggest{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline}
.flex{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
hr{border:none;border-top:1px solid var(--ln);margin:10px 0}
.hist{width:100%;height:60px;background:#0c0e12;border:1px solid var(--ln);border-radius:5px;display:block}
/* v4: без левой панели на экранах 2–4 */
body.noleft{grid-template-columns:0 1fr 310px}
body.noleft #left{display:none}
main{grid-column:2;grid-row:2;min-width:0}#right{grid-column:3;grid-row:2}#left{grid-column:1;grid-row:2}
#nav{display:flex;gap:4px;align-items:center;margin-left:10px}
#nav select{max-width:260px}
#nav .pos{color:var(--mut);font-size:12px;min-width:44px;text-align:center}
/* иконки с подсказками */
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;padding:0}
.ib svg{width:17px;height:17px;display:block}
.ib.on svg{color:#15171c}
.ibar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ibar .gap{width:5px}
#tip{position:fixed;z-index:200;pointer-events:none;background:#2b303b;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45);display:none}
#tip kbd{font:11px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--ln);border-radius:3px;padding:0 4px;margin-left:6px;color:var(--mut)}
/* сложность */
.dseg{display:inline-flex;gap:2px}
.dseg button{width:20px;height:20px;padding:0;border-radius:4px;font-size:11px;font-weight:700;color:var(--mut);background:var(--pan2)}
.dseg button.on{color:#15171c;border-color:transparent}
.dchip{display:inline-block;min-width:16px;padding:0 4px;border-radius:4px;font-size:10.5px;font-weight:700;color:#15171c;text-align:center;line-height:15px}
.dsum{display:inline-flex;gap:3px;margin-left:4px;vertical-align:1px}
.dsum i{font-style:normal;font-size:10px;font-weight:700;color:#15171c;border-radius:3px;padding:0 3px;line-height:13px}
/* схема краёв матрицы */
.edges{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 64px auto;gap:4px;align-items:center;justify-items:center;width:230px;margin:6px 0}
.edges .ec{width:100%;height:100%;border:2px dashed var(--acc);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx);font:12px ui-monospace,Menlo,monospace}
.edges .ec small{color:var(--mut);font:10.5px system-ui}
.edges .eg{display:flex;gap:2px}
.edges .eg.v{flex-direction:column}
.edges button{width:24px;height:22px;padding:0;font-size:11px;line-height:1}
.edges button.add{color:var(--ok)}.edges button.del{color:var(--bad)}
input.draft{border-style:dashed;border-color:var(--acc)}
.azsub{color:var(--mut);font-size:11px;margin:-2px 0 4px 98px}
.azsub .suggest{font-size:11px}
.peek{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,180,84,.92);color:#15171c;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;display:none;pointer-events:none}
.card .t small{color:var(--mut);font-weight:400;margin-left:4px}
.dfilter{display:inline-flex;gap:3px}
.dfilter button{padding:2px 7px;font-size:11.5px}
/* вертикальная колонка инструментов слева от холста (экран «Пиксели») */
#toolcol{position:absolute;top:10px;left:10px;z-index:5;display:none;flex-direction:column;gap:3px;background:rgba(20,22,27,.9);padding:5px;border-radius:8px;border:1px solid var(--ln)}
#toolcol .ib{width:32px;height:30px}
#toolcol hr{width:100%;margin:2px 0;border-color:var(--ln)}
/* палитра — компактные квадраты как в Photoshop */
.palgrid{display:flex;flex-wrap:wrap;gap:5px}
.palgrid .sq{position:relative;width:26px;height:26px;border-radius:5px;border:2px solid transparent;cursor:pointer}
.palgrid .sq.on{border-color:var(--acc)}
.palgrid .sq .k{position:absolute;left:2px;top:0;font-size:9px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none}
.palgrid .sq input[type=color]{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;padding:0;border:1px solid #0008;border-radius:3px;cursor:pointer;background:none}
.palgrid .sq .del{position:absolute;left:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--bad);color:#fff;font-size:9px;line-height:14px;text-align:center;display:none;cursor:pointer}
.palgrid .sq:hover .del{display:block}
.dchip.rev{background:var(--bad)}
.srcbar{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.srcbar button{padding:2px 7px;font-size:11.5px}
</style></head><body>

<header>
  <b>🧶 Carpet Pattern Studio</b>
  <div class="tabs">
    <button id="tab-sheet" class="on">1 · Листы</button><button id="tab-grid">2 · Геометрия и сетка</button><button id="tab-pix">3 · Пиксели</button><button id="tab-cat">4 · Каталог</button>
  </div>
  <div id="nav"></div>
  <span class="sp"></span>
  <span id="cur" style="color:var(--mut)"></span>
  <span id="stat"></span>
</header>

<aside id="left"></aside>
<main>
  <canvas id="cv"></canvas>
  <div id="toolcol"></div>
  <div id="vpbar"><button class="sm" id="zOut">−</button><span id="zLbl">100%</span><button class="sm" id="zIn">+</button><button class="sm" id="zFit">вписать</button></div>
  <div id="hud"></div>
  <div class="peek" id="peek">подложка скана · пробел</div>
  <div id="catalog"></div>
</main>
<aside id="right"></aside>
<div id="tip"></div>

<script>
"use strict";
/* ============================ утилиты ============================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HT=html=>'<span class="hintbox">?<span class="htxt">'+html+'</span></span>';
async function api(path,body,method){
  const opt=body===undefined&&!method?{}:{method:method||'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)};
  const r=await fetch(path,opt);
  if(!r.ok){const t=await r.text();throw new Error(path+' → '+r.status+' '+t.slice(0,200));}
  return r.json();
}
function stat(t,kind){const e=$('stat');e.className=kind||'';e.innerHTML=kind==='busy'?'<span class="spin"></span>'+esc(t):esc(t);if(kind==='ok')setTimeout(()=>{if(e.textContent===t)e.textContent='';},t.length>60?9000:3500);}
function fail(e){console.error(e);stat('⚠ '+(e.message||e),'err');}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('не загрузилась картинка '+src));i.src=src;});}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}

/* всплывающие подсказки: любой элемент с data-tip (и data-key — клавиша) */
(()=>{const tip=document.getElementById('tip');let cur=null;
  document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el===cur)return;cur=el;
    if(!el){tip.style.display='none';return;}
    tip.innerHTML=esc(el.dataset.tip)+(el.dataset.key?'<kbd>'+esc(el.dataset.key)+'</kbd>':'');tip.style.display='block';
    const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    let x=r.left+r.width/2-tw/2,y=r.bottom+6;if(y+th>innerHeight-4)y=r.top-th-6;
    tip.style.left=clamp(x,4,innerWidth-tw-4)+'px';tip.style.top=y+'px';});
  document.addEventListener('mousedown',()=>{tip.style.display='none';cur=null;});})();
const SV=(d,extra)=>`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra||''}>${d}</svg>`;
const ICON={
  pen:SV('<path d="M13.5 3.5l3 3L7 16H4v-3z"/><path d="M11.5 5.5l3 3"/>'),
  eraser:SV('<path d="M8 16h9"/><path d="M3.6 11.6l7-7a1.5 1.5 0 0 1 2.1 0l3.7 3.7a1.5 1.5 0 0 1 0 2.1L11 16H7.4l-3.8-3.8a.8.8 0 0 1 0-.6z"/><path d="M7 8l5 5"/>'),
  fill:SV('<path d="M4 9l5-5 7 7-5 5a1.4 1.4 0 0 1-2 0L4 11a1.4 1.4 0 0 1 0-2z"/><path d="M4 10h12"/><path d="M17 13.5s1.5 1.8 1.5 2.8a1.5 1.5 0 0 1-3 0c0-1 1.5-2.8 1.5-2.8z" fill="currentColor"/>'),
  pick:SV('<path d="M12.5 3.5a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L14 10l-4-4z"/><path d="M11 7l-7 7v2h2l7-7"/>'),
  line:SV('<path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="4" r="1.3" fill="currentColor"/>'),
  rect:SV('<rect x="4" y="5" width="12" height="10" rx="1"/>'),
  rectf:SV('<rect x="4" y="5" width="12" height="10" rx="1" fill="currentColor"/>'),
  undo:SV('<path d="M7 5L3.5 8.5 7 12"/><path d="M4 8.5h8a4 4 0 0 1 0 8H9"/>'),
  redo:SV('<path d="M13 5l3.5 3.5L13 12"/><path d="M16 8.5H8a4 4 0 0 0 0 8h3"/>'),
  symX:SV('<path d="M10 2.5v15" stroke-dasharray="2 2"/><path d="M8 6L3.5 10 8 14z"/><path d="M12 6l4.5 4-4.5 4z" fill="currentColor"/>'),
  symY:SV('<path d="M2.5 10h15" stroke-dasharray="2 2"/><path d="M6 8l4-4.5L14 8z"/><path d="M6 12l4 4.5 4-4.5z" fill="currentColor"/>'),
  rot:SV('<circle cx="10" cy="10" r="1.3" fill="currentColor"/><path d="M4.5 7.5A6 6 0 0 1 15 6"/><path d="M15.5 12.5A6 6 0 0 1 5 14"/><path d="M15 3v3h-3"/><path d="M5 17v-3h3"/>'),
  under:SV('<path d="M2.5 10s2.8-5 7.5-5 7.5 5 7.5 5-2.8 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.3"/>'),
  trim:SV('<circle cx="5.5" cy="5.5" r="2"/><circle cx="5.5" cy="14.5" r="2"/><path d="M7 7l10 8"/><path d="M7 13l10-8"/>'),
  flipH:SV('<path d="M10 3v14"/><path d="M7.5 5.5L3 10l4.5 4.5z"/><path d="M12.5 5.5L17 10l-4.5 4.5z"/>'),
  flipV:SV('<path d="M3 10h14"/><path d="M5.5 7.5L10 3l4.5 4.5z"/><path d="M5.5 12.5L10 17l4.5-4.5z"/>'),
  clear:SV('<path d="M4 6h12"/><path d="M8 6V4h4v2"/><path d="M5.5 6l.8 10.5h7.4L14.5 6"/>'),
  save:SV('<path d="M4 4h9.5L16 6.5V16H4z"/><path d="M7 4v4h6V4"/><rect x="7" y="11" width="6" height="5"/>'),
  copy:SV('<rect x="3" y="7" width="8" height="10" rx="1"/><path d="M7 7V4.5a1 1 0 0 1 1-1H16a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H14.5"/>'),
  paste:SV('<rect x="4" y="4" width="12" height="13" rx="1"/><path d="M7.5 4V3h5v1"/><path d="M6.5 9h7M6.5 12h7M6.5 15h4"/>'),
};
const IB=(ic,tip,key,attrs,on)=>`<button class="ib ${on?'on':''}" data-tip="${esc(tip)}" ${key?`data-key="${esc(key)}"`:''} ${attrs||''}>${ICON[ic]}</button>`;
/* сложность узора — выставляется при первичном просмотре листа */
const DIFF=[{k:'simple',l:'простой',c:'#7ec96b'},{k:'medium',l:'средний',c:'#6cb6ff'},{k:'complex',l:'сложный',c:'#ffb454'},{k:'ultra',l:'ультра‑сложный',c:'#e06c75'}];
const DIFFI=k=>DIFF.findIndex(d=>d.k===k);
const dchip=k=>{const i=DIFFI(k);return i<0?'':`<span class="dchip" style="background:${DIFF[i].c}" data-tip="${DIFF[i].l}">${i+1}</span>`;};
const dseg=(cur,attr)=>'<span class="dseg">'+DIFF.map((d,i)=>`<button class="${cur===d.k?'on':''}" style="${cur===d.k?'background:'+d.c:''}" data-tip="${d.l}" data-key="${i+1}" ${attr}="${d.k}">${i+1}</button>`).join('')+'</span>';
const dispName=f=>f.name_az||f.name||'';

/* ============================ состояние ============================ */
const S={
  mode:'sheet',
  sheets:[],figures:[],siteIndex:[],legend:[],
  sheet:null,            // {path,img,table,boxes:[],sel}
  fig:null,              // рабочие данные рисунка (см. loadFigure)
  dirty:false,
  catQ:'',
};

/* ============================ вьюпорт (зум/пан) ============================ */
const cv=$('cv'),ctx=cv.getContext('2d');
const V={s:1,tx:0,ty:0,dpr:1,w:0,h:0};
let spaceDown=false,panning=null;
function resize(){const r=cv.getBoundingClientRect();V.dpr=window.devicePixelRatio||1;V.w=r.width;V.h=r.height;cv.width=Math.round(r.width*V.dpr);cv.height=Math.round(r.height*V.dpr);redraw();}
function toWorld(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-V.tx)/V.s,y:(ev.clientY-r.top-V.ty)/V.s};}
function fitTo(w,h,pad){pad=pad??30;const s=Math.min((V.w-pad*2)/w,(V.h-pad*2)/h);V.s=s>0?s:1;V.tx=(V.w-w*V.s)/2;V.ty=(V.h-h*V.s)/2;redraw();}
function zoomAt(f,cx,cy){const ns=clamp(V.s*f,0.05,200);f=ns/V.s;V.tx=cx-(cx-V.tx)*f;V.ty=cy-(cy-V.ty)*f;V.s=ns;redraw();}
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();const r=cv.getBoundingClientRect();const cx=ev.clientX-r.left,cy=ev.clientY-r.top;
  const mouseWheel=ev.deltaMode===1||(ev.deltaX===0&&Math.abs(ev.deltaY)>=50&&Number.isInteger(ev.deltaY));
  if(ev.ctrlKey||ev.metaKey||mouseWheel){zoomAt(Math.exp(-ev.deltaY*(ev.ctrlKey?0.01:0.0015)),cx,cy);}
  else{V.tx-=ev.deltaX;V.ty-=ev.deltaY;redraw();}
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);
  if(ev.button===1||(ev.button===0&&spaceDown)){panning={x:ev.clientX,y:ev.clientY,tx:V.tx,ty:V.ty};cv.style.cursor='grabbing';return;}

/* ⚡ авто: сетка + пиксели для всех рисунков листа (черновик — потом «✓ Готово → след.») */

/* ============================ ГЕОМЕТРИЯ: гомография и выпрямление ============================ */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[m][i]))m=k;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
  for(let k=i+1;k<n;k++){const f=A[k][i]/A[i][i];for(let j=i;j<n;j++)A[k][j]-=f*A[i][j];b[k]-=f*b[i];}}
  const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i];}return x;}
function homography(dst,src){ // отображение dst(u,v) → src(x,y)
  const A=[],b=[];for(let i=0;i<4;i++){const[u,v]=dst[i],[x,y]=src[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]);b.push(x);A.push([0,0,0,u,v,1,-u*y,-v*y]);b.push(y);}
  return solve(A,b);}
function quadSize(q){const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);return[Math.max(1,Math.round(Math.max(d(q[0],q[1]),d(q[3],q[2])))),Math.max(1,Math.round(Math.max(d(q[0],q[3]),d(q[1],q[2]))))];}
function warp(F){ // F.src {w,h,gray}, F.quad → F.wg (Float32 gray W×H)
  const [W,Hh]=quadSize(F.quad);const h=homography([[0,0],[W,0],[W,Hh],[0,Hh]],F.quad);
  const sw=F.src.w,sh=F.src.h,sg=F.src.gray,out=new Float32Array(W*Hh);
  for(let v=0;v<Hh;v++){const vv=v+0.5;for(let u=0;u<W;u++){const uu=u+0.5;const d=h[6]*uu+h[7]*vv+1;
    let x=(h[0]*uu+h[1]*vv+h[2])/d-0.5,y=(h[3]*uu+h[4]*vv+h[5])/d-0.5;
    if(x<0)x=0;if(y<0)y=0;if(x>sw-1.001)x=sw-1.001;if(y>sh-1.001)y=sh-1.001;
    const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=y0*sw+x0;
    out[v*W+u]=(sg[i]*(1-fx)+sg[i+1]*fx)*(1-fy)+(sg[i+sw]*(1-fx)+sg[i+sw+1]*fx)*fy;}}
  F.W=W;F.H=Hh;F.wg=out;}
function adjust(F){ // яркость/контраст/гамма → F.ag и картинка F.wcan
  const a=F.adj,n=F.W*F.H,ag=new Float32Array(n),c=a.contrast,b=a.brightness/100,g=a.gamma,inv=a.invert;
  const lut=new Float32Array(256);for(let i=0;i<256;i++){let v=(i/255-0.5)*c+0.5+b;v=clamp(v,0,1);v=Math.pow(v,g);if(inv)v=1-v;lut[i]=v*255;}
  for(let i=0;i<n;i++){const s=F.wg[i];const i0=s|0;ag[i]=i0>=255?lut[255]:lut[i0]+(lut[i0+1]-lut[i0])*(s-i0);}
  F.ag=ag;
  const can=F.wcan||(F.wcan=document.createElement('canvas'));can.width=F.W;can.height=F.H;
  const x=can.getContext('2d'),im=x.createImageData(F.W,F.H),d=im.data;
  for(let i=0;i<n;i++){const v=ag[i];d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}
  x.putImageData(im,0,0);
  F._rawKey=null;} // помечаем: превью на исходном скане (F.rawcan) надо пересчитать лениво, см. buildRawAdjPreview()
function buildRawAdjPreview(F){ // тот же LUT — на исходный (невыпрямленный) скан, только когда реально нужен (вкладка «① углы на скане»)
  const a=F.adj,key=a.contrast+'|'+a.brightness+'|'+a.gamma+'|'+a.invert;
  if(F._rawKey===key&&F.rawcan)return F.rawcan;
  try{
    const c=a.contrast,b=a.brightness/100,g=a.gamma,inv=a.invert;
    const lut=new Float32Array(256);for(let i=0;i<256;i++){let v=(i/255-0.5)*c+0.5+b;v=clamp(v,0,1);v=Math.pow(v,g);if(inv)v=1-v;lut[i]=v*255;}
    const g0=F.src.gray,n0=g0.length,rc=F.rawcan||(F.rawcan=document.createElement('canvas'));
    rc.width=F.src.w;rc.height=F.src.h;
    const x0=rc.getContext('2d'),im0=x0.createImageData(F.src.w,F.src.h),d0=im0.data;
    for(let i=0;i<n0;i++){const s=g0[i];const i0=s|0;const v=i0>=255?lut[255]:lut[i0]+(lut[i0+1]-lut[i0])*(s-i0);d0[i*4]=d0[i*4+1]=d0[i*4+2]=v;d0[i*4+3]=255;}
    x0.putImageData(im0,0,0);
    F._rawKey=key;
  }catch(err){F.rawcan=null;} // при любой ошибке — просто покажем исходный скан без коррекции, не ломая остальное
  return F.rawcan;}
let rewarpT=0;
function rewarp(full){const F=S.fig;if(!F)return;if(full!==false)warp(F);adjust(F);F.samples=null;redraw();}
function rewarpSoon(){if(rewarpT)return;rewarpT=requestAnimationFrame(()=>{rewarpT=0;rewarp();});}

/* ============================ автосетка ============================ */
function boxBlur1D(a,n,stride,count,r){ // по месту, многократно
  const tmp=new Float32Array(n);
  for(let c=0;c<count;c++){const off=c*(stride===1?n:1);
    let acc=0;const get=i=>a[off+clamp(i,0,n-1)*stride];
    for(let i=-r;i<=r;i++)acc+=get(i);
    for(let i=0;i<n;i++){tmp[i]=acc/(2*r+1);acc+=get(i+r+1)-get(i-r);}
    for(let i=0;i<n;i++)a[off+i*stride]=tmp[i];}}
function gridProfiles(F){
  const W=F.W,Hh=F.H,g=F.wg,bl=Float32Array.from(g);
  for(let k=0;k<2;k++){boxBlur1D(bl,W,1,Hh,3);boxBlur1D(bl,Hh,W,W,3);}
  const hp=new Float32Array(W*Hh);for(let i=0;i<hp.length;i++)hp[i]=bl[i]-g[i]; // тонкие тёмные линии > 0
  const med=(arr)=>{arr.sort();return arr[arr.length>>1];};
  const px=new Float32Array(W),py=new Float32Array(Hh);
  const col=new Float32Array(Hh);for(let x=0;x<W;x++){for(let y=0;y<Hh;y++)col[y]=hp[y*W+x];px[x]=med(col);}
  const row=new Float32Array(W);for(let y=0;y<Hh;y++){for(let x=0;x<W;x++)row[x]=hp[y*W+x];py[y]=med(row);}
  return[px,py];}
function combScore(pr,p){let re=0,im=0;const n=pr.length,w=2*Math.PI/p;for(let i=0;i<n;i++){re+=pr[i]*Math.cos(w*i);im-=pr[i]*Math.sin(w*i);}
  return{s:Math.hypot(re,im)/n,ph:((-Math.atan2(im,re)/(2*Math.PI))*p%p+p)%p};}
function acPeriod(pr){ // первый значимый пик автокорреляции = основной шаг (гармоники не мешают)
  const n=pr.length;let mean=0;for(const v of pr)mean+=v;mean/=n;const z=pr.map(v=>v-mean);
  const L=Math.floor(Math.min(90,n/2.5));const ac=new Float32Array(L+2);
  for(let l=0;l<=L+1;l++){let s=0;for(let i=0;i+l<n;i++)s+=z[i]*z[i+l];ac[l]=s/(n-l);}
  const peaks=[];for(let l=3;l<=L;l++)if(ac[l]>ac[l-1]&&ac[l]>=ac[l+1]&&ac[l]>0)peaks.push(l);
  if(!peaks.length)return{z,p:8,ok:false};
  const mx=Math.max(...peaks.map(l=>ac[l]));const l=peaks.find(l=>ac[l]>=0.45*mx);
  const a=ac[l-1],b=ac[l],c=ac[l+1],d=a-2*b+c;const off=d?0.5*(a-c)/d:0;
  return{z,p:l+clamp(off,-0.5,0.5),ok:true};}
function refine(z,p){let best={s:-1,p,ph:0};for(let q=p*0.94;q<=p*1.06;q+=0.005){const r=combScore(z,q);if(r.s>best.s)best={s:r.s,p:q,ph:r.ph};}return best;}
function jointRefine(zx,zy,p){let best={s:-1,p};for(let q=p*0.94;q<=p*1.06;q+=0.005){const s=combScore(zx,q).s+combScore(zy,q).s;if(s>best.s)best={s,p:q};}
  return{p:best.p,phx:combScore(zx,best.p).ph,phy:combScore(zy,best.p).ph};}
function estimateGrid(F){
  const[prx,pry]=gridProfiles(F);const ax=acPeriod(prx),ay=acPeriod(pry);let pw,ph,ox,oy;
  const close=Math.abs(ax.p-ay.p)/((ax.p+ay.p)/2)<0.15;
  if(F.grid.square){
    // для квадратных клеток берём общий шаг; если оси не согласны — тот, что меньше (второй обычно кратный)
    let p0=close?(ax.p+ay.p)/2:Math.min(ax.p,ay.p);
    const r=jointRefine(ax.z,ay.z,p0);pw=ph=r.p;ox=r.phx;oy=r.phy;
  }else{const rx=refine(ax.z,ax.p),ry=refine(ay.z,ay.p);pw=rx.p;ph=ry.p;ox=rx.ph;oy=ry.ph;}
  const G=F.grid;G.pw=+pw.toFixed(3);G.ph=+ph.toFixed(3);G.ox=+(ox%G.pw).toFixed(2);G.oy=+(oy%G.ph).toFixed(2);
  G.cols=Math.max(1,Math.floor((F.W-G.ox)/G.pw+0.02));G.rows=Math.max(1,Math.floor((F.H-G.oy)/G.ph+0.02));}
function autoGrid(){
  const F=S.fig;if(!F)return;stat('ищу шаг сетки…','busy');
  setTimeout(()=>{try{estimateGrid(F);const G=F.grid;F.samples=null;markDirty();renderRight();redraw();
    stat('шаг '+G.pw.toFixed(2)+'×'+G.ph.toFixed(2)+' px, клеток '+G.cols+'×'+G.rows,'ok');}catch(e){fail(e);}},20);}

/* ============================ выборка клеток и тоны ============================ */
function sampleCells(F){
  const G=F.grid,W=F.W,ag=F.ag,inner=F.cls.inner/100,out=new Float32Array(G.cols*G.rows);
  for(let j=0;j<G.rows;j++)for(let i=0;i<G.cols;i++){
    const cx=G.ox+(i+0.5)*G.pw,cy=G.oy+(j+0.5)*G.ph,hw=Math.max(0.5,G.pw*inner/2),hh=Math.max(0.5,G.ph*inner/2);
    let x0=Math.floor(cx-hw),x1=Math.ceil(cx+hw),y0=Math.floor(cy-hh),y1=Math.ceil(cy+hh);
    x0=clamp(x0,0,W-1);x1=clamp(x1,x0+1,W);y0=clamp(y0,0,F.H-1);y1=clamp(y1,y0+1,F.H);
    let s=0,n=0;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){s+=ag[y*W+x];n++;}
    out[j*G.cols+i]=n?s/n:255;}
  F.samples=out;return out;}
function toneCenters(v,K,auto){ // центры тонов; при auto слабые «тоны» (шум бумаги) сливаются с фоном
  let c=kmeans1d(v,K);if(auto){while(c.length>2&&c[0]-c[1]<35)c=kmeans1d(v,c.length-1);}return c;}
function kmeans1d(vals,K){
  const s=Float32Array.from(vals).sort();let c=[];for(let k=0;k<K;k++)c.push(s[Math.min(s.length-1,Math.floor((k+0.5)/K*s.length))]);
  for(let it=0;it<30;it++){const sum=new Float64Array(K),cnt=new Float64Array(K);
    for(const v of vals){let b=0,bd=1e9;for(let k=0;k<K;k++){const d=Math.abs(v-c[k]);if(d<bd){bd=d;b=k;}}sum[b]+=v;cnt[b]++;}
    for(let k=0;k<K;k++)if(cnt[k])c[k]=sum[k]/cnt[k];}
  return c.sort((a,b)=>b-a);} // от светлого к тёмному
function autoTones(){
  const F=S.fig;const v=F.samples||sampleCells(F);const K=F.cls.tones+1;
  const c=toneCenters(v,K,false);F.cls.thr=[];for(let k=0;k<K-1;k++)F.cls.thr.push(Math.round((c[k]+c[k+1])/2));
  F.cls.centers=c.map(Math.round);
  // палитра по умолчанию — серые уровни найденных тонов (если палитра ещё не настроена руками)
  fitPalette(F,c);
  markDirty();renderRight();redraw();}
function classify(F){const v=F.samples||sampleCells(F),t=F.cls.thr,out=new Uint8Array(v.length);
  for(let i=0;i<v.length;i++){let k=0;for(let j=0;j<t.length;j++)if(v[i]<t[j])k=j+1;out[i]=k;}return out;}

/* ============================ открытие рисунка ============================ */
async function openFigure(id){
  if(S.fig&&S.dirty&&S.fig.id!==id){await saveFigure(true).catch(fail);}
  stat('открываю '+id+'…','busy');
  const [w,img]=await Promise.all([api('/api/work/'+encodeURIComponent(id)),loadImg('/api/crop/'+encodeURIComponent(id)+'?t='+Date.now())]);
  const can=document.createElement('canvas');can.width=img.width;can.height=img.height;const x=can.getContext('2d');x.drawImage(img,0,0);

const FIXED_PALETTE=['#ffffff','#1a1a1a','#8a8a8a','#c9c9c9','#4f7cd1','#d98f2e','#4caf6b','#c74f66','#8e5fd1','#2fb3b3'];

MODES.quad={
  fit(){const F=S.fig;if(F)fitTo(F.src.w,F.src.h);},
  draw(c){const F=S.fig;if(!F)return;c.drawImage(buildRawAdjPreview(F)||F.img,0,0);const q=F.quad;
    c.beginPath();q.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.lineWidth=2*px1();c.strokeStyle='#ffb454';c.stroke();
    // предпросмотр сетки внутри квадра (через гомографию)
    const G=F.grid,h=homography([[0,0],[F.W,0],[F.W,F.H],[0,F.H]],q);const P=(u,v)=>{const d=h[6]*u+h[7]*v+1;return[(h[0]*u+h[1]*v+h[2])/d,(h[3]*u+h[4]*v+h[5])/d];};
    c.lineWidth=px1();c.strokeStyle='rgba(108,182,255,.55)';c.beginPath();
    for(let i=0;i<=G.cols;i+=1){const u=G.ox+i*G.pw;const a=P(u,G.oy),b=P(u,G.oy+G.rows*G.ph);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}
    for(let j=0;j<=G.rows;j+=1){const v=G.oy+j*G.ph;const a=P(G.ox,v),b=P(G.ox+G.cols*G.pw,v);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}
    if(V.s*G.pw>3)c.stroke();
    ['1','2','3','4'].forEach((n,i)=>{handle(q[i][0],q[i][1],7,i===this.sel?'#ffb454':'#fff');c.fillStyle='#000';c.font=`bold ${10*px1()}px system-ui`;c.fillText(n,q[i][0]-3*px1(),q[i][1]+3.5*px1());});
  },
  down(w,ev){const F=S.fig;const i=F.quad.findIndex(p=>near({x:p[0],y:p[1]},w,10));
    if(i>=0){this.sel=i;this.drag={i};}else if(inPoly(w,F.quad)){this.drag={all:true,x:w.x,y:w.y,q:F.quad.map(p=>[...p])};}
    redraw();},
  move(w){const d=this.drag,F=S.fig;if(!d)return;
    if(d.all){F.quad=d.q.map(p=>[p[0]+w.x-d.x,p[1]+w.y-d.y]);}else F.quad[d.i]=[w.x,w.y];
    markDirty();F.quadMoved=true;redraw();},
  up(){if(this.drag){this.drag=null;rewarp();renderRight();}},
  hud(w){const F=S.fig;return F?Math.round(w.x)+', '+Math.round(w.y)+(this.sel!=null?'  угол '+(this.sel+1):''):'';},
  key(e){const F=S.fig;if(this.sel==null)return false;const st=e.shiftKey?5:0.5;
    const mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];

function inPoly(p,q){let c=false;for(let i=0,j=3;i<4;j=i++){const a=q[i],b=q[j];if(((a[1]>p.y)!==(b[1]>p.y))&&(p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function rotateQuad(F,deg){

MODES.grid={

    c.lineWidth=2*px1();c.strokeStyle='#ffb454';c.strokeRect(G.ox,G.oy,x1-G.ox,y1-G.oy);
    if(F.showInner&&V.s*G.pw>8){c.strokeStyle='rgba(126,201,107,.7)';c.lineWidth=px1();const inn=F.cls.inner/100;
      for(let j=0;j<G.rows;j++)for(let i=0;i<G.cols;i++){c.strokeRect(G.ox+(i+0.5-inn/2)*G.pw,G.oy+(j+0.5-inn/2)*G.ph,G.pw*inn,G.ph*inn);}}

  b.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{const i=+inp.dataset.i;C.thr[i]=+inp.value;inp.nextElementSibling.textContent=inp.value;markDirty();drawHist();redraw();});}

async function autoFigure(){
  const F=S.fig;if(!F)return;
  if(F.M&&F.M.edited&&!confirm('Заменить вручную исправленные пиксели автоматическим результатом?'))return;

  const r=await api('/api/auto/'+encodeURIComponent(F.id),{force:true,fill:!!S.autoFill});

}

function matOp(op){const F=S.fig,M=F.M;if(!M)return;pushUndo();

    if(x1<0){stat('матрица пустая','err');return;}const m=F.trimMargin|0;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(M.w-1,x1+m);y1=Math.min(M.h-1,y1+m);

function outLinks(){const F=S.fig,e=$('outLinks');if(!e)return;const t=Date.now();

function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[ә]/g,'э').replace(/[^a-zа-яəğıöüşç0-9]+/g,' ').trim();}
let suggT=0,suggSeq=0;
function suggestSiteSoon(){clearTimeout(suggT);suggT=setTimeout(suggestSite,250);}
async function suggestSite(){const F=S.fig,e=$('sugg');if(!e||!F)return;const m=F.meta;
  const names=[m.name_az,m.name].filter(Boolean);if(!names.length&&!m.translation){e.innerHTML='';return;}
  const seq=++suggSeq;let hits=[];
  try{hits=await api('/api/site_suggest',{names,translation:m.translation||'',limit:8});}catch(err){e.textContent='подбор недоступен: '+err.message;return;}
  if(seq!==suggSeq||!$('sugg'))return;
  const cur=(m.site_id||'').split(',').map(x=>x.trim());
  e.innerHTML=hits.length?('Похоже на страницы сайта:<br>'+hits.map(s=>`<span class="suggest" data-id="${esc(s.id)}" data-tip="${esc((s.kind==='motif'?'мотив':'элемент')+' · совпадение '+s.score)}">${cur.includes(s.id)?'✓ ':''}${esc(s.az||s.id)}</span> <span style="color:var(--mut)">${esc(s.ru||'')} · ${esc(s.id)}</span>`).join('<br>')):'Совпадений на сайте не нашлось — можно выбрать из списка.';
  e.querySelectorAll('.suggest').forEach(x=>x.onclick=()=>{const ids=(m.site_id||'').split(',').map(t=>t.trim()).filter(Boolean);if(!ids.includes(x.dataset.id))ids.push(x.dataset.id);m.site_id=ids.join(', ');markDirty();renderRight();});}

function workPayload(){const F=S.fig;const p={quad:F.quad.map(q=>q.map(v=>+v.toFixed(2))),adjust:F.adj,grid:F.grid,classify:{tones:F.cls.tones,inner:F.cls.inner,thr:F.cls.thr,centers:F.cls.centers},
  palette:F.palette,palette_names:F.palNames,palette_touched:F.palTouched,meta:F.meta,done:F.done,review:!!F.review,transparent_bg:F.transparent,difficulty:F.difficulty||null};
  if(F.M){const M=F.M,rows=[];for(let j=0;j<M.h;j++){let r='';for(let i=0;i<M.w;i++){const v=M.d[j*M.w+i];r+=v?v.toString(36):'.';}rows.push(r);}p.matrix={w:M.w,h:M.h,origin:[M.ox,M.oy],rows};}
  return p;}
function trimSilent(){ // автообрезка по рамке рисунка перед сохранением — не нужно жать «обрезать» руками каждый раз
  const F=S.fig,M=F.M;if(!M)return;let x0=M.w,y0=M.h,x1=-1,y1=-1;
  for(let j=0;j<M.h;j++)for(let i=0;i<M.w;i++)if(M.d[j*M.w+i]){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}
  if(x1<0)return;const m=F.trimMargin|0;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(M.w-1,x1+m);y1=Math.min(M.h-1,y1+m);
  if(x0===0&&y0===0&&x1===M.w-1&&y1===M.h-1)return;
  resizeM(x0,y0,x1-x0+1,y1-y0+1);}
async function saveFigure(silent){const F=S.fig;if(!F)return;
  if(F.M){trimSilent();if(S.mode==='pix'){renderRight();redraw();}}
  if(!silent)stat('сохраняю…','busy');const r=await api('/api/work/'+encodeURIComponent(F.id),workPayload());
  F.work.saved_at=r.saved_at;S.dirty=false;const b=$('saveBtn');if(b)b.classList.remove('on');outLinks();
  await refreshFigures();if(!silent)stat('сохранено ✓','ok');}
async function renameFigure(nid){const F=S.fig;if(!nid||nid===F.id)return;if(!/^[\w\-]+$/.test(nid)){stat('id: только латиница, цифры, _ и -','err');return;}
  await saveFigure(true);await api('/api/rename/'+encodeURIComponent(F.id),{new_id:nid});F.id=nid;await refreshFigures();$('cur').textContent=nid;stat('переименовано','ok');}

  $('lgInfo').textContent='сейчас строк: '+S.legend.length;
  $('lgLoad').onclick=()=>$('lgF').click();
  $('lgF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const t=await f.text();const r=await api('/api/legend',{csv:t});S.legend=await api('/api/legend');stat('легенда: '+r.rows+' строк','ok');renderRight();}catch(er){fail(er);}};
  $('lgDl').onclick=e=>{e.preventDefault();const cols=['table','fig','section','name_az','name','translation','carpet','type','note'];
    const q=v=>/[",\n]/.test(v||'')?'"'+String(v).replace(/"/g,'""')+'"':(v||'');
    const csv=[cols.join(',')].concat(S.legend.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='legend.csv';a.click();};
}

/* ============================ правая панель: диспетчер ============================ */
function renderRight(){
  if(S.mode==='sheet')renderRightSheet();
  else if(S.mode==='grid')renderRightGrid();
  else if(S.mode==='pix')renderRightPix();
  else{renderRightCat();renderCatalog();}
}

/* ============================ клавиатура ============================ */
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();if(e.repeat)return;spaceDown=true;cv.style.cursor='grab';
    if(S.mode==='pix'&&S.fig&&S.fig.M){S.peek=true;$('peek').style.display='block';redraw();}return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(S.fig)saveFigure().catch(fail);return;}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  const sheetSel=S.mode==='sheet'&&S.sheet&&S.sheet.sel>=0;   // на листе с выделенной рамкой цифры = сложность
  if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&['1','2','3','4'].includes(e.key)&&S.mode!=='pix'&&!sheetSel){setMode(['sheet','grid','pix','cat'][+e.key-1]);return;}
  if((e.key==='['||e.key===']')&&S.fig&&(S.mode==='grid'||S.mode==='pix')){gotoFig(e.key===']'?1:-1).catch(fail);return;}
  if(e.key==='='||e.key==='+'){zoomAt(1.25,V.w/2,V.h/2);return;}
  if(e.key==='-'){zoomAt(0.8,V.w/2,V.h/2);return;}
  if(e.key==='0'&&S.mode!=='pix'&&!sheetSel){const h=H();h&&h.fit&&h.fit();return;}
  if(S.mode==='grid'&&e.key.toLowerCase()==='q'){S.gridView=S.gridView==='quad'?'grid':'quad';renderRight();H().fit();return;}
  const h=H();if(h&&h.key&&h.key(e))e.preventDefault();
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;cv.style.cursor='';if(S.peek){S.peek=false;$('peek').style.display='none';redraw();}}});
window.addEventListener('blur',()=>{spaceDown=false;if(S.peek){S.peek=false;$('peek').style.display='none';redraw();}});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('resize',resize);

/* ============================ старт ============================ */
(async()=>{
  resize();
  try{
    [S.sheets,S.figures,S.siteIndex,S.legend]=await Promise.all([api('/api/sheets'),api('/api/figures'),api('/api/site_index'),api('/api/legend')]);
    stat('бэкенд на связи · листов '+S.sheets.length+' · рисунков '+S.figures.length,'ok');
  }catch(e){stat('⚠ бэкенд не отвечает — запустите uvicorn backend:app --port 8000','err');}
  // deep-link с сайта: ?fid=t14_f02 — открыть конкретный рисунок; ?site_id=elem_адам — показать все рисунки, привязанные к странице сайта
  const qp=new URLSearchParams(location.search),qFid=qp.get('fid')||qp.get('id'),qSite=qp.get('site_id')||qp.get('elem');
  if(qFid&&S.figures.some(f=>f.id===qFid)){
    try{await openFigure(qFid);setMode(S.fig.M?'pix':'grid');stat('открыт по ссылке: '+qFid,'ok');}catch(e){fail(e);setMode('sheet');}
  }else if(qSite){
    const matches=S.figures.filter(f=>(f.site_id||'').split(',').map(x=>x.trim()).includes(qSite));
    if(matches.length===1){try{await openFigure(matches[0].id);setMode(S.fig.M?'pix':'grid');stat('открыт по привязке к '+qSite,'ok');}catch(e){fail(e);setMode('sheet');}}
    else{S.catQ=qSite;setMode('cat');stat(matches.length?('найдено рисунков: '+matches.length):('рисунков с привязкой к '+qSite+' не найдено'),matches.length?'ok':'err');}
  }else{setMode('sheet');}
})();
</script></body></html>
