# carpet.wiki + www → лендинг (контейнер carpetwiki-site из docker-compose.existing-nginx.yml)
# Положить в /home/vallefor/upriver-server/data/nginx/conf.d/carpet.wiki.conf (шаг 4 в CARPET_WIKI.md)
server {
  listen 80;
  server_name carpet.wiki www.carpet.wiki;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://carpet.wiki$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.carpet.wiki;
  ssl_certificate     /etc/letsencrypt/live/carpet.wiki/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/carpet.wiki/privkey.pem;
  return 301 https://carpet.wiki$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name carpet.wiki;
  ssl_certificate     /etc/letsencrypt/live/carpet.wiki/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/carpet.wiki/privkey.pem;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $site_up http://carpetwiki-site:80;
  location / {
    proxy_pass $site_up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
