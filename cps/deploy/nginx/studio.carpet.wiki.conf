# studio.carpet.wiki → CPS (тот же контейнер cps, что и cps.jeyran.az; данные не переносятся)
# Положить в /home/vallefor/upriver-server/data/nginx/conf.d/studio.carpet.wiki.conf (шаг 4 в CARPET_WIKI.md)
server {
  listen 80;
  server_name studio.carpet.wiki;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name studio.carpet.wiki;
  ssl_certificate     /etc/letsencrypt/live/carpet.wiki/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/carpet.wiki/privkey.pem;

  client_max_body_size 100m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $cps_up http://cps:8000;
  location / {
    proxy_pass $cps_up;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
}
