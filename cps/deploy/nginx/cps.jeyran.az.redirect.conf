# ШАГ 6 (только после того, как studio.carpets.wiki заработал): заменить им cps.jeyran.az.conf.
# Старый адрес отдаёт постоянный редирект на новый с тем же путём (/m, /api/... и т.д.).
server {
  listen 80;
  server_name cps.jeyran.az;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://studio.carpets.wiki$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name cps.jeyran.az;
  ssl_certificate     /etc/letsencrypt/live/cps.jeyran.az/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cps.jeyran.az/privkey.pem;
  return 301 https://studio.carpets.wiki$request_uri;
}
